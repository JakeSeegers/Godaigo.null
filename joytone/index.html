// ── DRUMMER MODE ────────────────────────────────────────────────────
// When ON, every generated riff pulls a random drum loop from the MIDI
// library's Half-time and 4-on-the-floor decks — a DIFFERENT loop for each
// section — and swaps it in for the theme's baked drums. The loop's notes are
// baked into the section, so once a section is generated its drums are locked:
// later riffs / grows never rewrite it. Short loops repeat automatically
// (the scheduler loops each track to its own natural length).
let _drummerMode = false;
const DRUMMER_FEELS = ['halftime', '4otf'];
const _drummerLoopCache = {};  // midi path → [{label,instrument,notes,…}] template

function toggleDrummerMode() {
  _drummerMode = !_drummerMode;
  const b = document.getElementById('btn-drummer');
  b.textContent = _drummerMode ? '🥁 Drummer: On' : '🥁 Drummer: Off';
  b.classList.toggle('on', _drummerMode);
  setStatus(_drummerMode
    ? '🥁 Drummer ON — riffs pull a random Half-time / 4-on-the-floor loop per section'
    : "Drummer off — riffs use the theme's own drums");
  if (_drummerMode) loadManifest().catch(()=>{});  // warm the manifest
}

// Fetch + parse one random loop from the drummer decks (cached per file).
// Returns { name, tracks } where tracks are template drum tracks (kick/snare/hat).
async function pickDrummerLoop() {
  const man = await loadManifest();
  const pool = man.filter(e => e.deck === 'drums' && DRUMMER_FEELS.includes(e.feel));
  if (!pool.length) throw new Error('no drum loops in library');
  const entry = pool[(Math.random() * pool.length) | 0];
  if (!_drummerLoopCache[entry.path]) {
    const r = await fetch(entry.path);
    if (!r.ok) throw new Error('failed to fetch ' + entry.path);
    const parsed = parseMidi(await r.arrayBuffer());
    _drummerLoopCache[entry.path] = Object.values(parsed.sections['A'].tracks)
      .filter(t => ['kick','snare','hat'].includes(t.instrument));
  }
  return {
    name: entry.path.split('/').pop().replace(/\.midi?$/i, ''),
    tracks: _drummerLoopCache[entry.path],
  };
}

// Swap every section's drums in a freshly-built riff for random library loops.
// Keeps the theme's drum mix (THEME_FX volumes/effects by role) so the loops
// sit in the same sonic slot the baked drums did. Returns the loop names used.
async function applyDrummerToRiff(riff) {
  const used = [];
  for (const secId of riff.sectionOrder) {
    const sec = riff.sections[secId];
    let pick;
    try { pick = await pickDrummerLoop(); }
    catch (e) { setStatus('🥁 Drummer: ' + e.message, true); return used; }

    for (const [tid, t] of Object.entries(sec.tracks))
      if (isDrumTrack(t)) delete sec.tracks[tid];

    pick.tracks.forEach((src, i) => {
      const fxKey = src.instrument === 'hat' ? 'Hat'
                  : src.instrument === 'snare' ? 'Snare' : 'Kick';
      const fxDef = THEME_FX[fxKey];
      const tid = uid();
      sec.tracks[tid] = {
        id: tid, label: src.label,
        instrument: fxDef?.instrument ?? src.instrument,
        color: src.color,
        volume: fxDef?.volume ?? src.volume,
        muted: false, soloed: false,
        reverbSend: fxDef?.reverbSend ?? 0.06,
        notes: src.notes.map(n => ({ ...n, id: uid() })),
        effects: fxDef ? { ...DEFAULT_FX(), ...fxDef.effects } : { ...src.effects },
      };
    });
    used.push(pick.name);
  }
  return used;
}


// ── HARMONIC PATTERN CHORD GENERATOR ──────────────────────────────
// Generates chord progressions using four music-theory patterns.
// Output is a fake "incomingTracks" object that feeds directly into
// expandChordRoles() so all five tracks are produced automatically.

const HARM_TYPES = {
  maj:  [0,4,7],
  min:  [0,3,7],
  dom7: [0,4,7,10],
  maj7: [0,4,7,11],
  min7: [0,3,7,10],
  hdim: [0,3,6,10],
  sus4: [0,5,7],
};

// Find best root MIDI for a pitch class centred near targetMid
function voiceRoot(pc, targetMid) {
  let r = targetMid - ((targetMid - pc + 144) % 12);
  while (r < targetMid - 6) r += 12;
  while (r > targetMid + 6) r -= 12;
  return r;
}

function buildHarmChord(pc, type, targetMid=65) {
  const r = voiceRoot(pc, targetMid);
  return (HARM_TYPES[type]||HARM_TYPES.min).map(iv=>r+iv);
}

// Pattern 1 — Walkdown (Megalovania-style)
// Static minor triad in upper voices, bass descends chromatically
function harmWalkdown(rootPc, bars=4) {
  const upperRoot = voiceRoot(rootPc, 65);
  const upper = [upperRoot, upperRoot+3, upperRoot+7]; // minor triad
  const bassStart = upperRoot - 24;                     // 2 octaves down
  return Array.from({length:bars}, (_,i) => ({
    notes: [bassStart-i, ...upper], dur:4
  }));
}

// Pattern 2 — ii–V groove (jazz/modal)
// Alternates ii min7 and V dom7 for a driving two-chord loop
function harmIIV(rootPc, bars=4) {
  const iiPc = (rootPc+2)%12;   // supertonic
  const vPc  = (rootPc+7)%12;   // dominant
  const ii = buildHarmChord(iiPc, 'min7', 65);
  const v  = buildHarmChord(vPc,  'dom7', 65);
  return Array.from({length:bars}, (_,i) => ({ notes: i%2===0?ii:v, dur:4 }));
}

// Pattern 3 — Deceptive cadence cycle
// V7 → vi (surprise) → I → IV, subverts the expected V→I resolution
function harmDeceptive(rootPc, bars=4) {
  const I  = buildHarmChord(rootPc,       'min',  65);
  const IV = buildHarmChord((rootPc+5)%12,'maj',  65);
  const V7 = buildHarmChord((rootPc+7)%12,'dom7', 65);
  const vi = buildHarmChord((rootPc+9)%12,'min',  65);
  return [{notes:V7,dur:4},{notes:vi,dur:4},{notes:I,dur:4},{notes:IV,dur:4}]
    .slice(0,bars);
}

// Pattern 4 — Non-diatonic twist with common-tone voice leading
// Inserts outside chords that share the minor 3rd as a common tone
function harmTwist(rootPc, bars=4) {
  const commonPc = (rootPc+3)%12;           // minor third (e.g., F in D minor)
  const ch1 = buildHarmChord((commonPc-1+12)%12, 'maj',  65); // semitone below common = C#maj
  const ch2 = buildHarmChord((commonPc+2)%12,    'maj',  65); // whole step above = Eb maj
  const ch3 = buildHarmChord((rootPc+10)%12,     'maj7', 65); // bVII maj7
  const ch4 = buildHarmChord(rootPc,             'min',  65); // back to tonic
  return [ch1,ch2,ch3,ch4].slice(0,bars).map(n=>({notes:n,dur:4}));
}

const HARM_STYLES = ['walkdown','iiV','deceptive','twist'];
let harmStyleIdx = 0; // cycles on each generate press

function generateHarmonicProgression(rootPc, style) {
  const chosen = style || HARM_STYLES[harmStyleIdx % HARM_STYLES.length];
  const build  = {walkdown:harmWalkdown, iiV:harmIIV,
                  deceptive:harmDeceptive, twist:harmTwist}[chosen] || harmWalkdown;
  const chordSeq = build(rootPc);

  // Convert chord sequence → note array in the format expandChordRoles expects
  const notes = [];
  let beat = 0;
  for (const {notes:cn, dur} of chordSeq) {
    for (const midi of cn)
      notes.push({id:uid(), beatStart:beat, duration:dur-0.08, midiNote:midi, velocity:82});
    beat += dur;
  }
  // Return as a single-track object (expandChordRoles groups simultaneous notes into chords)
  return { 'hpgen': { id:'hpgen', label:'Generated', instrument:'organ', notes } };
}

// ── GROOVE BASSLINE GENERATOR ──────────────────────────────────────
// The bass bridges drums and harmony: its rhythm locks to the kick pattern
// when one is known (root on every kick, fifths between), its pitches are
// the chords' harmonic roots, and approach tones come from the same
// chord-derived collection as the melody. When no kick pattern is provided
// (library drum loops), a fixed groove is used instead.
// Groove entries: { b: beat-offset 0–3, r: 'root'|'fifth'|'octave'|'approach'|'rest' }

const BASS_GROOVES = [
  // A — walking 4/4: root fifth root approach
  [{b:0,r:'root'},{b:1,r:'fifth'},{b:2,r:'root'},{b:3,r:'approach'}],
  // B — half-note groove: root (held) then fifth (held)
  [{b:0,r:'root'},{b:2,r:'fifth'}],
  // C — root + tail: root, rest, fifth, approach
  [{b:0,r:'root'},{b:2,r:'fifth'},{b:3,r:'approach'}],
  // D — octave bounce: root octave root approach
  [{b:0,r:'root'},{b:1,r:'octave'},{b:2,r:'root'},{b:3,r:'approach'}],
  // E — syncopated 8ths: root on 1, push on 2.5, root on 3, approach on 3.5
  [{b:0,r:'root'},{b:1.5,r:'fifth'},{b:2,r:'root'},{b:3.5,r:'approach'}],
];

function generateBasslineNotes(chords, kickHits = []) {
  const LO=33, HI=52; // A1–E3

  function inRange(pc, prevNote) {
    let best=LO, bd=999;
    for (let m=LO; m<=HI; m++) {
      if (((m%12)+12)%12===pc) { const d=Math.abs(m-prevNote); if(d<bd){bd=d;best=m;} }
    }
    return best;
  }

  // Same chord-derived collection the melody draws from (full diatonic set —
  // the bass needs stepwise approach tones the pentatonic doesn't have).
  const keyPc = detectMelodyKey(chords);
  const COLL = new Set([0,2,4,5,7,9,11].map(iv => (keyPc + iv) % 12));

  const notes = [];
  let prev = inRange(harmonicRootPc(chords[0]), 40);

  // Fallback groove for when there's no kick pattern to lock to —
  // one per section, consistent, not re-rolled per chord
  const groove = BASS_GROOVES[Math.floor(Math.random() * BASS_GROOVES.length)];

  for (let ci=0; ci<chords.length; ci++) {
    const chord  = chords[ci];
    const cStart = chord[0].beatStart;
    const cLen   = ci<chords.length-1
      ? chords[ci+1][0].beatStart - cStart
      : Math.max(chord[0].duration, 2);

    const chordRootPc = harmonicRootPc(chord);
    const root   = inRange(chordRootPc, prev);
    const fifth  = inRange((chordRootPc+7)%12, root);
    const octave = root+12<=HI ? root+12 : root; // octave up, or same if too high

    // Approach into the next chord: a collection tone a step below (preferred)
    // or above the next root; chromatic semitone only as a last resort, and
    // chromatic approaches are kept to short pickups below.
    const nextRootPc = ci<chords.length-1
      ? harmonicRootPc(chords[ci+1])
      : chordRootPc;
    const nextRoot = inRange(nextRootPc, root);
    const cands = [(nextRootPc+10)%12, (nextRootPc+2)%12].filter(pc => COLL.has(pc));
    // Prefer a candidate that isn't a semitone against the chord it sounds
    // over (the approach plays while the CURRENT chord/drone still holds).
    const clean = cands.find(pc => {
      const d = (pc - chordRootPc + 12) % 12;
      return d !== 1 && d !== 11;
    });
    let approach, approachChromatic = false;
    const pick = clean ?? cands[0];
    if (pick != null) approach = inRange(pick, nextRoot);
    else { approach = Math.max(LO, nextRoot-1); approachChromatic = true; }

    const noteMap = { root, fifth, octave, approach };

    // Build this chord's hits: lock to the kick pattern when present
    // (root on the downbeat kick, alternating fifth/root on later kicks,
    // plus an 8th-note pickup into the next chord), else repeat the groove.
    const hits = [];
    const kicksIn = kickHits
      .map(k => k.beatStart - cStart)
      .filter(b => b >= -0.01 && b < cLen - 0.05)
      .sort((a,b) => a-b);
    if (kicksIn.length) {
      kicksIn.forEach((b, j) =>
        hits.push({ off: Math.max(0, b), r: j === 0 ? 'root' : (j % 2 ? 'fifth' : 'root') }));
      if (ci < chords.length-1 && cLen >= 2 && cLen-0.5 > kicksIn[kicksIn.length-1] + 0.05)
        hits.push({ off: cLen-0.5, r:'approach', pickup:true });
    } else {
      for (let rep=0; rep*4 < cLen-0.05; rep++) {
        for (const {b,r} of groove) {
          const off = rep*4 + b;
          if (off < cLen-0.05) hits.push({ off, r });
        }
      }
      // Force last hit in chord to approach (only if there's a next chord)
      if (hits.length && ci < chords.length-1)
        hits[hits.length-1] = { ...hits[hits.length-1], r:'approach' };
    }

    for (let hi=0; hi<hits.length; hi++) {
      const {off, r, pickup} = hits[hi];
      if (r==='rest') continue;

      const note = noteMap[r] ?? root;

      // Duration: extend through any following rests to next sounding hit or chord end
      let durEnd = hi+1;
      while (durEnd<hits.length && hits[durEnd].r==='rest') durEnd++;
      const endOff = durEnd<hits.length ? hits[durEnd].off : cLen;
      let dur = Math.max(0.15, (endOff-off)*0.87);
      // Pickups and chromatic approaches stay short — never a sustained rub
      if (pickup || (r==='approach' && approachChromatic)) dur = Math.min(dur, 0.45);

      notes.push({
        id:uid(), beatStart:cStart+off, duration:dur, midiNote:note,
        velocity: (r==='root'||r==='octave') ? 88+Math.floor(Math.random()*16)
                                             : 70+Math.floor(Math.random()*14)
      });
      prev = note;
    }
  }
  return notes;
}

// Takes a parsed chord MIDI and returns role tracks. Options let the elemental
// loader pick instruments/reverb per element and turn the arpeggio off/light/full;
// the defaults reproduce the original Library-import arrangement (organ + bass + 16th pluck).
function expandChordRoles(incomingTracks, opts={}) {
  const o = {
    chordInst:'organ', chordVol:0.7, chordReverb:0.35, chordColor:'#ffb74d', chordFx:{ filterCutoff:1200 },
    bass:true,     bassInst:'bass',    bassVol:0.6,  bassReverb:0.06,  bassColor:'#4db6ac',
    bassLine:true, bassLineInst:'bass', bassLineVol:0.72, bassLineReverb:0.08, bassLineColor:'#81c784',
    pad:true,      padInst:'synth',    padVol:0.16,  padReverb:0.5,    padColor:'#90a4ae',
    arp:'full',    arpInst:'pluck',    arpVol:0.32,  arpReverb:0.10,   arpColor:'#ff6b6b',
    melody:true,   melodyInst:'flute', melodyVol:0.42, melodyReverb:0.30, melodyColor:'#ce93d8',
    melodySeed: null, // theme seed (rootPc/scale/hooks) — when set, melody speaks the theme
    kickHits: [],  // { beatStart } array from kick track — locks bass line rhythm to kick
    chordStyle: 'stab', // 'held' | 'stab' | 'pump' | 'power'  — stab is now the default
    arpMode: 'standard', // 'standard' | 'chip'
    ...opts
  };

  const allNotes = [];
  for (const t of Object.values(incomingTracks))
    for (const n of t.notes) allNotes.push(n);
  allNotes.sort((a,b) => a.beatStart - b.beatStart || a.midiNote - b.midiNote);
  if (!allNotes.length) return null;

  // Theme bed: when a seed is present, snap the whole harmonic source into the
  // theme's collection BEFORE chords/bass/arp/pad derive from it. The diatonic
  // pattern generators put thirds/sevenths/chromatic walkdowns outside the
  // scale (Ab, C#, F#…) — a wall of off-theme arpeggio that buried the modal
  // melody. Snapping at the source makes the entire arrangement speak the theme
  // and stops the bed from fighting the tune. (Root + fifth survive untouched —
  // both are in miyako-bushi — so power chords stay consonant.)
  if (o.melodySeed) {
    const collPcs = o.melodySeed.scale.map(iv => (o.melodySeed.rootPc + iv) % 12);
    const snap = midi => {
      const pc = ((midi % 12) + 12) % 12;
      let best = 0, bd = 99;
      for (const c of collPcs) {
        let d = (c - pc + 12) % 12; if (d > 6) d -= 12;
        if (Math.abs(d) < bd) { bd = Math.abs(d); best = d; }
      }
      return midi + best;
    };
    for (const n of allNotes) n.midiNote = snap(n.midiNote);
  }

  const chords = groupChords(allNotes);

  // ── Chord voicing ──────────────────────────────────────────────────
  // 'held'  – full duration (original MIDI authoring, default for library drops)
  // 'stab'  – short rhythmic hits on beats 0 and 2, breathing space between
  // 'pump'  – 8th-note pattern: chord hit + walking individual tones
  // 'power' – chip-style: root+fifth only as syncopated stabs (no clashing thirds)
  function voiceChords(chords, style) {
    if (style === 'held')
      return allNotes.map(n => ({...n, id:uid()}));

    // Stab rhythm patterns — one is chosen per section and repeated for every
    // chord so the comping is a consistent motif, not a new rhythm per bar.
    const STAB_PATTERNS = [
      [{b:0,dur:.90,vel:90},{b:2,dur:.45,vel:72}],                              // standard: 0 + 2
      [{b:0,dur:.90,vel:88},{b:2,dur:.90,vel:80}],                              // two equal hits
      [{b:0,dur:.45,vel:88},{b:.5,dur:.40,vel:70},{b:2,dur:.90,vel:84}],       // quick double then 2
      [{b:0,dur:1.8,vel:86},{b:2.5,dur:.42,vel:68}],                            // long hit + offbeat pickup
      [{b:0,dur:.90,vel:90},{b:1.5,dur:.42,vel:66},{b:3,dur:.42,vel:74}],      // 3 hits with syncopation
      [{b:0,dur:.45,vel:88},{b:1,dur:.90,vel:76},{b:3,dur:.45,vel:72}],        // pushed 2nd hit
      [{b:0,dur:.90,vel:85},{b:2,dur:.45,vel:70},{b:3.5,dur:.35,vel:65}],      // 2 + anticipation
    ];
    const stabIdx = (Math.random()*STAB_PATTERNS.length)|0;

    const voiced = [];
    for (let ci = 0; ci < chords.length; ci++) {
      const chord  = chords[ci];
      const cStart = chord[0].beatStart;
      const cLen   = ci < chords.length-1
        ? chords[ci+1][0].beatStart - cStart
        : Math.max(chord[0].duration, 2);
      const sorted = [...chord].sort((a,b) => a.midiNote - b.midiNote);
      const mk = (beat, dur, midi, vel) =>
        ({ id:uid(), beatStart:cStart+beat, duration:dur, midiNote:midi, velocity:vel });

      if (style === 'stab') {
        // Final chord: a single sustained hit so the phrase cadences
        // instead of stabbing right through the loop point.
        const hits = (ci === chords.length-1
          ? [{b:0, dur:Math.min(3.4, cLen*0.9), vel:86}]
          : STAB_PATTERNS[stabIdx]).filter(h => h.b < cLen);
        for (const h of hits)
          for (const n of sorted) voiced.push(mk(h.b, h.dur, n.midiNote, h.vel));

      } else if (style === 'pump') {
        // Beat 0: full chord stab. Beats 1,3: single cycling tones. Beat 2: chord stab.
        const pattern = [
          {b:0,   all:true,  dur:0.85, vel:90},
          {b:1,   all:false, dur:0.42, vel:68, ni:0},
          {b:2,   all:true,  dur:0.85, vel:80},
          {b:3,   all:false, dur:0.42, vel:65, ni:1},
        ].filter(s => s.b < cLen);
        for (const s of pattern) {
          if (s.all) { for (const n of sorted) voiced.push(mk(s.b, s.dur, n.midiNote, s.vel)); }
          else { const n = sorted[s.ni % sorted.length]; voiced.push(mk(s.b, s.dur, n.midiNote, s.vel)); }
        }

      } else if (style === 'power') {
        // Root + fifth only, syncopated pattern — no third, no clashing harmonics
        const root  = sorted[0].midiNote;
        const fifth = sorted.find(n => (n.midiNote - root + 12) % 12 === 7)?.midiNote ?? root+7;
        const hits  = [{b:0,vel:92,dur:0.9},{b:1.5,vel:70,dur:0.4},{b:2,vel:85,dur:0.9},{b:3.5,vel:68,dur:0.35}]
          .filter(h => h.b < cLen);
        for (const h of hits) {
          voiced.push(mk(h.b, h.dur, root,  h.vel));
          voiced.push(mk(h.b, h.dur, fifth, h.vel - 5));
        }
      }
    }
    return voiced;
  }

  const chordNotes = voiceChords(chords, o.chordStyle);

  // Bass drone — one long held HARMONIC root per chord, voiced in a fixed
  // low octave (C2–B2). Drone and bass line now share one pitch foundation;
  // doubling the authored lowest note let walkdown/inversion voicings put
  // the two bass voices a semitone apart in the same register (mud, not
  // colour — the chromatic character still lives in the chord voicings).
  const bassNotes = o.bass ? chords.map((chord, i) => {
    const cStart   = chord[0].beatStart;
    const nextBeat = i < chords.length-1 ? chords[i+1][0].beatStart
                                         : cStart + chord[0].duration;
    const vel = chord.reduce((m,n) => Math.max(m, n.velocity||80), 80);
    return { id:uid(), beatStart:cStart,
      duration:Math.max(nextBeat - cStart, 0.5),
      midiNote: 36 + harmonicRootPc(chord),   // C2..B2
      velocity: Math.min(vel+10, 120) };
  }) : [];

  // Bass line — rhythm locks to the kick pattern when the caller provides
  // one (Unflip tiles, MIDI imports with kick tracks); grooves otherwise.
  const bassLineNotes = o.bassLine
    ? generateBasslineNotes(chords, o.kickHits || [])
    : [];

  // Glue pad — a quiet open fifth (no 3rd) held under each chord. Built on
  // the chord's HARMONIC root (not the literal lowest note), so inversions
  // and chromatic bass lines don't put the fifth on a non-chord tone.
  const padNotes = o.pad ? chords.flatMap((chord, i) => {
    const cStart   = chord[0].beatStart;
    const nextBeat = i < chords.length-1 ? chords[i+1][0].beatStart
                                         : cStart + chord[0].duration;
    const dur = Math.max(nextBeat - cStart, 0.5);
    let root = 48;
    while (pcOf(root) !== harmonicRootPc(chord)) root++;
    return [
      { id:uid(), beatStart:cStart, duration:dur, midiNote:root,   velocity:52 },
      { id:uid(), beatStart:cStart, duration:dur, midiNote:root+7, velocity:46 },
    ];
  }) : [];

  // Arpeggio — cycling chord tones; 'light' = 8ths, 'full' = 16ths, 'off' = none.
  // One contour (rising or ping-pong) per section, kept within an octave of
  // the chord voicing so it doesn't collide with the melody's register.
  const arpNotes = [];
  if (o.arp && o.arp !== 'off') {
    const step   = o.arp === 'light' ? 0.5 : o.arp === 'turbo' ? 0.125 : 0.25;
    const upDown = o.arpMode !== 'chip' && Math.random() < 0.5;
    for (let i = 0; i < chords.length; i++) {
      const chord  = chords[i];
      const start  = chord[0].beatStart;
      const end    = i < chords.length-1 ? chords[i+1][0].beatStart
                                         : start + chord[0].duration;
      // Stable chord tones only — cycling the chromatic walkdown bass or an
      // inversion artifact on 16ths sounded like a melody full of wrong notes.
      const stable = new Set(stableChordPcs(chord));
      const tones  = [...chord].sort((a,b) => a.midiNote - b.midiNote)
        .filter(n => stable.has(pcOf(n.midiNote)));
      if (!tones.length) continue;
      // chip mode: 3-note strict ascending cell (root-3rd-5th only)
      // standard:  chord tones + octave root — one octave cell
      const pool = o.arpMode === 'chip'
        ? tones.slice(0, 3).map(n => n.midiNote)
        : [...tones.map(n => n.midiNote), tones[0].midiNote + 12];
      const cyc = upDown ? Math.max(1, pool.length*2 - 2) : pool.length;
      let beat = start, idx = 0;
      while (beat < end - 0.01) {
        const k = idx % cyc;
        const onBeat = ((beat - start) % 1) < 0.01;
        arpNotes.push({
          id: uid(), beatStart: beat,
          duration: step * 0.85,
          midiNote: pool[upDown && k >= pool.length ? cyc - k : k],
          velocity: (onBeat ? 80 : 64) + ((Math.random()*8)|0)
        });
        beat += step; idx++;
      }
    }
  }

  const mkTrack = (label, instrument, notes, color, volume, reverbSend, extraFx={}) => ({
    id: uid(), label, instrument, color,
    volume, muted: false, soloed: false, reverbSend,
    notes,
    effects: { ...DEFAULT_FX(), ...(INST_FILTER[instrument]||{}), ...extraFx }
  });

  // Melody — rule-based single voice above the chords
  const melodyNotes = [];
  if (o.melody) melodyNotes.push(...generateMelodyNotes(chords, o.melodySeed));

  const out = [ mkTrack('Chords',    o.chordInst,    chordNotes,    o.chordColor,    o.chordVol,    o.chordReverb,    o.chordFx||{}) ];
  if (o.pad      && padNotes.length)      out.push(mkTrack('Pad',        o.padInst,      padNotes,      o.padColor,      o.padVol,      o.padReverb,
                                                            { filterType:'lowpass', filterCutoff:1100, filterRes:0.4 }));
  if (o.bass     && bassNotes.length)     out.push(mkTrack('Bass Drone', o.bassInst,     bassNotes,     o.bassColor,     o.bassVol,     o.bassReverb));
  if (o.bassLine && bassLineNotes.length) out.push(mkTrack('Bass Line',  o.bassLineInst, bassLineNotes, o.bassLineColor, o.bassLineVol, o.bassLineReverb));
  if (arpNotes.length)                    out.push(mkTrack('Arpeggio',   o.arpInst,      arpNotes,      o.arpColor,      o.arpVol,      o.arpReverb));
  if (melodyNotes.length)                 out.push(mkTrack('Melody',     o.melodyInst,   melodyNotes,   o.melodyColor,   o.melodyVol,   o.melodyReverb));
  return out;
}

// Compute what a MIDI import would change (read-only — no mutation yet)
function prepareImport(incomingTracks, targetSectionId) {
  const sec = project.sections[targetSectionId];
  const DRUM_INSTRUMENTS = new Set(['kick','snare','hat']);
  const isDrum = t => DRUM_INSTRUMENTS.has(t.instrument);
  const incomingValues = Object.values(incomingTracks);
  const incomingIsDrum = incomingValues.length > 0 && incomingValues.every(isDrum);

  const savedSettings = {};
  const savedSettingList = [];
  for (const t of Object.values(sec.tracks)) {
    if (isDrum(t) === incomingIsDrum) {
      const saved = {
        id:t.id, label:t.label, instrument:t.instrument, volume:t.volume,
        muted:t.muted, soloed:t.soloed, reverbSend:t.reverbSend,
        color:t.color,
        effects:{...t.effects}
      };
      savedSettings[t.label] = saved;
      savedSettingList.push(saved);
    }
  }
  const usedSavedSettings = new Set();
  const restore = track => {
    // Prefer exact label matches so Chords/Bass/Arpeggio each keep their own settings.
    const s = savedSettings[track.label];
    if (!s) return track;
    usedSavedSettings.add(s);
    return { ...track, instrument:s.instrument, volume:s.volume,
      muted:s.muted, soloed:s.soloed, reverbSend:s.reverbSend,
      color:s.color,
      effects:{...DEFAULT_FX(), ...s.effects} };
  };

  const toDelete = Object.entries(sec.tracks)
    .filter(([,t]) => isDrum(t) === incomingIsDrum).map(([id]) => id);

  let toAdd = [];
  if (!incomingIsDrum) {
    // Collect kick hits from any existing kick tracks, unwrapping the drum loop
    // to fill the full section so every chord bar has kick data to lock to.
    const kickHits = [];
    const secLen = sec.lengthBars * 4;
    for (const t of Object.values(sec.tracks)) {
      if (t.instrument !== 'kick' || !t.notes.length) continue;
      let rawLen = 0;
      for (const n of t.notes) rawLen = Math.max(rawLen, n.beatStart + n.duration);
      const loopLen = Math.max(4, Math.ceil(rawLen / 4) * 4);
      const repeats = Math.ceil(Math.max(secLen, 8) / loopLen);
      for (let rep = 0; rep < repeats; rep++)
        for (const n of t.notes)
          kickHits.push({ beatStart: n.beatStart + rep * loopLen });
    }
    const roles = expandChordRoles(incomingTracks, { kickHits });
    if (roles) toAdd = roles.map(restore);
  } else {
    toAdd = incomingValues.map(restore);
  }
  applyFxStyleToTracks(toAdd); // pinned 🧷 FX state wins over restored settings

  // Simulate resulting section to compute new length
  const simTracks = { ...sec.tracks };
  for (const id of toDelete) delete simTracks[id];
  for (const t of toAdd) simTracks[t.id] = t;
  let maxBeat = sec.lengthBars * 4;
  for (const t of Object.values(simTracks))
    for (const n of t.notes) maxBeat = Math.max(maxBeat, n.beatStart + n.duration);

  return { toDelete, toAdd, newLengthBars: Math.ceil(maxBeat / 4), incomingIsDrum };
}

// Apply a prepared import and refresh UI
function applyImport(prepared, targetSectionId) {
  const sec = project.sections[targetSectionId];
  for (const id of prepared.toDelete) delete sec.tracks[id];
  for (const t of prepared.toAdd) sec.tracks[t.id] = t;
  sec.lengthBars = prepared.newLengthBars;
  if (!sec.tracks[selectedTrackId] && prepared.toAdd.length) selectedTrackId = prepared.toAdd[0].id;
  ensureSelectedTrack();
  if (audioCtx) rebuildEngines();
  if (prepared.incomingIsDrum) captureLastDrums(sec);  // remember freshly-loaded drums
  renderTrackHeaders(); renderSectionUI();
  PR.gridDirty=true; PR.dirty=true; schedRedraw(); saveProject();
  const n = prepared.toAdd.length;
  setStatus(`Added ${n} track${n!==1?'s':''} to Section ${targetSectionId}`);
}

// Queue or immediately apply a prepared import
function scheduleImport(prepared, targetSectionId) {
  if (isPlaying) {
    pendingMidiSwap = { sectionId: targetSectionId,
      applyFn: () => applyImport(prepared, targetSectionId) };
    setStatus(`Changes queued — takes effect at next loop boundary`);
  } else {
    applyImport(prepared, targetSectionId);
  }
}

function importMidiFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = parseMidi(e.target.result);
      scheduleImport(prepareImport(parsed.sections['A'].tracks, activeSectionId), activeSectionId);
    } catch(err) { setStatus('MIDI import error: '+err.message, true); }
  };
  reader.readAsArrayBuffer(file);
}

// Drag-and-drop MIDI
document.addEventListener('dragover', e => {
  e.preventDefault();
  const ol = document.getElementById('drop-overlay');
  ol.textContent = `Drop MIDI → add to Section ${activeSectionId}`;
  ol.classList.add('visible');
});
document.addEventListener('dragleave', e => { if(!e.relatedTarget||e.relatedTarget===document.documentElement) document.getElementById('drop-overlay').classList.remove('visible'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.remove('visible');
  const file = e.dataTransfer.files[0];
  if (file && (file.name.endsWith('.mid')||file.name.endsWith('.midi'))) importMidiFile(file);
  else setStatus('Drop a .mid file to import', true);
});

// ── WAV BOUNCE ─────────────────────────────────────────────────────
async function bounceWav() {
  const bpm = project.tempo;
  // Calculate total duration
  let totalBars = 0;
  for (const id of project.sectionOrder) totalBars += (project.sections[id]?.lengthBars||2);
  const totalBeats = totalBars * 4;
  const totalSecs  = totalBeats * 60 / bpm + 1.5; // 1.5s tail

  setStatus('Bouncing… this may take a moment');
  // Decode the SoundFont first if any track in the song uses an SF voice.
  if (Object.values(project.sections).some(sec =>
        Object.values(sec.tracks).some(t => isSf2Instrument(t.instrument))))
    await ensureSf2Loaded();
  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oCtx = new AC(2, Math.ceil(totalSecs * 44100), 44100);

  // Recreate master chain in offline context
  const oNoise = createNoiseBuffer(oCtx);
  const oReverb = oCtx.createConvolver(); oReverb.buffer = buildReverbIR(oCtx, 2);
  const oRevRev = oCtx.createConvolver(); oRevRev.buffer = buildReverseReverbIR(oCtx, 2.6);
  const oDelay  = oCtx.createDelay(2); oDelay.delayTime.value = 0.375;
  const oDlyFB  = oCtx.createGain(); oDlyFB.gain.value = 0.35;
  oDelay.connect(oDlyFB); oDlyFB.connect(oDelay);
  const oRvRet  = oCtx.createGain(); oRvRet.gain.value = 0.5; oReverb.connect(oRvRet);
  const oRrRet  = oCtx.createGain(); oRrRet.gain.value = 0.6; oRevRev.connect(oRrRet);
  // Darker cap on the reverse-reverb return (mirrors the live rrLp @ 2800)
  const oRrLp   = oCtx.createBiquadFilter();
  oRrLp.type = 'lowpass'; oRrLp.frequency.value = 2800; oRrLp.Q.value = 0.4;
  const oDlRet  = oCtx.createGain(); oDlRet.gain.value = 0.4; oDelay.connect(oDlRet);
  const oComp   = oCtx.createDynamicsCompressor();
  oComp.threshold.value=project.masterFx.compThreshold ?? -18; oComp.ratio.value=project.masterFx.compRatio ?? 6; oComp.knee.value=8;
  const oLim    = oCtx.createDynamicsCompressor();
  oLim.threshold.value=project.masterFx.limiterCeiling ?? -1; oLim.ratio.value=20; oLim.knee.value=0; oLim.attack.value=0.001; oLim.release.value=0.05;
  const oBus    = oCtx.createGain(); oBus.gain.value = 1.0;                              // unity into the dynamics
  const oOut    = oCtx.createGain(); oOut.gain.value = project.masterFx.masterVolume;    // VOL: post-dynamics output trim
  oRvRet.connect(oComp); oRrRet.connect(oRrLp); oRrLp.connect(oComp); oDlRet.connect(oComp); oBus.connect(oComp);
  oComp.connect(oLim); oLim.connect(oOut); oOut.connect(oCtx.destination);

  // Schedule all sections
  let tOffset = 0;
  const savedCtx = audioCtx, savedNoise = noiseBuffer, savedBus = masterBus,
        savedRev = sharedReverb, savedRevRev = sharedRevRev, savedDly = sharedDelay,
        savedDelayReturn = delayReturn;
  audioCtx = oCtx; noiseBuffer = oNoise; masterBus = oBus;
  sharedReverb = oReverb; sharedRevRev = oRevRev; sharedDelay = oDelay; delayReturn = oDlRet;

  for (const secId of project.sectionOrder) {
    const sec = project.sections[secId];
    if (!sec) continue;
    const secLenSecs = sec.lengthBars * 4 * 60 / bpm;
    const anySolo = Object.values(sec.tracks).some(t => t.soloed);
    for (const track of Object.values(sec.tracks)) {
      if (track.muted || (anySolo && !track.soloed)) continue;
      track.effects = { ...DEFAULT_FX(), ...(track.effects || {}) };
      const engine = new TrackEngine(track);
      const hasRevRev = (track.effects.revrevSend || 0) > 0.01;
      for (const note of track.notes) {
        const t = tOffset + note.beatStart * 60 / bpm;
        playTrackMidiNote(track, note.midiNote, note.duration*60/bpm, t, engine.dest(), note.velocity);
        // Reverse-reverb pre-roll seed — same pitch-aware path as live playback
        // (now = -0.02 admits any seed with seedTime >= 0 on the offline timeline)
        if (hasRevRev && isRevRevPhraseLeader(track, note)) {
          scheduleRevRevGhost(track, note, t, -0.02, engine);
        }
      }
    }
    tOffset += secLenSecs;
  }

  audioCtx = savedCtx; noiseBuffer = savedNoise; masterBus = savedBus;
  sharedReverb = savedRev; sharedRevRev = savedRevRev; sharedDelay = savedDly;
  delayReturn = savedDelayReturn;

  const rendered = await oCtx.startRendering();
  const blob = audioBufferToWav(rendered);
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(project.title||'bounce')+'.wav'; a.click();
  setStatus('WAV exported');
}

function audioBufferToWav(buf) {
  const nCh=buf.numberOfChannels, sr=buf.sampleRate;
  const chs=[]; for(let i=0;i<nCh;i++) chs.push(buf.getChannelData(i));
  const pcm=new Float32Array(buf.length*nCh);
  for(let i=0;i<buf.length;i++) for(let c=0;c<nCh;c++) pcm[i*nCh+c]=chs[c][i];
  const dataLen=pcm.length*2, ab=new ArrayBuffer(44+dataLen), v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+dataLen,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nCh,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*nCh*2,true); v.setUint16(32,nCh*2,true);
  v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,dataLen,true);
  let o=44; for(let i=0;i<pcm.length;i++){const s=Math.max(-1,Math.min(1,pcm[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2;}
  return new Blob([ab],{type:'audio/wav'});
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────────
document.addEventListener('keydown', async e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  if (e.ctrlKey||e.metaKey) {
    if (e.key==='z') { e.preventDefault(); performUndo(); }
    return;
  }
  switch(e.key) {
    case ' ':
      e.preventDefault();
      if (isPlaying) { stopPlayback(); }
      else { await ensureAudio(); if (!audioCtx) break; startPlayback(0); }
      break;
    case 's': case 'S': setTool('pointer'); break;
    case 'e': case 'E': setTool('eraser'); break;
    case '+': case '=': zoomIn(); break;
    case '-': case '_': zoomOut(); break;
  }
});

function setTool(name) {
  activeTool = name;
  ['pointer','eraser'].forEach(t => {
    document.getElementById('tool-'+t).classList.toggle('active', t===name);
  });
  noteCanvas.style.cursor = name==='eraser'?'cell':'default';
}

function hissLabel(v) {
  if (v <= 0.001) return 'off';
  if (v <= 0.006) return 'low';
  if (v <= 0.013) return 'mid';
  return 'high';
}

function syncMasterStrip() {
  const fx = project.masterFx;
  document.getElementById('mc-vol').value  = fx.masterVolume;
  document.getElementById('mc-vol-val').textContent = fx.masterVolume.toFixed(2);
  document.getElementById('mc-bass').value = fx.bassGain;
  document.getElementById('mc-bass-val').textContent = (fx.bassGain >= 0 ? '+' : '') + fx.bassGain + ' dB';
  document.getElementById('mc-comp').value = fx.compThreshold;
  document.getElementById('mc-comp-val').textContent = fx.compThreshold;
  const norm = fx.limiterCeiling ?? -1;
  document.getElementById('mc-norm').value = norm;
  document.getElementById('mc-norm-val').textContent = norm >= -0.01 ? 'off' : norm + ' dB';
  document.getElementById('mc-hiss').value = fx.hissLevel;

  document.getElementById('btn-brown').classList.toggle('on', brownOn);

  document.getElementById('mc-derez-bits').value = bits;

  document.getElementById('mc-derez-mix').value = mix;
  document.getElementById('mc-derez-mix-val').textContent = mix === 0 ? 'off' : Math.round(mix*100)+'%';
}


function applyMasterFxToAudio(timeConstant=0.05) {
  if (!audioCtx || !project?.masterFx) return;
  const fx = project.masterFx;
  const now = audioCtx.currentTime;
  if (masterOut) masterOut.gain.setTargetAtTime(fx.masterVolume, now, timeConstant);
  if (bassBoost) {
    bassBoost.frequency.setTargetAtTime(fx.bassFreq ?? 120, now, timeConstant);
    bassBoost.gain.setTargetAtTime(fx.bassGain ?? 0, now, timeConstant);
  }
  if (compressor) {
    compressor.threshold.setTargetAtTime(fx.compThreshold ?? -18, now, timeConstant);
    compressor.ratio.setTargetAtTime(fx.compRatio ?? 6, now, timeConstant);
  }
  if (outputLimiter) outputLimiter.threshold.setTargetAtTime(fx.limiterCeiling ?? -1, now, timeConstant);
  if (hissGainNode && isPlaying) {
    hissGainNode.gain.setTargetAtTime(fx.hissLevel ?? 0, now, Math.max(timeConstant, 0.25));
  }
}

function captureTrackFxSettings(track) {
  return {
    id: track.id,
    label: track.label,
    instrument: track.instrument,
    color: track.color,
    // Conductor layers keep their intended mix level in _baseVol while gated
    // to 0 — capture the intent, not the momentary gate.
    volume: track._baseVol ?? track.volume,
    muted: track.muted,
    soloed: track.soloed,
    reverbSend: track.reverbSend,
    effects: cloneData({ ...DEFAULT_FX(), ...(track.effects || {}) })
  };
}

// Prefer an audible track as the role's representative so a muted/gated copy
// of the same role doesn't define the style.
function betterRoleRep(existing, candidate) {
  if (!existing) return candidate;
  const audible = t => !t.muted && num(t.volume, 0) > 0.001;
  return (!audible(existing) && audible(candidate)) ? candidate : existing;
}

function captureFxSnapshot(label) {
  const sections = {};
  const roles = {};
  for (const [secId, sec] of Object.entries(project.sections || {})) {
    sections[secId] = { label: sec.label, tracks: {} };
    for (const [trackId, track] of Object.entries(sec.tracks || {})) {
      const settings = captureTrackFxSettings(track);
      sections[secId].tracks[trackId] = settings;
      if (track.label) roles[track.label] = betterRoleRep(roles[track.label], settings);
    }
  }
  return {
    version: 2,
    id: uid(),
    label,
    createdAt: new Date().toISOString(),
    tempo: project.tempo,
    masterFx: cloneData({ ...DEFAULT_MASTER_FX(), ...(project.masterFx || {}) }),
    sections,
    // Per-role style (keyed by track label: Chords, Pad, Melody, Kick…) used
    // by 🧷 All-Tracks mode to restyle any current or future generated track.
    roles: cloneData(roles)
  };
}

function renderFxSnapshotUI() {
  const wrap = document.getElementById('fx-state-buttons');
  if (!wrap) return;
  wrap.innerHTML = '';
  fxSnapshots.forEach((snap, i) => {
    if (!snap.label) snap.label = `FX ${i+1}`;
    const btn = document.createElement('button');
    btn.className = 'fx-state-btn';
    btn.textContent = snap.label;
    btn.title = `${snap.label}: crossfade to this saved master/per-track FX state.`;
    btn.classList.toggle('on', fxStateSticky && snap.id === activeFxStateId);
    btn.addEventListener('click', () => recallFxSnapshot(i));
    wrap.appendChild(btn);
  });
  updateFxStickyUI();
}

function updateFxStickyUI() {
  const b = document.getElementById('btn-fx-sticky');
  if (b) b.classList.toggle('on', fxStateSticky);
}

function toggleFxSticky() {
  fxStateSticky = !fxStateSticky;
  if (!fxStateSticky) activeFxStateId = null;
  renderFxSnapshotUI();
  saveProject();
  setStatus(fxStateSticky
    ? '🧷 All-Tracks ON — click a saved FX state to apply it to every track, now and as new ones generate'
    : '🧷 All-Tracks off — FX states recall onto their original tracks only');
}

  renderFxSnapshotUI();

}

function normalizeFxSnapshot(snap, i=0) {
  const out = cloneData(snap || {});
  out.version = out.version || 1;
  out.id = out.id || uid();
  out.label = out.label || `FX ${i+1}`;
  out.masterFx = { ...DEFAULT_MASTER_FX(), ...(out.masterFx || {}) };
  out.sections = out.sections || {};
  out.roles = out.roles || {};
  for (const sec of Object.values(out.sections)) {
    sec.tracks = sec.tracks || {};
    for (const tr of Object.values(sec.tracks)) {
      tr.effects = { ...DEFAULT_FX(), ...(tr.effects || {}) };
      // Older v1 banks have no roles map — derive one so uploaded/legacy
      // states work with 🧷 All-Tracks mode too.
      if (tr.label) out.roles[tr.label] = betterRoleRep(out.roles[tr.label], tr);
    }
  }
  for (const r of Object.values(out.roles)) {
    r.effects = { ...DEFAULT_FX(), ...(r.effects || {}) };
  }
  return out;
}

// The style that should drive freshly generated tracks: ★ Meta State always
// wins once it has any roles (it's the designer's real, curated default);
// otherwise fall back to whatever's pinned by 🧷 All-Tracks mode, or null.
function activeFxStyle() {
  if (metaState.roles && Object.keys(metaState.roles).length) return metaState;
  if (!fxStateSticky || !activeFxStateId) return null;
  const snap = fxSnapshots.find(s => s && s.id === activeFxStateId);
  return snap ? normalizeFxSnapshot(snap) : null;
}

// Restyle tracks with a role-mapped style (activeFxStyle() by default —
// covers freshly generated tracks matched by role label: Chords, Pad, Bass
// Line, Melody, Arpeggio, Kick, Snare, Hat…), or an explicit style object
// (used by updateMetaState() to broadcast to every existing section, not
// just future ones). Generator presets run first; the style wins. Mute/solo
// are left alone — they're arrangement state, not sound design.
function applyFxStyleToTracks(tracks, style = activeFxStyle()) {
  if (!style) return;
  for (const t of tracks || []) {
    const r = style.roles[t.label];
    if (!r) continue;
    if (r.instrument) t.instrument = normalizeInstrument(r.instrument);
    t.volume     = num(r.volume, t.volume);
    t.reverbSend = num(r.reverbSend, t.reverbSend);
    if (r.color) t.color = r.color;
    t.effects = { ...DEFAULT_FX(), ...(r.effects || {}) };
  }
}

// ── ★ META STATE ─────────────────────────────────────────────────────
// Capture every track in the ACTIVE section into metaState.roles (by label —
// only the labels present here get touched) and immediately re-apply the
// updated map to every OTHER existing section too. That immediate broadcast
// is the whole point: without it, moving to a different section and
// updating a different instrument there would re-capture THIS section's
// still-unedited copy of the instrument you just fixed, silently reverting
// it. Sections created later (grown riffs) inherit it automatically via
// activeFxStyle() → applyThemeVariation(), same path as a 🧷 pin.
function updateMetaState() {
  const tracks = Object.values(activeTracks());
  if (!tracks.length) { setStatus('No tracks in this section to capture', true); return; }
  const labels = [];
  for (const t of tracks) {
    if (!t.label) continue;
    metaState.roles[t.label] = captureTrackFxSettings(t);
    labels.push(t.label);
  }
  metaState.updatedAt = new Date().toISOString();
  for (const sec of Object.values(project.sections || {}))
    applyFxStyleToTracks(Object.values(sec.tracks), metaState);
  renderTrackHeaders();
  renderMetaStateUI();
  saveProject();
  setStatus(`★ Meta state updated (${labels.join(', ')}) — applied to all ${project.sectionOrder.length} sections`);
}

function renderMetaStateUI() {
  const el = document.getElementById('meta-state-info');
  if (!el) return;
  const n = metaState.roles ? Object.keys(metaState.roles).length : 0;
  el.textContent = n ? `★ Meta: ${n} role${n !== 1 ? 's' : ''}` : '★ Meta: empty';
  el.title = metaState.updatedAt
    ? `Last updated ${new Date(metaState.updatedAt).toLocaleString()} — always overrides 🧷 pinned FX states`
    : 'No meta state saved yet — click 📝 Update Meta';
}

function downloadMetaState() {
  if (!metaState.roles || !Object.keys(metaState.roles).length) {
    setStatus('No meta state saved yet — click 📝 Update Meta first', true);
    return;
  }
  const payload = {
    type: 'daw-meta-state',
    version: 1,
    exportedAt: new Date().toISOString(),
    projectTitle: project.title || 'Untitled',
    metaState: cloneData(metaState)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (project.title || 'daw') + '-meta-state.json';
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus('★ Meta state downloaded');
}

function uploadMetaStateFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const incoming = (data && data.metaState) ? data.metaState : data;
      if (!incoming || typeof incoming !== 'object' || !incoming.roles) throw new Error('No roles found in file');
      const hasExisting = metaState.roles && Object.keys(metaState.roles).length;
      if (hasExisting && !confirm('Replace the current ★ Meta State with the uploaded one?')) return;
      metaState = { version: 1, updatedAt: incoming.updatedAt || new Date().toISOString(), roles: cloneData(incoming.roles) };
      for (const r of Object.values(metaState.roles)) r.effects = { ...DEFAULT_FX(), ...(r.effects || {}) };
      for (const sec of Object.values(project.sections || {}))
        applyFxStyleToTracks(Object.values(sec.tracks), metaState);
      renderTrackHeaders();
      renderMetaStateUI();
      saveProject();
      setStatus(`Loaded ★ meta state (${Object.keys(metaState.roles).length} roles) and applied it to all sections`);
    } catch(err) {
      setStatus('Meta state upload error: ' + err.message, true);
    }
  };
  reader.readAsText(file);
}

function downloadFxStates() {

    setStatus('No FX states saved yet — click + Save State first', true);

  }

  };

  a.click();

}

function uploadFxStatesFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const snaps = Array.isArray(data) ? data : data.snapshots;
      if (!Array.isArray(snaps)) throw new Error('No snapshots array found');

      fxSnapshots = snaps.map((s, i) => normalizeFxSnapshot(s, i));

    } catch(err) {

    }

}

function findTrackForSnapshot(secId, trackId, savedTrack) {
  const sec = project.sections[secId];
  if (!sec) return null;
  if (sec.tracks[trackId]) return sec.tracks[trackId];
  // Fallback helps if a bank is loaded after track IDs changed, while still keeping tracks distinct.
  return Object.values(sec.tracks).find(t => t.label === savedTrack.label && t.instrument === savedTrack.instrument)
      || Object.values(sec.tracks).find(t => t.label === savedTrack.label)
      || null;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function num(v, fallback=0) { return Number.isFinite(+v) ? +v : fallback; }

function recallFxSnapshot(index, duration=1.5) {
  const snap = normalizeFxSnapshot(fxSnapshots[index], index);
  if (!snap) return;
  fxSnapshots[index] = snap; // persist normalized form so the id stays stable
  pushUndo();
  fxMorphSerial++;
  const serial = fxMorphSerial;
  if (fxStateSticky) activeFxStateId = snap.id;
  document.querySelectorAll('.fx-state-btn').forEach((b, i) => b.classList.toggle('morphing', i === index));

  const startMaster = cloneData({ ...DEFAULT_MASTER_FX(), ...(project.masterFx || {}) });
  const targetMaster = cloneData({ ...DEFAULT_MASTER_FX(), ...(snap.masterFx || {}) });
  const trackPairs = [];

  const addPair = (secId, track, savedTrack) => {
    track.effects = { ...DEFAULT_FX(), ...(track.effects || {}) };
    // Conductor layers are gated by board state (muted / volume 0 until their
    // role unlocks). Restyle their sound, but keep the gate: target volume 0
    // while gated, intended level stored in _baseVol, mute flags untouched.
    const gated = track.element != null;
    const off   = gated && (track.muted || num(track.volume, 0) < 0.001);
    const target = gated
      ? { ...savedTrack, volume: off ? 0 : savedTrack.volume,
          muted: track.muted, soloed: track.soloed }
      : savedTrack;
    trackPairs.push({
      secId, track,
      start: captureTrackFxSettings(track),
      target,
      roleVol: gated ? num(savedTrack.volume, null) : null
    });
    // String-valued FX need to switch discretely. Do it at the start so numeric params morph toward the right mode.
    track.effects.filterType = savedTrack.effects.filterType || track.effects.filterType;
    track.effects.delaySync = savedTrack.effects.delaySync || track.effects.delaySync;
  };

  if (fxStateSticky && Object.keys(snap.roles || {}).length) {
    // 🧷 All-Tracks mode: restyle every track in every section whose label
    // matches a saved role — independent of when/how the track was generated.
    for (const [secId, sec] of Object.entries(project.sections || {})) {
      for (const track of Object.values(sec.tracks || {})) {
        const savedTrack = snap.roles[track.label];
        if (savedTrack) addPair(secId, track, savedTrack);
      }
    }
  } else {
    for (const [secId, secSnap] of Object.entries(snap.sections || {})) {
      for (const [trackId, savedTrackRaw] of Object.entries(secSnap.tracks || {})) {
        const savedTrack = normalizeFxSnapshot({ sections:{ tmp:{ tracks:{ tmp:savedTrackRaw } } } }).sections.tmp.tracks.tmp;
        const track = findTrackForSnapshot(secId, trackId, savedTrack);
        if (track) addPair(secId, track, savedTrack);
      }
    }
  }

  const numericTrackKeys = ['volume','reverbSend'];
  const numericFxKeys = Object.keys(DEFAULT_FX()).filter(k => typeof DEFAULT_FX()[k] === 'number');
  const numericMasterKeys = Object.keys(DEFAULT_MASTER_FX()).filter(k => typeof DEFAULT_MASTER_FX()[k] === 'number');
  const t0 = performance.now();
  setStatus(`Crossfading to ${snap.label}…`);

  function step(now) {
    if (serial !== fxMorphSerial) return;
    const raw = duration <= 0 ? 1 : Math.min(1, (now - t0) / (duration * 1000));
    const p = raw * raw * (3 - 2 * raw); // smoothstep

    for (const k of numericMasterKeys) {
      project.masterFx[k] = lerp(num(startMaster[k], DEFAULT_MASTER_FX()[k]), num(targetMaster[k], DEFAULT_MASTER_FX()[k]), p);
    }
    applyMasterFxToAudio(0.08);

    for (const pair of trackPairs) {
      const { track, start, target } = pair;
      for (const k of numericTrackKeys) {
        track[k] = lerp(num(start[k], 0), num(target[k], start[k]), p);
      }
      track.effects = track.effects || {};
      for (const k of numericFxKeys) {
        const fallback = DEFAULT_FX()[k];
        track.effects[k] = lerp(num(start.effects?.[k], fallback), num(target.effects?.[k], fallback), p);
      }
    }

    for (const pair of trackPairs) trackEngines[pair.track.id]?.apply(pair.track);
    if (raw < 1) {
      requestAnimationFrame(step);
    } else {
      finishFxSnapshotRecall(serial, snap, trackPairs, targetMaster);
    }
  }
  requestAnimationFrame(step);
}

function finishFxSnapshotRecall(serial, snap, trackPairs, targetMaster) {
  if (serial !== fxMorphSerial) return;
  project.masterFx = { ...DEFAULT_MASTER_FX(), ...targetMaster };
  project.tempo = clamp(+snap.tempo || project.tempo, 20, 400);
  document.getElementById('bpm-input').value = project.tempo;

  for (const { track, target, roleVol } of trackPairs) {
    track.instrument = normalizeInstrument(target.instrument || track.instrument);
    track.color = target.color || track.color;
    track.volume = num(target.volume, track.volume);
    track.muted = !!target.muted;
    track.soloed = !!target.soloed;
    track.reverbSend = num(target.reverbSend, track.reverbSend);
    track.effects = { ...DEFAULT_FX(), ...(target.effects || {}) };
    // Gated conductor layers: remember the style's level as the unlock target
    if (roleVol != null) track._baseVol = roleVol;
  }

  applyMasterFxToAudio(0.05);
  applyDeRezFx(); // bits / rate / mix from the recalled state take effect on the audio nodes
  for (const pair of trackPairs) trackEngines[pair.track.id]?.apply(pair.track);
  syncMasterStrip();
  renderTrackHeaders();
  renderFxSnapshotUI();
  PR.dirty = true; schedRedraw();
  saveProject();
  setStatus(`${snap.label} loaded`);
}

// ── DeRez controls ─────────────────────────────────────────────────
function applyDeRezFx() {
  if (!audioCtx || !derezDryGain) return;
  const fx   = project.masterFx;
  const mix  = fx.derezMix  ?? 0;
  const bits = fx.derezBits ?? 16;
  const rate = fx.derezRate ?? 1;
  const now  = audioCtx.currentTime;

  // Master dry/wet + rate filter (master stage shapes the overall colour)
  derezDryGain.gain.setTargetAtTime(1 - mix, now, 0.02);
  derezWetGain.gain.setTargetAtTime(mix,     now, 0.02);
  if (derezCrusher) derezCrusher.curve = buildBitCrushCurve(bits);
  if (derezFilter)  derezFilter.frequency.setTargetAtTime(2000 + 20050 * rate, now, 0.02);

  // Per-track bit crushers — applied BEFORE per-track saturation so the
  // quantisation artifacts get amplified rather than buried by distortion.
  for (const eng of Object.values(trackEngines)) eng.applyDerez(bits);
}

function derezRateLabel(v) {
  if (v >= 0.99) return 'full';
  // Show approximate equivalent sample rate (2k–22k Hz)
  const hz = Math.round(2000 + 20050 * v);
  return hz >= 1000 ? (hz/1000).toFixed(1)+'k' : hz+'Hz';
}

async function loadManifest() {
  if (manifestCache) return manifestCache;
  const r = await fetch('midi-manifest.json');
  if (!r.ok) throw new Error('Could not load midi-manifest.json');
  manifestCache = (await r.json()).map(e => ({
    ...e,
    moods: Array.isArray(e.moods) ? e.moods : (e.moods ? [e.moods] : [])
  }));
  return manifestCache;
}

async function importMidiFromUrl(path) {
  try {
    const r = await fetch(path);
    if (!r.ok) throw new Error('Failed to fetch ' + path);
    const buf = await r.arrayBuffer();
    const parsed = parseMidi(buf);
    scheduleImport(prepareImport(parsed.sections['A'].tracks, activeSectionId), activeSectionId);
  } catch(err) { setStatus('Library import error: '+err.message, true); }
}

// Remembers the most-recent drum tracks (with their mix/FX) so they can be
// re-dropped onto a new sequence — e.g. after an elemental clip wipes the section.
let lastDrums = null;  // [{ track:<clone>, buffer:<AudioBuffer|null> }]

function isDrumTrack(t) {
  return ['kick','snare','hat'].includes(t.instrument);
}

// Snapshot the drum tracks currently in a section, preserving their settings.
function captureLastDrums(sec) {
  if (!sec) return;
  const drums = Object.values(sec.tracks).filter(isDrumTrack);
  if (!drums.length) return;
  lastDrums = drums.map(t => ({ track: cloneData(t) }));
  updateAddDrumsButton();
}

// Re-add the remembered drums to the active section with their previous settings.
// Replaces any drum tracks already present (so repeated presses don't stack).
function addLastDrums() {
  if (!lastDrums || !lastDrums.length) { setStatus('No drums loaded yet to add', true); return; }
  pushUndo();
  const sec = project.sections[activeSectionId];
  for (const t of Object.values(sec.tracks)) {
    if (isDrumTrack(t)) {
      trackEngines[t.id]?.destroy(); delete trackEngines[t.id];
      delete sec.tracks[t.id];
    }
  }
  for (const { track } of lastDrums) {
    const nt = cloneData(track);
    nt.id = uid();
    nt.notes = (track.notes || []).map(n => ({ ...cloneData(n), id: uid() }));
    sec.tracks[nt.id] = nt;
  }
  if (audioCtx) rebuildEngines();
  renderTrackHeaders(); renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw(); saveProject();
  setStatus(`Added last drums (${lastDrums.length} track${lastDrums.length!==1?'s':''})`);
}

  const btn = document.getElementById('btn-add-drums');
  if (btn) btn.disabled = !(lastDrums && lastDrums.length);
}

// ── TRANSPORT WIRING ───────────────────────────────────────────────
// Master power: a hard kill that cuts ALL audio immediately — including notes
// and reverb/delay tails that would otherwise ring out past Stop — turns off
// the hiss/crackle, and suspends the whole audio engine (no output, minimal
// CPU). Click again to power back on.
async function togglePower() {
  powerOn = !powerOn;
  const btn = document.getElementById('btn-power');
  if (!powerOn) {
    stopPlayback();
    if (audioCtx) {
      const now = audioCtx.currentTime;
      // Slam the output and hiss to zero NOW (no ramp) so tails are cut instantly…
      if (masterOut)     { masterOut.gain.cancelScheduledValues(now);     masterOut.gain.setValueAtTime(0, now); }
      if (hissGainNode)  { hissGainNode.gain.cancelScheduledValues(now);  hissGainNode.gain.setValueAtTime(0, now); }
      // …then freeze the entire graph: no processing, no output, minimal CPU.
      try { await audioCtx.suspend(); } catch (e) {}
    }
    btn.textContent = '⏻ Off';
    btn.classList.add('off');
    setStatus('⏻ Power OFF — all audio cut and engine frozen');
  } else {
    if (audioCtx) {
      try { await audioCtx.resume(); } catch (e) {}
      masterOut?.gain.setTargetAtTime(project.masterFx.masterVolume, audioCtx.currentTime, 0.02);
    }
    if (brownOn) applyBrownNoise();   // resume the ambient bed
    btn.textContent = '⏻ On';
    btn.classList.remove('off');
    setStatus('⏻ Power ON');
  }
  // Notify the embedding page (js/joytone-bridge.js) so its own state —
  // and the Settings tab's "Adaptive Music" toggle — stays in sync
  // whenever power changes from THIS button, not just from setPower()
  // calls the parent initiates itself. Same-origin iframe, so a direct
  // reference works; no-ops harmlessly when run standalone (no parent) or
  // mid-programmatic setPower() call (parent already knows).
  try { if (window.parent !== window) window.parent.JoytoneBridge?._onChildPowerChanged?.(powerOn); } catch (e) {}
}
document.getElementById('btn-power').addEventListener('click', togglePower);

// Programmatic power control (used by the parent page, e.g. to silence the
// engine during rapid-fire bot training games) — bypasses the click
// listener's multiplayer-desync confirm() dialog below, since that's only
// registered on real clicks against the button element.
async function setPower(p) {
  if (!!p === powerOn) return;
  await togglePower();
}

init();

// ── GODAIGO EMBED ADAPTER ──────────────────────────────────────────
// Godaigo embeds this page in a hidden same-origin iframe and drives it
// through window.JoytoneAPI (see js/joytone-bridge.js in the game repo).
// Lives inside this script so it can reach the script-scoped lets
// (project, masterOut, _growMode, …) that aren't on window.
(function () {
  const ORCHS = ['eastern', 'soft', 'synth'];
  const usedGenerations = new Set(); // generation keys already in the playlist
  let bridgeGain = null;             // parent-controlled trim after masterOut
  let _volume = 1, _muted = false;
  let booted = false;
  let _queue = Promise.resolve();    // serializes grows so RNG swaps can't interleave

  // FNV-1a 32-bit — deterministic seed from gameId+tileId strings
  function hash32(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Volume/mute live on a separate gain AFTER masterOut so the app's own
  // FX-state recalls (which rewrite masterOut.gain) can never undo them.
  // Chain: masterOut → bridgeGain → softClip → destination (the soft-clipper
  // must stay last so parent volume can't push overshoots past it).
  function installBridgeGain() {
    if (!audioCtx || !masterOut || bridgeGain) return;
    bridgeGain = audioCtx.createGain();
    bridgeGain.gain.value = _muted ? 0 : _volume;
    masterOut.disconnect();
    masterOut.connect(bridgeGain);
    if (softClip) bridgeGain.connect(softClip);
    else bridgeGain.connect(audioCtx.destination);
  }
  function applyBridgeGain() {
    if (bridgeGain && audioCtx) bridgeGain.gain.setTargetAtTime(_muted ? 0 : _volume, audioCtx.currentTime, 0.03);
  }

  let pendingPlay = false; // autoplay was blocked at boot — start on next gesture

  async function unlock() {
    await ensureAudio();
    installBridgeGain();
    const ok = !!audioCtx && audioCtx.state === 'running';
    if (ok && pendingPlay) {
      pendingPlay = false;
      if (booted && !isPlaying) startPlayback(0);
    }
    return ok;
  }

  // Fresh start for a new game: load the baked theme (replacing anything
  // restored from localStorage), force Grow + Drummer ON, start looping.
  // A new game means default settings, so a powered-off engine comes back on.
  // booted = theme data is loaded; riffs collect even while audio is blocked
  // or powered off, and playback joins in on the next unlock.
  async function boot() {
    if (booted) return true;
    _gameSessionActive = true; // suppress saveProject() for the whole session — see its declaration
    stopPlayback();
    project = makeThemeProject();
    _themeRiffCount = 1;
    activeSectionId = project.sectionOrder[0];
    usedGenerations.clear();
    usedGenerations.add('__original__');
    if (!_growMode) toggleGrowMode();
    if (!_drummerMode) toggleDrummerMode();
    if (!_growUseAllTracksFx) toggleGrowFx();
    // Pin a default style for every riff this game grows, and restyle the
    // opening theme itself the same way (not just riffs grown later — same
    // role-matching path applyThemeVariation() uses for every generated
    // riff). ★ Meta State (the designer's curated, evolving default) always
    // wins if it has any roles; otherwise fall back to the most recently
    // saved numbered FX state ("FX N", always fxSnapshots' last entry).
    let fxNote = '';
    if (!(metaState.roles && Object.keys(metaState.roles).length) && fxSnapshots.length) {
      fxStateSticky = true;
      activeFxStateId = fxSnapshots[fxSnapshots.length - 1].id;
    }
    const style = activeFxStyle();
    if (style) {
      for (const sec of Object.values(project.sections))
        applyFxStyleToTracks(Object.values(sec.tracks), style);
      renderFxSnapshotUI();
      updateFxStickyUI();
      renderMetaStateUI();
      fxNote = (style === metaState)
        ? ` · ★Meta(${Object.keys(metaState.roles).length})`
        : ` · 🧷${style.label}`;
    }
    refreshAfterThemeLoad(`☯ Godaigo game start — theme loaded, Grow + Drummer + FX on${fxNote}`);
    loadManifest().catch(() => {});   // warm the drummer library
    booted = true;
    if (!powerOn) await togglePower();
    const ok = await unlock();
    if (ok) { if (!isPlaying) startPlayback(0); }
    else pendingPlay = true;
    return true;
  }

  // Append one riff for a revealed tile. All randomness (orchestration pick,
  // composition, drummer loops) is seeded from seedStr, so every client that
  // processes the same tile grows the identical sequence. Capped to ONE riff
  // per element (earth/water/fire/wind/void) plus ONE catacomb (dual) riff
  // for the whole game — six generations max, however many tiles get
  // revealed — so a long game's accumulated sections/tracks stay bounded.
  // Returns the generation key, or null when that type is already used.
  function addTileTheme(elementKey, seedStr) {
    const run = _queue.then(async () => {
      if (!booted && !(await boot())) return null;
      const rng = mulberry32(hash32(String(seedStr)));
      const alreadyGenerated = (prefix) => {
        for (const k of usedGenerations) if (k.startsWith(prefix)) return true;
        return false;
      };
      let el, orch, genKey;
      if (elementKey === 'catacomb') {
        if (alreadyGenerated('catacomb|')) return null; // one catacomb riff per game
        // Dual-element blend — seeded pick of the two fused elements
        const g = [...GODAI];
        const a = g.splice((rng() * g.length) | 0, 1)[0];
        const b = g[(rng() * g.length) | 0];
        genKey = `catacomb|${a}>${b}`;
        const ea = ELEMENTS[a], eb = ELEMENTS[b];
        el = { emoji: '⚰️', name: `Catacomb: ${ea.name}→${eb.name}`, color: '#4e342e',
               rootPc: ea.rootPc, rootPc2: eb.rootPc, orch: 'blend' };
        orch = 'blend';
      } else {
        el = ELEMENTS[elementKey];
        if (!el) return null;
        if (alreadyGenerated(`${elementKey}|`)) return null; // one riff per element per game
        orch = ORCHS[(rng() * ORCHS.length) | 0];
        genKey = `${elementKey}|${orch}`;
      }
      usedGenerations.add(genKey);
      const realRandom = Math.random;
      Math.random = rng;
      try { await applyThemeVariation(el, orch); }
      finally { Math.random = realRandom; }
      return genKey;
    });
    _queue = run.catch(() => {});
    return run;
  }

  function setVolume(v) { _volume = Math.max(0, Math.min(1, +v || 0)); applyBridgeGain(); }
  function setMute(m)   { _muted = !!m; applyBridgeGain(); }

  // ── Dynamic tension → BPM + BITS/RATE/DEREZ ─────────────────────────
  // Driven by js/joytone-bridge.js's setTension(), itself driven by
  // game-core.js's updateMusicTension(). tension is 0..1 game progress
  // (0 = game start, 1 = full progress / win) — everything below is a
  // straight-line interpolation of that one value, so BPM and the crunch
  // controls always move together and both land on their end values
  // exactly at tension=1 with no separate "win" special-case needed.
  //
  // RATE's slider (#mc-derez-rate) is a 0..1 fraction of a 2000-22050Hz
  // sweep, not a literal Hz value — see applyDeRezFx()/derezRateLabel()
  // above. FULL_RATE_HZ is what slider value 1 ("full") maps to under
  // that same formula (2000 + 20050*1); interpolating in Hz space and
  // converting back to the slider's own fraction keeps this in sync with
  // whatever that sweep is, rather than hardcoding a second copy of it.
  const FULL_RATE_HZ = 2000 + 20050 * 1; // 22050 — matches applyDeRezFx()'s sweep at rate=1
  const CRUNCH_RATE_HZ = 2600;

  let _lastTension = 0;
  function setTension(tension) {
    tension = Math.max(0, Math.min(1, +tension || 0));
    _lastTension = tension;

    // BPM: 94 at tension 0 → 115 at tension 1 (x SALSA_TEMPO in salsa mode).
    const bpm = Math.round(Math.max(94, Math.min(115, 94 + tension * 21)) * (salsaMode ? SALSA_TEMPO : 1));
    // currentBeat()/scheduleAhead() derive the playhead as
    // playStartBeat + secToBeat(now - playStartCtxTime), and secToBeat() uses
    // WHATEVER project.tempo is at call time — not the tempo that was actually
    // in effect for each slice of that elapsed time. Changing project.tempo
    // without re-anchoring retroactively reinterprets the ENTIRE elapsed
    // playback under the new tempo, so the beat position jumps instantly and
    // the next scheduleAhead() tick has to skip or burst-catch-up to it —
    // audible as a lag/glitch every time tension moves. Re-anchor to the
    // actual current beat (captured under the OUTGOING tempo, before it
    // changes) so playback stays continuous across the tempo change.
    if (isPlaying && audioCtx) {
      const beatNow = currentBeat();
      project.tempo = bpm;
      playStartBeat = beatNow;
      playStartCtxTime = audioCtx.currentTime;
    } else {
      project.tempo = bpm;
    }
    const bpmInput = document.getElementById('bpm-input');
    if (bpmInput) bpmInput.value = bpm;
    Object.values(activeTracks()).forEach(t => trackEngines[t.id]?.apply(t));

    // BITS: 16 (clean) at tension 0 → 8 (crunchy) at tension 1.
    const bits = Math.round(16 - tension * 8);
    // DEREZ: 0% at tension 0 → 100% at tension 1.
    const derezPercent = Math.round(tension * 100);
    const mix = derezPercent / 100;
    // RATE: FULL_RATE_HZ at tension 0 → 2600Hz at tension 1, converted to
    // the slider's 0..1 fraction (clamped to the slider's own 0.03..1 range).
    const rateHz = Math.round(FULL_RATE_HZ - tension * (FULL_RATE_HZ - CRUNCH_RATE_HZ));
    const rateSlider = Math.max(0.03, Math.min(1, (rateHz - 2000) / 20050));

    project.masterFx.derezBits = bits;
    project.masterFx.derezRate = rateSlider;
    project.masterFx.derezMix  = mix;

    const bitsInput = document.getElementById('mc-derez-bits');
    const bitsVal    = document.getElementById('mc-derez-bits-val');
    const rateInput  = document.getElementById('mc-derez-rate');
    const rateVal    = document.getElementById('mc-derez-rate-val');
    const mixInput   = document.getElementById('mc-derez-mix');
    const mixVal     = document.getElementById('mc-derez-mix-val');
    if (bitsInput) bitsInput.value = bits;
    if (bitsVal)   bitsVal.textContent = bits === 16 ? '16' : bits + 'b';
    if (rateInput) rateInput.value = rateSlider;
    if (rateVal)   rateVal.textContent = derezRateLabel(rateSlider);
    if (mixInput)  mixInput.value = mix;
    if (mixVal)    mixVal.textContent = mix === 0 ? 'off' : derezPercent + '%';

    applyDeRezFx();
    saveProject();
  }

  // Game over / back to lobby: silence and require a fresh boot next game
  function stopAll() {
    stopPlayback();
    booted = false;
    pendingPlay = false;
    usedGenerations.clear();
    _gameSessionActive = false;
  }

  // Parent just made the iframe visible — canvases were sized at 0 while hidden.
  // Also resumes the per-frame animLoop (see popupVisible), which onHidden()
  // below stopped rescheduling while nobody could see it.
  function onShown() {
    popupVisible = true;
    requestAnimationFrame(() => { resizeCanvases(); PR.gridDirty = true; PR.dirty = true; schedRedraw(); });
    if (isPlaying && !animFrameId) animFrameId = requestAnimationFrame(animLoop);
  }

  // Parent just hid the popup (closed it, or a game started with it closed —
  // the default). Stops animLoop's per-frame canvas/DOM work; the scheduler
  // that actually drives audio (setInterval-based, in scheduleAhead) is
  // untouched and keeps playing normally.
  function onHidden() {
    popupVisible = false;
  }

  function getState() {
    return { booted, playing: isPlaying, powered: powerOn, muted: _muted, volume: _volume,
             lookahead: LOOKAHEAD, softClip: !!softClip, salsa: salsaMode, tempo: project?.tempo,
             used: [...usedGenerations], sections: project?.sectionOrder?.length || 0 };
  }

  // ⏻ Power button during a game: powering off freezes the engine, so this
  // player's soundtrack falls out of sync with everyone else's. Warn first
  // (capture phase runs before the button's own toggle handler; cancelling
  // stops the toggle). Riffs still collect while off; powering back on
  // auto-resumes the playlist from the top.
  document.addEventListener('click', (e) => {
    const btn = document.getElementById('btn-power');
    if (!booted || !btn || !(e.target === btn || btn.contains(e.target))) return;
    if (powerOn) {
      const ok = window.confirm(
        'Power off the music engine?\n\n' +
        'Your soundtrack will fall out of sync with the other players until you power ' +
        'back on. (New tile riffs still collect while it\'s off.)');
      if (!ok) { e.stopImmediatePropagation(); e.preventDefault(); }
    } else {
      // Powering back on — restart the accumulated playlist
      setTimeout(() => { if (powerOn && booted && !isPlaying) startPlayback(0); }, 150);
    }
  }, true);

  // Salsa mode on/off (Godaigo sets it from the game language). Re-applies
  // the current tension so the tempo change goes through the same
  // re-anchored path as every other tempo change.
  function setSalsa(on) {
    on = !!on;
    if (on === salsaMode) return;
    salsaMode = on;
    if (isPlaying && audioCtx) salsaCursor = Math.ceil(currentBeat() * 2) / 2;
    setTension(_lastTension);
    setStatus(on ? '💃 Salsa mode on' : 'Salsa mode off');
  }

  window.JoytoneAPI = { boot, addTileTheme, setVolume, setMute, setPower, setTension, setSalsa, stop: stopAll, unlock, onShown, onHidden, getState };
})();
</script>
