// ── SECTION MANAGEMENT ─────────────────────────────────────────────
function nextSectionId(base='A') {
  const used = new Set(Object.keys(project.sections));
  for (let i=0; i<26; i++) {
    const id = String.fromCharCode(65+i);
    if (!used.has(id)) return id;
  }
  let n = 2;
  while (used.has(base + n)) n++;
  return base + n;
}

function currentPlayingOrderIndex() {
  if (!isPlaying || !project?.sectionOrder?.length) return -1;
  return ((currentSectionPlayIdx % project.sectionOrder.length) + project.sectionOrder.length) % project.sectionOrder.length;
}

function currentPlayingSectionId() {
  const idx = currentPlayingOrderIndex();
  return idx >= 0 ? project.sectionOrder[idx] : null;
}

// When ON, the piano roll / track list view chases whichever section is
// currently sounding instead of staying put — driven once per animation
// frame from animLoop() while playing. View-only: unlike switchSection()
// this never calls rebuildEngines(), so it can't interrupt notes that are
// already scheduled on the real (unaffected) playback engines.
let _followPlayback = false;

function toggleFollowPlayback() {
  _followPlayback = !_followPlayback;
  const b = document.getElementById('btn-follow-play');
  b.textContent = _followPlayback ? '👁 Follow: On' : '👁 Follow: Off';
  b.classList.toggle('on', _followPlayback);
  setStatus(_followPlayback
    ? '👁 Follow ON — view jumps to whichever section is currently playing'
    : 'Follow off — view stays on the section you pick');
  followPlayingSection();
}

function followPlayingSection() {
  if (!_followPlayback || !isPlaying) return;
  const playingId = currentPlayingSectionId();
  if (!playingId || playingId === activeSectionId) return;
  activeSectionId = playingId;
  ensureSelectedTrack();
  renderTrackHeaders();
  renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw();
}

function updatePlayingSectionHighlight() {
  const playingIdx = currentPlayingOrderIndex();
  const playingId = currentPlayingSectionId();
  document.querySelectorAll('.sec-tab').forEach(el => {
    el.classList.toggle('playing', !!playingId && el.dataset.secId === playingId);
  });
  document.querySelectorAll('.sec-order-item').forEach(el => {
    el.classList.toggle('playing', +el.dataset.oi === playingIdx);
  });
}

function renderSectionUI() {
  // Tabs
  const tabs = document.getElementById('section-tabs');
  tabs.innerHTML = '';
  project.sectionOrder.forEach(id => {
    const sec = project.sections[id];
    if (!sec) return;
    const btn = document.createElement('button');
    btn.className = 'sec-tab' + (id===activeSectionId?' active':'') + (id===currentPlayingSectionId()?' playing':'');
    btn.dataset.secId = id;
    btn.title = `Section ${id} — click to switch`;

    const lbl = document.createElement('span');
    lbl.textContent = sec.label || id;
    btn.appendChild(lbl);

    // × delete button — only show when there's more than one section
    if (project.sectionOrder.length > 1) {
      const del = document.createElement('span');
      del.className = 'sec-del';
      del.textContent = '×';
      del.title = `Delete Section ${id}`;
      del.addEventListener('click', e => { e.stopPropagation(); deleteSection(id); });
      btn.appendChild(del);
    }

    btn.addEventListener('click', () => switchSection(id));
    tabs.appendChild(btn);
  });

  // Play-order display with reorder controls
  const orderDiv = document.getElementById('section-order');
  orderDiv.innerHTML = '';
  project.sectionOrder.forEach((id, i) => {
    if (i > 0) {
      const arrow = document.createElement('span');
      arrow.style.color = '#444';
      arrow.textContent = '→';
      orderDiv.appendChild(arrow);
    }
    const item = document.createElement('span');
    item.className = 'sec-order-item' + (i===currentPlayingOrderIndex()?' playing':'');
    item.dataset.oi = i;
    item.title = `Play-order slot ${i+1}: Section ${id}`;

    const left = document.createElement('button');
    left.className = 'sec-order-move';
    left.textContent = '‹';
    left.title = 'Move section earlier';
    left.disabled = i === 0;
    left.addEventListener('click', e => { e.stopPropagation(); moveSectionOrder(i, i-1); });
    item.appendChild(left);

    const name = document.createElement('span');
    name.className = 'sec-order-name';
    name.textContent = id;
    name.title = `Click to switch to Section ${id}`;
    name.addEventListener('click', () => switchSection(id));
    item.appendChild(name);

    const right = document.createElement('button');
    right.className = 'sec-order-move';
    right.textContent = '›';
    right.title = 'Move section later';
    right.disabled = i === project.sectionOrder.length - 1;
    right.addEventListener('click', e => { e.stopPropagation(); moveSectionOrder(i, i+1); });
    item.appendChild(right);

    if (project.sectionOrder.length > 1) {
      const rm = document.createElement('button');
      rm.className = 'sec-order-remove';
      rm.textContent = '×';
      rm.title = `Remove/delete Section ${id}`;
      rm.addEventListener('click', e => { e.stopPropagation(); deleteSection(id); });
      item.appendChild(rm);
    }

    orderDiv.appendChild(item);
  });
  updatePlayingSectionHighlight();
}

function switchSection(id) {
  if (!project.sections[id]) return;
  activeSectionId = id;
  ensureSelectedTrack();
  if (audioCtx) rebuildEngines();
  renderTrackHeaders();
  renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw();
}

function addSection() {
  const id = nextSectionId();
  pushUndo();
  // Start blank — user will drop MIDIs in independently
  project.sections[id] = makeSection(id);
  project.sectionOrder.push(id);
  switchSection(id);
  saveProject();
}

// First-run bootstrap: the app starts with NO sections (so a blank "A" doesn't
// sit in front of generated songs). The moment the user clicks the empty grid,
// create section "A" with one track so they can start. Returns true if it made
// the section. No-op once any section exists.
function ensureStartingSection() {
  if (project.sectionOrder.length) return false;
  const id = 'A';
  project.sections = { [id]: makeSection(id) };
  project.sectionOrder = [id];
  activeSectionId = id;
  const t = makeTrack();
  project.sections[id].tracks[t.id] = t;
  selectedTrackId = t.id;
  if (audioCtx) trackEngines[t.id] = new TrackEngine(t);
  renderTrackHeaders(); renderSectionUI();
  return true;
}

function moveSectionOrder(fromIdx, toIdx) {
  if (toIdx < 0 || toIdx >= project.sectionOrder.length || fromIdx === toIdx) return;
  pushUndo();
  const [id] = project.sectionOrder.splice(fromIdx, 1);
  project.sectionOrder.splice(toIdx, 0, id);
  renderSectionUI();
  saveProject();
}

function duplicateSection(sourceId = activeSectionId) {
  const src = project.sections[sourceId];
  if (!src) return;
  pushUndo();
  const newId = nextSectionId(sourceId);
  const dup = cloneData(src);
  dup.id = newId;
  dup.label = newId;
  dup.tracks = {};

  for (const [oldTrackId, oldTrack] of Object.entries(src.tracks || {})) {
    const newTrack = cloneData(oldTrack);
    newTrack.id = uid();
    newTrack.notes = (oldTrack.notes || []).map(n => ({ ...cloneData(n), id: uid() }));
    dup.tracks[newTrack.id] = newTrack;
  }

  project.sections[newId] = dup;
  const idx = project.sectionOrder.indexOf(sourceId);
  project.sectionOrder.splice(idx >= 0 ? idx + 1 : project.sectionOrder.length, 0, newId);
  activeSectionId = newId;
  selectedTrackId = Object.keys(dup.tracks)[0] || null;
  if (audioCtx) rebuildEngines();
  renderTrackHeaders();
  renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw();
  saveProject();
  setStatus(`Section ${sourceId} duplicated as ${newId}`);
}

function deleteSection(id) {
  if (project.sectionOrder.length <= 1) return; // must keep at least one
  pushUndo();

  // Remove from order (all occurrences) and from sections map
  project.sectionOrder = project.sectionOrder.filter(s => s !== id);
  delete project.sections[id];

  // If we just deleted the active section, switch to the first remaining one
  if (activeSectionId === id) {
    activeSectionId = project.sectionOrder[0];
  }
  ensureSelectedTrack();

  if (audioCtx) rebuildEngines();
  renderTrackHeaders();
  renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw();
  saveProject();
  setStatus(`Section ${id} deleted`);
}

// ── MIDI EXPORT ────────────────────────────────────────────────────
function encodeVLQ(v) {
  if (v < 0x80) return [v];
  const b = [v & 0x7F]; v >>= 7;
  while (v > 0) { b.unshift((v & 0x7F) | 0x80); v >>= 7; }
  return b;
}

function buildTempoTrack(bpm) {
  const usPerBeat = Math.round(60000000 / bpm);
  const events = [
    ...encodeVLQ(0), 0xFF, 0x51, 0x03,
    (usPerBeat>>16)&0xFF, (usPerBeat>>8)&0xFF, usPerBeat&0xFF,
    ...encodeVLQ(0), 0xFF, 0x2F, 0x00
  ];
  const len = events.length;
  return [0x4D,0x54,0x72,0x6B, (len>>24)&0xFF,(len>>16)&0xFF,(len>>8)&0xFF,len&0xFF, ...events];
}

function buildNoteTrack(track) {
  const evs = [];
  for (const note of track.notes) {
    evs.push({ tick: Math.round(note.beatStart * PPQ), type:0x90, note:note.midiNote, vel:note.velocity });
    evs.push({ tick: Math.round((note.beatStart+note.duration) * PPQ), type:0x80, note:note.midiNote, vel:0 });
  }
  evs.sort((a,b) => a.tick-b.tick || (a.type===0x80?-1:1));
  const bytes = [];
  let prevTick = 0;
  for (const ev of evs) {
    bytes.push(...encodeVLQ(ev.tick - prevTick));
    bytes.push(ev.type, ev.note, ev.vel);
    prevTick = ev.tick;
  }
  bytes.push(...encodeVLQ(0), 0xFF, 0x2F, 0x00); // end of track
  const len = bytes.length;
  return [0x4D,0x54,0x72,0x6B, (len>>24)&0xFF,(len>>16)&0xFF,(len>>8)&0xFF,len&0xFF, ...bytes];
}

function exportMidi() {
  const section = project.sections[activeSectionId];
  if (!section) return;
  const tracks = Object.values(section.tracks).filter(t=>t.notes.length>0);
  const nTrk = tracks.length + 1; // +1 for tempo track
  const header = [
    0x4D,0x54,0x68,0x64, 0,0,0,6, // MThd length=6
    0,1,                           // format 1
    (nTrk>>8)&0xFF, nTrk&0xFF,    // num tracks
    (PPQ>>8)&0xFF, PPQ&0xFF        // division
  ];
  const chunks = [buildTempoTrack(project.tempo), ...tracks.map(buildNoteTrack)];
  const all = [...header, ...chunks.flat()];
  const blob = new Blob([new Uint8Array(all)], {type:'audio/midi'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (project.title||'export')+'.mid';
  a.click();
  setStatus('MIDI exported');
}

// ── MIDI IMPORT ────────────────────────────────────────────────────
function readVLQ(view, pos) {
  let val=0, bytes=0;
  while(true){
    const b=view.getUint8(pos+bytes); bytes++;
    val=(val<<7)|(b&0x7F);
    if(!(b&0x80)) break;
  }
  return [val, bytes];
}

function readStr(view, pos, len) {
  let s='';
  for(let i=0;i<len;i++) s+=String.fromCharCode(view.getUint8(pos+i));
  return s;
}

function parseMidi(buf) {
  const view = new DataView(buf);
  if (readStr(view,0,4) !== 'MThd') throw new Error('Not a MIDI file');
  const hdrLen  = view.getUint32(4,false);
  const format  = view.getUint16(8,false);
  const nTracks = view.getUint16(10,false);
  const div     = view.getUint16(12,false);
  const ppq     = (div & 0x8000) ? 480 : div;
  let pos = 8 + hdrLen;

  let tempoMicros = 500000;
  const parsed = [];

  for (let ti=0; ti<nTracks && pos<buf.byteLength; ti++) {
    if (readStr(view,pos,4) !== 'MTrk') break;
    const tLen = view.getUint32(pos+4,false);
    const tEnd = pos+8+tLen;
    pos += 8;
    const evs = []; let absTick=0; let rs=0;
    while (pos < tEnd) {
      const [dt, db] = readVLQ(view,pos); pos+=db; absTick+=dt;
      if (pos>=tEnd) break;
      let sb = view.getUint8(pos);
      if (sb===0xFF) {
        pos++;
        const mt = view.getUint8(pos++);
        const [ml,mb] = readVLQ(view,pos); pos+=mb;
        if (mt===0x51 && ml===3 && ti===0) {
          tempoMicros = (view.getUint8(pos)<<16)|(view.getUint8(pos+1)<<8)|view.getUint8(pos+2);
        }
        pos+=ml;
      } else if (sb===0xF0||sb===0xF7) {
        pos++;
        const [sl,sb2]=readVLQ(view,pos); pos+=sb2+sl;
      } else {
        if (sb&0x80) { rs=sb; pos++; } else { sb=rs; }
        const type=(sb&0xF0)>>4, ch=sb&0x0F;
        if (type===0x9) {
          const n=view.getUint8(pos++), v=view.getUint8(pos++);
          evs.push({tick:absTick, type:v>0?'on':'off', ch, note:n, vel:v});
        } else if (type===0x8) {
          const n=view.getUint8(pos++); pos++;
          evs.push({tick:absTick, type:'off', ch, note:n, vel:0});
        } else if (type===0xA||type===0xB||type===0xE) { pos+=2; }
        else if (type===0xC||type===0xD) { pos+=1; }
      }
    }
    pos = tEnd;
    parsed.push(evs);
  }

  const bpm = Math.round(60000000/tempoMicros);
  return buildProjectFromMidi(parsed, ppq, bpm);
}

// General MIDI drum note → instrument group
// Channel 9 (0-indexed) = GM percussion channel
const GM_DRUMS = {
  35:'kick',  36:'kick',                          // bass drums
  37:'snare', 38:'snare', 39:'snare', 40:'snare', // snare / rim / clap
  41:'snare', 43:'snare', 45:'snare',             // low/mid/high floor toms → snare
  47:'snare', 48:'snare', 50:'snare',             // mid/high toms → snare
  42:'hat',   44:'hat',   46:'hat',               // closed / pedal / open hi-hat
  49:'hat',   51:'hat',   52:'hat',   53:'hat',   // crash / ride / china / ride bell
  54:'hat',   55:'hat',   56:'hat',   57:'hat',   // tambourine / splash / cowbell / crash 2
  58:'hat',   59:'hat',                           // vibraslap / ride 2
};
const GM_DRUM_LABELS = { kick:'Kick', snare:'Snare', hat:'Hi-Hat' };

function buildProjectFromMidi(tracks, ppq, bpm) {
  const proj = makeProject({ tempo: bpm });
  const secA = proj.sections['A'];
  let colorIdx = 0;

  for (const evs of tracks) {
    const open = {};            // `ch_note` → {tick,vel}
    const notesByChannel = {};  // ch → notes[]  (melodic)
    const drumNotes = {};       // 'kick'|'snare'|'hat' → notes[]

    // Pre-scan: decide which channels are drums.
    // A channel is drums if ch===9 OR >70% of its note-ons are GM drum note numbers.
    // This handles packs (like Donit) that put drums on ch 0 with GM note numbers.
    const chTotal = {}, chDrum = {};
    for (const ev of evs) {
      if (ev.type !== 'on' || ev.vel === 0) continue;
      chTotal[ev.ch] = (chTotal[ev.ch] || 0) + 1;
      if (GM_DRUMS[ev.note] !== undefined)
        chDrum[ev.ch] = (chDrum[ev.ch] || 0) + 1;
    }
    const drumChs = new Set(
      Object.keys(chTotal)
        .map(Number)
        .filter(ch => ch === 9 || (chDrum[ch] || 0) / chTotal[ch] > 0.7)
    );

    for (const ev of evs) {
      const key = `${ev.ch}_${ev.note}`;
      if (ev.type==='on') {
        open[key] = {tick:ev.tick, vel:ev.vel};
      } else if (ev.type==='off' && open[key]) {
        const {tick:onTick, vel} = open[key];
        const note = {
          id: uid(),
          beatStart: onTick/ppq,
          duration: Math.max((ev.tick-onTick)/ppq, 0.0625),
          midiNote: ev.note,
          velocity: vel
        };
        if (drumChs.has(ev.ch)) {
          const inst = GM_DRUMS[ev.note] || 'snare';
          if (!drumNotes[inst]) drumNotes[inst] = [];
          drumNotes[inst].push(note);
        } else {
          if (!notesByChannel[ev.ch]) notesByChannel[ev.ch] = [];
          notesByChannel[ev.ch].push(note);
        }
        delete open[key];
      }
    }

    // Melodic tracks — one per MIDI channel
    for (const [ch, notes] of Object.entries(notesByChannel)) {
      if (!notes.length) continue;
      const tid = uid();
      secA.tracks[tid] = {
        id:tid, label:`Ch ${parseInt(ch)+1}`,
        instrument:'piano',
        color: TRACK_COLORS[colorIdx%TRACK_COLORS.length],
        volume:0.8, muted:false, soloed:false, reverbSend:0.2,
        notes, effects:DEFAULT_FX()
      };
      colorIdx++;
    }

    // Drum tracks — one per GM instrument group (kick / snare / hat)
    for (const [inst, notes] of Object.entries(drumNotes)) {
      if (!notes.length) continue;
      const tid = uid();
      secA.tracks[tid] = {
        id:tid, label: GM_DRUM_LABELS[inst] || inst,
        instrument: inst,
        color: TRACK_COLORS[colorIdx%TRACK_COLORS.length],
        volume:0.8, muted:false, soloed:false, reverbSend:0.1,
        notes, effects:{ ...DEFAULT_FX(), ...(INST_FILTER[inst]||{}) }
      };
      colorIdx++;
    }
  }

  // Compute section length
  let maxBeat = 4;
  for (const t of Object.values(secA.tracks))
    for (const n of t.notes)
      maxBeat = Math.max(maxBeat, n.beatStart+n.duration);
  secA.lengthBars = Math.ceil(maxBeat/4);
  return proj;
}

// ── CHORD ROLE EXPANDER ────────────────────────────────────────────
// Group simultaneous notes (within 0.1 beats of each other) into chords.
function groupChords(allNotes) {
  const chords = [];
  for (const note of allNotes) {
    const last = chords[chords.length-1];
    if (last && Math.abs(note.beatStart - last[0].beatStart) < 0.1) last.push(note);
    else chords.push([note]);
  }
  return chords;
}

// ── RULE-BASED MELODY GENERATOR ────────────────────────────────────

function pcOf(m) { return ((m % 12) + 12) % 12; }

// Harmonic root of a chord: the pitch class best supported by a fifth/third
// above it within the chord. Inversions (3rd in the bass) and chromatic
// walkdown bass notes stop polluting the root — taking the literal lowest
// note made pads/lines build on non-roots and clash.
function harmonicRootPc(chord) {
  const pcs = new Set(chord.map(n => pcOf(n.midiNote)));
  let best = null, bestScore = 0;
  for (const pc of pcs) {
    let score = 0;
    if (pcs.has((pc + 7) % 12)) score += 4;                            // fifth above
    if (pcs.has((pc + 3) % 12) || pcs.has((pc + 4) % 12)) score += 2;  // third above
    if (pcs.has((pc + 10) % 12) || pcs.has((pc + 11) % 12)) score += 1;// seventh
    if (score > bestScore) { bestScore = score; best = pc; }
  }
  if (best == null)
    best = pcOf(chord.reduce((m,n) => Math.min(m, n.midiNote), chord[0].midiNote));
  return best;
}

// Stable chord pcs: drop any pc that forms a semitone against another chord
// pc without fifth support of its own (the chromatic walkdown bass, inversion
// artifacts, exposed maj7 colour) — melodic lines built from these are what
// made generated melodies sound like they contained wrong notes.
function stableChordPcs(chord) {
  const pcs = [...new Set(chord.map(n => pcOf(n.midiNote)))];
  const root = harmonicRootPc(chord);
  const stable = pcs.filter(pc => {
    if (pc === root) return true;
    const semitoneClash = pcs.some(o => o !== pc &&
      (((o - pc + 12) % 12) === 1 || ((pc - o + 12) % 12) === 1));
    return !semitoneClash || pcs.includes((pc + 7) % 12);
  });
  return stable.length ? stable : [root];
}

// The melody's key, derived from the chords themselves: pick the major
// collection that covers the most (duration-weighted) stable chord content.
// The old profile-based guess could disagree with the actual progression,
// which mixed two pitch collections inside one melodic line.
function detectMelodyKey(chords) {
  const MAJ = new Set([0,2,4,5,7,9,11]);
  const w = new Array(12).fill(0);
  for (const ch of chords) {
    const dur = Math.max(ch[0].duration || 1, 0.25);
    for (const pc of stableChordPcs(ch)) w[pc] += dur;
  }
  let best = 0, bestS = -Infinity;
  for (let r=0; r<12; r++) {
    let s = 0;
    for (let pc=0; pc<12; pc++) {
      if (!w[pc]) continue;
      s += MAJ.has((pc - r + 12) % 12) ? w[pc] : -1.5 * w[pc];
    }
    if (s > bestS) { bestS = s; best = r; }
  }
  return best;
}

// Motif-driven melody:
//  • EVERY note comes from one pentatonic collection derived from the chords
//    themselves — pentatonic lines contain no semitones, so the melody can
//    never clash with itself, and never lands a sharp dissonance on a chord
//  • one short rhythmic cell repeats for the whole phrase — only the final
//    chord gets a cadence rhythm (short approach + long resolving note)
//  • pitches move stepwise through the collection along an arch contour that
//    peaks ~2/3 of the way through the progression
//  • strong beats and held notes prefer tones the current chord shares with
//    the collection; each cell repeat mutates at most one interval

// Rhythmic cells — offsets + durations in beats over a 4-beat chord
// (scaled to actual chord length at generation time). All leave a little
// air before the next downbeat so the line can breathe.
const MEL_MOTIFS = [
  [{o:0,d:.9},{o:1,d:.45},{o:1.5,d:.45},{o:2,d:1.7}],   // Q EE H — sing-song
  [{o:0,d:.9},{o:1,d:.9},{o:2,d:.45},{o:2.5,d:1.2}],    // Q Q E + pushed long
  [{o:0,d:1.35},{o:1.5,d:.45},{o:2,d:.9},{o:3,d:.85}],  // dotted-Q E Q Q
  [{o:0,d:.45},{o:.5,d:.45},{o:1,d:.9},{o:2,d:1.7}],    // EE Q H — front-loaded
  [{o:0,d:.9},{o:1.5,d:.45},{o:2,d:.9},{o:3,d:.85}],    // Q ·E Q Q — light syncopation
];
const MEL_CADENCE = [{o:0,d:.9},{o:1,d:2.6}];           // approach + long resolution

// ── THEME SEED ──────────────────────────────────────────────────────
// The game's musical DNA, distilled from the recomposed Five-Elements
// theme: the miyako-bushi ("in") scale on D — D Eb G A Bb — plus three
// hummable hooks lifted from the lead lines. When a seed is passed to
// generateMelodyNotes() the line is built from THIS collection (semitones
// and all — the Eb→D "sigh" is the whole point) and the hooks are planted
// at salient spots so the tune resurfaces inside otherwise-fresh material.
//
// Hooks are stored as collection-degree contours, not fixed pitches, so
// they re-root into any element's key and stay recognizable (leitmotif
// style). `step` is a delta in scale degrees (== an index step through the
// laid-out collection pool); `startDeg` is the degree the hook opens on.
const THEME = {
  rootPc: 2,            // D
  scale:  [0,1,5,7,8],  // miyako-bushi / "in": D Eb G A Bb (degrees 0..4)
  tempo:  126,          // the AoE2-derived march feel (reference; lens keeps element tempo)
  hooks: {
    // The Call — rising 4th D→G, the opening gesture
    call: { startDeg:0, cell:[ {o:0, d:0.9, step:0}, {o:1, d:1.9, step:+2} ] },
    // The Turn — repeated-note figure G G G A Bb, lands at the phrase peak
    turn: { startDeg:2, cell:[ {o:0,   d:0.5, step:0}, {o:0.5, d:0.5, step:0},
                               {o:1,   d:0.5, step:0}, {o:1.5, d:0.5, step:+1},
                               {o:2,   d:1.7, step:+2} ] },
    // The Sigh — the Eb→D semitone fall, used as the answering cadence
    sigh: { startDeg:1, cell:[ {o:0, d:0.9, step:0}, {o:1, d:2.4, step:-1} ] },
  },
};

function generateMelodyNotes(chords, seed=null) {
  const LO=67, HI=84, CENTER=74; // G4–C6, sits above the chord voicing
  if (!chords.length) return [];

  // The single pitch collection for the entire line. Without a seed: the
  // pentatonic subset of the chord-derived key (no semitones — can't clash).
  // With a seed: the theme's collection rooted at the seed's key, kept in
  // degree order so the hooks index into it correctly.
  let collPcs;
  if (seed) {
    collPcs = seed.scale.map(iv => (seed.rootPc + iv) % 12);
  } else {
    const keyPc = detectMelodyKey(chords);
    collPcs = [0,2,4,7,9].map(iv => (keyPc + iv) % 12);
  }
  const COLL = new Set(collPcs);
  const pool = [];
  for (let m=LO; m<=HI; m++) if (COLL.has(pcOf(m))) pool.push(m);
  if (!pool.length) return [];

  const N = chords.length;
  // Two distinct rhythm cells, alternated bar to bar (call / answer) — one
  // cell repeated every bar was the "doo doot de doot" monotony.
  const iA = (Math.random()*MEL_MOTIFS.length)|0;
  const iB = (iA + 1 + ((Math.random()*(MEL_MOTIFS.length-1))|0)) % MEL_MOTIFS.length;
  const motifs = [MEL_MOTIFS[iA], MEL_MOTIFS[iB]];

  // Base pitch shape per cell: steps through the collection — mostly
  // single steps, at most one skip, so the line is singable.
  const mkShape = motif => {
    const shape = [];
    let leapUsed = false;
    for (let i=1; i<motif.length; i++) {
      const r = Math.random();
      if (!leapUsed && r < .18) { shape.push(Math.random()<.5?-2:2); leapUsed = true; }
      else if (r < .56) shape.push(-1);
      else if (r < .94) shape.push(1);
      else shape.push(0);
    }
    return shape;
  };
  const baseShapes = motifs.map(mkShape);
  // Period form: a half cadence pauses the line mid-phrase (question),
  // the full cadence at the end resolves it (answer).
  const half = N >= 4 ? Math.ceil(N/2) : -1;

  const poolIdx = m => {
    let bi=0, bd=Infinity;
    for (let i=0;i<pool.length;i++){const d=Math.abs(pool[i]-m); if(d<bd){bd=d;bi=i;}}
    return bi;
  };
  const nearestIn = (arr, target) =>
    arr.reduce((b,n)=>Math.abs(n-target)<Math.abs(b-target)?n:b, arr[0]);

  const peakIdx = Math.max(1, Math.round((N-1)*0.62));
  const notes = [];
  let prev = CENTER;

  // ── Theme hooks ──────────────────────────────────────────────────
  // Plant a recognizable hook from the seed. `pool` is the collection laid
  // out ascending across the register, so one index step == one scale
  // degree: a hook's degree-deltas index straight into it.
  const degPc = d => collPcs[((d % collPcs.length) + collPcs.length) % collPcs.length];
  const idxForDeg = (d, target) => {
    const pc = degPc(d);
    let bi = -1, bd = Infinity;
    for (let i=0; i<pool.length; i++)
      if (pcOf(pool[i]) === pc) { const dd = Math.abs(pool[i]-target); if (dd<bd) { bd=dd; bi=i; } }
    return bi < 0 ? poolIdx(target) : bi;
  };
  const placeHook = (hook, cStart, bs, cLen, target, velBase) => {
    const si = idxForDeg(hook.startDeg, target);
    let last = pool[si];
    for (const {o,d,step} of hook.cell) {
      if (o*bs >= cLen-0.05) break;
      last = pool[clamp(si+step, 0, pool.length-1)];
      notes.push({ id:uid(), beatStart:cStart+o*bs,
        duration:Math.min(d*bs, cLen-o*bs)*0.97, midiNote:last,
        velocity: velBase + ((Math.random()*8)|0) });
    }
    return last;
  };

  for (let ci=0; ci<N; ci++) {
    const chord  = chords[ci];
    const cStart = chord[0].beatStart;
    const cLen   = ci<N-1 ? chords[ci+1][0].beatStart - cStart
                          : Math.max(chord[0].duration, 2);
    const bs     = cLen/4;
    // Anchors: collection tones the current chord actually contains. For a
    // chromatic chord sharing nothing with the collection, the line simply
    // stays inside the collection (a soft rub beats a wrong note).
    const stable  = new Set(stableChordPcs(chord));
    const anchors = pool.filter(m => stable.has(pcOf(m)));
    const aPool   = anchors.length ? anchors : pool;

    const isFull = ci===N-1 && N>1;
    const isHalf = !isFull && ci===half-1;

    // Theme hooks: the Sigh answers the full cadence, the Call opens the
    // phrase, the Turn lands at the arch peak. Each replaces this bar's
    // generated cell; the rest of the line riffs around them. The half
    // cadence keeps its open-on-the-fifth "question" (handled below).
    if (seed) {
      if (isFull) {
        prev = placeHook(seed.hooks.sigh, cStart, bs, cLen, prev, 84);
        continue;
      }
      if (ci===0 && N>1) {
        prev = placeHook(seed.hooks.call, cStart, bs, cLen, CENTER, 76);
        continue;
      }
      if (!isHalf && ci===peakIdx) {
        prev = placeHook(seed.hooks.turn, cStart, bs, cLen, CENTER+7, 80);
        continue;
      }
    }

    if (isFull || isHalf) {
      // Cadences: the full cadence lands long on the harmonic root; the
      // half cadence pauses on the fifth (or another non-root chord tone),
      // leaving the phrase as an open question and giving the line a breath.
      const rootPcCh  = harmonicRootPc(chord);
      const targetPc  = isFull ? rootPcCh : (rootPcCh+7)%12;
      let tPool = pool.filter(m => pcOf(m) === targetPc);
      if (!tPool.length && isHalf) tPool = aPool.filter(m => pcOf(m) !== rootPcCh);
      if (!tPool.length) tPool = aPool;
      const final     = nearestIn(tPool, prev);
      const fi        = poolIdx(final);
      const approach  = pool[clamp(fi + (prev>=final?1:-1), 0, pool.length-1)];
      notes.push({ id:uid(), beatStart:cStart, duration:MEL_CADENCE[0].d*bs,
        midiNote:approach, velocity:74+((Math.random()*8)|0) });
      notes.push({ id:uid(), beatStart:cStart+MEL_CADENCE[1].o*bs,
        duration:Math.min(isFull ? MEL_CADENCE[1].d : 1.6, 4-MEL_CADENCE[1].o)*bs,
        midiNote:final, velocity:(isFull?84:78)+((Math.random()*8)|0) });
      prev = final;
      continue;
    }

    // Arch contour: aim the cell's anchor at a target that rises to the
    // peak chord and falls back toward the center afterwards.
    const lift = ci<=peakIdx ? 7*ci/peakIdx : 7*(N-1-ci)/Math.max(1, N-1-peakIdx);
    const contourTarget = CENTER + Math.round(lift);

    // Alternate the two cells, mutating at most one interval per pass.
    const motif = motifs[ci % 2];
    const shape = [...baseShapes[ci % 2]];
    if (ci>0 && shape.length && Math.random()<.4) {
      const j = (Math.random()*shape.length)|0;
      shape[j] = clamp(shape[j] + (Math.random()<.5?-1:1), -2, 2);
    }

    // Anchor on a chord-and-collection tone near the previous note + contour.
    let anchor = aPool[0], bcost = Infinity;
    for (const t of aPool) {
      const cost = Math.abs(t-prev) + 0.8*Math.abs(t-contourTarget);
      if (cost<bcost) { bcost=cost; anchor=t; }
    }

    let cur = anchor, idx = poolIdx(anchor);
    for (let k=0; k<motif.length; k++) {
      const {o,d} = motif[k];
      if (o*bs >= cLen-0.05) break;
      if (k>0) { idx = clamp(idx + shape[k-1], 0, pool.length-1); cur = pool[idx]; }
      const strong = o<0.5 || (o>=2 && o<2.5);
      // Strong beats and held notes pull to the chord's collection tones;
      // short weak-beat notes walk the collection freely.
      if ((strong || d>=0.8) && anchors.length && !stable.has(pcOf(cur))) {
        cur = nearestIn(anchors, cur);
        idx = poolIdx(cur);
      }
      notes.push({
        id:uid(), beatStart:cStart+o*bs,
        duration:Math.min(d*bs, cLen-o*bs)*0.97,
        midiNote:cur,
        velocity: strong ? 78+((Math.random()*12)|0) : 62+((Math.random()*10)|0)
      });
      prev = cur;
    }
  }
  return notes;
}

// ── ELEMENTAL TRACK GENERATOR ──────────────────────────────────────
// Generates a complete 5-section A-B-A-C track themed to an element.
// All instruments are programmatic — no external MIDI files required.

// FX / instrument defaults for each generated track label, extracted from
// the saved FX state bank (Untitled-fx-states.json). Applied in buildElementalSection.
const TILE_TRACK_FX = {
  'Chords': {
    instrument:'organ', volume:0.22, reverbSend:0.35,
    fx:{ filterType:'lowpass', filterCutoff:1100, filterRes:1.2,
         delayMix:0.20, delaySync:'1/8D',
         lfoDepth:0.25, lfoRate:4.2,
         distDrive:0.06, distMix:0.12 }
  },
  // Glue layer: slow, dark and reverb-y, so the generated
  // lines above sit in a soundscape instead of standing exposed.
  'Pad': {
    instrument:'organ', volume:0.30, reverbSend:0.55,
    fx:{ filterType:'lowpass', filterCutoff:900, filterRes:0.4 }
  },
  'Bass Drone': {
    instrument:'bass', volume:0.6, reverbSend:0.06,
    fx:{ filterType:'lowpass', filterCutoff:600, filterRes:0.7 }
  },
  'Bass Line': {

// Catacomb = a dual-element blend: two of the five godai fused. It takes the
// first element's key and carries a 'blend' orchestration hint (a hybrid of
// the chip + synth palettes) so it actually sounds like a fusion, not a single.
const GODAI = ['earth','water','fire','wind','void'];
function getDualElement() {
  const [a,b] = [...GODAI].sort(()=>Math.random()-.5).slice(0,2);
  const ea=ELEMENTS[a], eb=ELEMENTS[b];
  return {
    emoji:'⚰️', name:`Catacomb: ${ea.name}→${eb.name}`, color:'#4e342e',
    rootPc: ea.rootPc, rootPc2: eb.rootPc,  // split-key journey: A then B
    orch:'blend',   // applyThemeVariation honors this hybrid palette
  };
}

function pickRandomElement() {
  const r = Math.random();
  // The five godai elements, then a chance of a Catacomb (two-element blend).
  if (r < .18) return ELEMENTS.earth;
  if (r < .36) return ELEMENTS.water;
  if (r < .54) return ELEMENTS.fire;
  if (r < .72) return ELEMENTS.wind;
  if (r < .85) return ELEMENTS.void;
  return getDualElement();
}

// Programmatic kick / snare / hat notes for one section
function generateDrumSection(mod, lengthBars) {
  const kick=[], snare=[], hat=[];
  // Hat pattern fixed for the whole section by density tier — a consistent
  // groove every bar, not random 8th-note dropouts.
  const hatSlots = mod.hat >= .8  ? [0,1,2,3,4,5,6,7]   // straight 8ths
                 : mod.hat >= .45 ? [1,3,5,7]           // offbeat 8ths
                 : mod.hat >= .15 ? [2,6]               // beats 2 & 4 only
                 : [];
  for (let bar=0; bar<lengthBars; bar++) {
    const bs = bar*4;
    // Kick: 0 + 2 always, optional syncopated +2.5 in C sections
    for (const b of (mod.xk ? [0,2,2.5] : [0,2]))
      kick.push({ id:uid(), beatStart:bs+b, duration:.42, midiNote:36,
        velocity: clamp(Math.round(100*mod.vel + Math.random()*8-4), 40, 127) });
    // Snare: off-beats 1 + 3
    for (const b of [1,3])
      snare.push({ id:uid(), beatStart:bs+b, duration:.35, midiNote:38,
        velocity: clamp(Math.round(90*mod.vel + Math.random()*6-3), 40, 127) });
    // Hats: accent on-beat slots, soften offbeats, small humanization
    for (const h of hatSlots) {
      const base = h%2===0 ? 56 : 44;
      hat.push({ id:uid(), beatStart:bs+h*.5, duration:.18, midiNote:42,
        velocity: clamp(Math.round((base+Math.random()*10)*mod.vel), 25, 127) });
    }
  }
  return { kick, snare, hat };
}

// Build one complete section — chords/melody/bass + drums
async function buildElementalSection(elCfg, sectionType, lengthBars) {
  const style    = elCfg.sections[sectionType] || 'walkdown';
  const drumMod  = elCfg.drums[sectionType]    || elCfg.drums.A;
  const full     = sectionType !== 'intro';

  // Pre-compute kick positions so the bass line locks to them
  const kickHits = [];
  if (full) {
    for (let bar=0; bar<lengthBars; bar++)
      for (const b of (drumMod.xk ? [0,2,2.5] : [0,2]))
        kickHits.push({ beatStart: bar*4+b });
  }

  // Harmonic source: prefer a random library clip for this element — the
  // hand-curated progressions are far richer than the four built-in
  // patterns. Falls back to the pattern generator if no clip loads
  // (chip + dual elements have no library pool and always use patterns).
  let rawTracks = generateHarmonicProgression(elCfg.rootPc, style);

  // Tile the progression (typically 4 bars) to fill the whole section —
  // otherwise the back half of an 8-bar section is drums-only: no bass,
  // chords or melody under half the kicks. The melody/bass generators then
  // see the full chord list, so the phrase arc and cadence span the section.
  for (const t of Object.values(rawTracks)) {
    let progEnd = 0;
    for (const n of t.notes) progEnd = Math.max(progEnd, n.beatStart + n.duration);
    const progBars = Math.max(1, Math.ceil(progEnd / 4));
    const reps = Math.max(1, Math.ceil(lengthBars / progBars));
    if (reps > 1 || progBars > lengthBars) {
      const orig = t.notes, secBeats = lengthBars * 4;
      t.notes = [];
      for (let rep = 0; rep < reps; rep++)
        for (const n of orig) {
          const bs = n.beatStart + rep * progBars * 4;
          if (bs < secBeats - 0.01)
            t.notes.push({ ...n, id: uid(), beatStart: bs,
                           duration: Math.min(n.duration, secBeats - bs) });
        }
    }
  }

  const roles = expandChordRoles(rawTracks, {
    arp:        full ? (elCfg.arp||'full') : 'off',
    arpMode:    elCfg.chipMode ? 'chip' : 'standard',
    chordStyle: elCfg.chipMode ? 'power' : 'stab', // generated chords always rhythmic
    melody:     full,
    bassLine:   full,
    kickHits,
    // Element as lens: the theme's collection + hooks, re-rooted to this
    // element's key so every track is unmistakably the same theme, refracted.
    melodySeed: { rootPc: elCfg.rootPc, scale: THEME.scale, hooks: THEME.hooks },
  });

  const tracks = {};
  if (roles) for (const t of roles) tracks[t.id] = t;

  // Drum tracks
  if (full) {
    const {kick,snare,hat} = generateDrumSection(drumMod, lengthBars);
    const DRUM_FX = inst => ({
      ...DEFAULT_FX(),
      filterType:'lowpass',
      filterCutoff: inst==='hat'?7000 : inst==='snare'?2800 : 380,
    });
    const mkDrum = (label,inst,notes,vol,color) => {
      const t = { id:uid(), label, instrument:inst, color, volume:vol,
        muted:false, soloed:false, reverbSend:.02, notes, effects:DRUM_FX(inst) };
      tracks[t.id] = t;
    };
    mkDrum('Kick',  'kick',  kick,  .88, '#ff8a65');
    mkDrum('Snare', 'snare', snare, .76, '#a5d6a7');
    mkDrum('Hat',   'hat',   hat,   .58, '#80deea');
  }

  // Apply FX preset per track label — chip mode uses raw chip synths, others use saved preset
  for (const t of Object.values(tracks)) {
    if (elCfg.chipMode) {
      // Chip mode: override instruments with hardware-accurate chip voices
      const chipMap = {
        'Chords':    { instrument:'chip',   volume:0.35, reverbSend:0.08,
                       fx:{ filterType:'lowpass', filterCutoff:8000, filterRes:0.3, distDrive:0.04, distMix:0.04 } },
        'Bass Drone':{ instrument:'chitri', volume:0.60, reverbSend:0.02,
                       fx:{ filterType:'lowpass', filterCutoff:2000, filterRes:0.5 } },
        'Bass Line': { instrument:'chitri', volume:0.65, reverbSend:0.02,
                       fx:{ filterType:'lowpass', filterCutoff:2000, filterRes:0.5 } },
        'Arpeggio':  { instrument:'chip',   volume:0.28, reverbSend:0.04,
                       fx:{ filterType:'highpass', filterCutoff:400, filterRes:0.3 } },
        'Melody':    { instrument:'chisaw', volume:0.38, reverbSend:0.06,
                       fx:{ filterType:'lowpass', filterCutoff:6000, filterRes:0.8,
                            lfoDepth:0.10, lfoRate:6.0 } },
      };
      const cm = chipMap[t.label];
      if (cm) {
        t.instrument = cm.instrument;
        t.volume     = cm.volume;
        t.reverbSend = cm.reverbSend;
        t.effects    = { ...DEFAULT_FX(), ...cm.fx };
      }
    } else {
      // Base FX preset per track label, optionally overridden by a per-element
      // voice so each element can own a distinct timbre (Void sub-bass, Catacomb
      // choir/piano, etc). Element voices win; their fx are layered over the base.
      const preset   = TILE_TRACK_FX[t.label];
      const override = elCfg.voices && elCfg.voices[t.label];
      if (!preset && !override) continue;
      const merged = {
        ...preset,
        ...override,
        fx: { ...(preset && preset.fx), ...(override && override.fx) },
      };
      t.instrument  = merged.instrument;
      t.volume      = merged.volume ?? t.volume;
      t.reverbSend  = merged.reverbSend ?? t.reverbSend;
      t.effects     = { ...DEFAULT_FX(), ...merged.fx };
    }
  }

  // Pinned 🧷 FX state (if any) overrides the element presets above
  applyFxStyleToTracks(Object.values(tracks));

  return { lengthBars, tracks };
}

let _activeElement = null;
let _tileGenCount  = 0;

async function generateElementalTrack() {
  stopPlayback();

  const isBlank = _tileGenCount === 0 ||
    Object.values(project.sections).every(s => !Object.keys(s.tracks).length);

  _activeElement = pickRandomElement();

  if (isBlank) {
    // ── First flip: build fresh 5-section project ──────────────────
    _tileGenCount = 1;
    project = makeProject();
    project.tempo = _activeElement.tempo;

    const DEFS = [
      { id:'In', bars:4, type:'intro' },
      { id:'A',  bars:8, type:'A'     },
      { id:'B',  bars:8, type:'B'     },
      { id:'A+', bars:8, type:'A'     },
      { id:'C',  bars:8, type:'C'     },
    ];
    project.sectionOrder = DEFS.map(d=>d.id);
    project.sections     = {};
    for (const {id,bars,type} of DEFS)
      project.sections[id] = await buildElementalSection(_activeElement, type, bars);

    activeSectionId = 'A';
  } else {
    // ── Subsequent flip: append another 5 sections ─────────────────
    _tileGenCount++;
    const n = _tileGenCount;
    const DEFS = [
      { id:`In${n}`, bars:4, type:'intro' },
      { id:`A${n}`,  bars:8, type:'A'     },
      { id:`B${n}`,  bars:8, type:'B'     },
      { id:`A${n}+`, bars:8, type:'A'     },
      { id:`C${n}`,  bars:8, type:'C'     },
    ];
    for (const {id,bars,type} of DEFS) {
      project.sections[id] = await buildElementalSection(_activeElement, type, bars);
      project.sectionOrder.push(id);
    }
  }

  // ── Refresh everything ─────────────────────────────────────────
  document.getElementById('bpm-input').value = project.tempo;
  if (audioCtx) rebuildEngines();
  renderTrackHeaders(); renderSectionUI(); syncMasterStrip();
  PR.scrollBeat=0; PR.gridDirty=true; PR.dirty=true; schedRedraw();
  saveProject();

  // Update button to show revealed element
  const btn = document.getElementById('btn-tile');
  btn.textContent = `${_activeElement.emoji} ${_activeElement.name}`;
  btn.style.background = _activeElement.color;
  btn.style.color = '#fff';
  btn.style.borderColor = _activeElement.color;
  btn.title = `${_activeElement.name} — click to add 5 more sections`;

  const verb = _tileGenCount===1 ? 'Generated' : `+5 sections (×${_tileGenCount})`;
  const buildTag = document.getElementById('build-tag');
  setStatus(`${_activeElement.emoji} ${verb}: ${_activeElement.name} · ${project.tempo} BPM · [${buildTag?buildTag.textContent:'?'}]`);

// ── COMPOSITIONAL READINGS (one per orchestration) ──────────────────
// Instrument palettes alone are hard to hear once a pinned FX flattens the
// mix, so each orchestration is ALSO a different compositional reading of
// the theme — a real variation, not just an instrument swap:
//   eastern → "ornamented": the theme as written, plus grace-note approaches
//             under the long lead notes (heterophonic ornament).
//   soft    → "lyric": koto ostinato thinned to flowing legato 8ths, shamisen
//             riff becomes sustained long tones, lead smoothed, and the bass
//             drone walks a descending in-collection progression
//             (i → ♭VI → v → iv — borrowed from the 🎲 Chords walkdown).
//   synth   → "pulse": koto offbeats jump an octave (sparkling arp), shamisen
//             becomes a double-time octave bassline, the lead grows dotted-8th
//             echo taps, and the bass pumps straight 8ths.
//   blend   → fusion: ornamented lead + walkdown drone + octave shamisen.
// Every reading keeps the theme's sections, keys, and pentatonic collection,
// so any mix of generations still fits when 🌱 Grow appends them end-to-end.
const THEME_COLLECTION = new Set([2,3,7,9,10]); // D E♭ G A B♭ (pre-transpose)
function collectionToneBelow(m) { // nearest collection pitch strictly below m
  for (let d=1; d<=12; d++) if (THEME_COLLECTION.has(((m-d)%12+12)%12)) return m-d;
  return m;
}

  eastern: { lead:'ornament' },
  soft:    { lead:'legato',   koto:'flow',    shamisen:'longtone', drone:'walkdown' },
  synth:   { lead:'echo',     koto:'sparkle', shamisen:'octave',   drone:'pulse' },

// Apply one orchestration's compositional reading to a melodic track.
// Tuples are [beatStart(section-relative), midiNote(pre-transpose), dur, vel];
// pitch math runs before the element transpose so collection snapping is true
// in every key.
function applyCompReading(orchKey, trackName, rel) {
  const comp = THEME_COMP[orchKey];
  const role = trackName === 'Shakuhachi (Wind lead)' ? 'lead'
             : trackName === 'Koto (Water)'           ? 'koto'
             : trackName === 'Shamisen (Fire)'        ? 'shamisen'
             : null;
  const mode = comp && role && comp[role];
  if (!mode) return rel;
  const onGrid = (b, g) => { const q = b/g; return Math.abs(q - Math.round(q)) < 0.04; };
  const out = [];
  switch (mode) {
    case 'ornament': // quick grace from the collection tone below long notes
      for (const [b,n,d,v] of rel) {
        if (d >= 1.5 && b >= 0.5)
          out.push([+(b-0.25).toFixed(3), collectionToneBelow(n), 0.21,
                    Math.max(30, Math.round(v*0.55))]);
        out.push([b,n,d,v]);
      }
      return out;
    case 'legato':   // drop grace notes, stretch + soften the line
      return rel.filter(([,,d]) => d >= 0.15)
                .map(([b,n,d,v]) => [b, n, +(d*1.15).toFixed(3), Math.max(20, v-6)]);
    case 'echo':     // dotted-8th delay tap under each held note
      for (const [b,n,d,v] of rel) {
        out.push([b,n,d,v]);
        if (d >= 1.9)
          out.push([+(b+0.75).toFixed(3), n, 0.24, Math.max(24, Math.round(v*0.45))]);
      }
      return out;
    case 'flow':     // 16th ostinato → flowing legato 8ths
      return rel.filter(([b]) => onGrid(b, 0.5))
                .map(([b,n,d,v]) => [b, n, Math.min(2, +(d*2.2).toFixed(3)), Math.max(20, v-8)]);
    case 'sparkle':  // offbeat 16ths jump an octave; downbeats accented
      return rel.map(([b,n,d,v]) =>
        [b, onGrid(b, 0.5) ? n : n+12, d,
         Math.min(120, onGrid(b, 1) ? v+8 : v-4)]);
    case 'longtone': // driving 8ths → one sustained tone every 2 beats
      return rel.filter(([b]) => onGrid(b, 2))
                .map(([b,n,d,v]) => [b, n, Math.max(d, 1.85), Math.max(20, v-6)]);
    case 'octave':   // each 8th splits into root + octave-below 16ths
      for (const [b,n,d,v] of rel) {
        if (d <= 0.5) {
          out.push([b, n, 0.22, v]);
          out.push([+(b+0.25).toFixed(3), n-12, 0.2, Math.max(20, v-12)]);
        } else out.push([b,n,d,v]);
      }
      return out;

    "effects": { "reverbMix":0.2, "reverbDecay":2, "delayMix":0.22, "delayTime":0.61, "delayFeedback":0.35, "delaySync":"1/1", "pan":0, "eqHPF":100, "eqLowGain":-3, "eqMidFreq":1500, "eqMidGain":-5, "eqMidQ":0.8, "eqHighGain":3.5, "filterType":"lowpass", "filterCutoff":600, "filterRes":2.3, "lfoDepth":0.04, "lfoRate":12.9, "wowDepth":0.003, "distDrive":0.39, "distMix":0.08, "revrevSend":0.15 }
  }
};
const THEME_MASTER_FX = {"compThreshold":-24,"compRatio":6,"compMakeup":0,"bassGain":8,"bassFreq":120,"masterVolume":0.58,"hissLevel":0.002,"derezBits":13,"derezRate":0.26,"derezMix":0.57};

// Build the theme as a native project, optionally transposed / re-orchestrated
// / re-tempo'd for a riff. transpose is in semitones (drums never move).
//
// Each track's instrument / volume / reverb / FX default to the user's baked
// "FX 7" mix (THEME_FX, keyed by track name), and the master bus to
// THEME_MASTER_FX — so Load Theme comes up sounding finished, not dry. A riff
// passes an `orch` palette, which re-voices the 6 melodic instruments on top of
// the baked FX (the mix character — bright lead, driven kick — is preserved).
// Keep the Bass Drone simple and sustained, but let it move harmonically like a
// slow chord progression (inspired by the 🎲 Chords generator): one long, held
// bass note per BAR, cycling root → fifth → root — an octave down — so it just
// shifts underneath the theme instead of sitting on one static chord or pulsing.
function buildDronePattern(inSec, lo, tr, mode='classic') {
  const byOnset = new Map();
  for (const [b,n,d,v] of inSec) {
    const k = b.toFixed(3);
    if (!byOnset.has(k)) byOnset.set(k, { start:b, dur:d, pitches:[] });
    byOnset.get(k).pitches.push(n);
  }
  const out = [];
  for (const g of byOnset.values()) {
    const p = g.pitches.slice().sort((a,b)=>a-b);
    const R = p[0] - 12;               // root, dropped to bass register

    if (mode === 'pulse') {
      // Pumping straight 8ths: root per bar (fifth in bar 3), offbeats jump
      // an octave up — the synth reading's driving low end.
      const cycle = [R, R, R+7, R];
      for (let bt = 0; bt < g.dur - 0.1; bt += 0.5) {
        const base = cycle[Math.floor(bt/4) % 4];
        const off  = (bt % 1) !== 0;   // offbeat 8th
        out.push({
          id: uid(), beatStart:+(g.start - lo + bt).toFixed(3), duration:0.44,
          midiNote: (off ? base+12 : base) + tr,
          velocity: bt % 4 === 0 ? 72 : off ? 50 : 62,
        });
      }
      continue;
    }

    // One held note per bar. classic: root with a gentle fifth in bar 3.
    // walkdown (lyric reading): step DOWN the theme collection bar by bar
    // (i → ♭VI → v → iv from the tonic) — a real progression, à la 🎲 Chords.
    const w1 = collectionToneBelow(R), w2 = collectionToneBelow(w1),
          w3 = collectionToneBelow(w2);
    const cycle = mode === 'walkdown' ? [R, w1, w2, w3] : [R, R, R+7, R];
    const step = 4;                    // one held note per bar
    let idx = 0;
    for (let bt = 0; bt < g.dur - 0.1; bt += step) {
      const nd = Math.min(step*0.98, g.dur - bt);  // legato — nearly fills the bar
      out.push({
        id: uid(), beatStart:+(g.start - lo + bt).toFixed(3), duration:+nd.toFixed(3),
        midiNote: cycle[idx % cycle.length] + tr,
        velocity: 52,
      });
      idx++;
    }
  }
  return out;
}

// transpose2 + splitIndex implement a Catacomb "split-key journey": sections
// before splitIndex use `transpose` (element A's key), sections from splitIndex
// on use `transpose2` (element B's key) — the piece modulates partway through.
function makeThemeProject({ transpose=0, transpose2=null, splitIndex=3, tempo=THEME_DATA.tempo, orch=null }={}) {
  const proj = makeProject({ title:'Five Elements Theme', tempo });
  proj.sections = {}; proj.sectionOrder = [];
  proj.masterFx = { ...DEFAULT_MASTER_FX(), ...THEME_MASTER_FX };
  const orchSet = orch ? (THEME_ORCH[orch] || THEME_ORCH.eastern) : null;
  const colors  = THEME_DATA.tracks.map((_,i)=>TRACK_COLORS[i%TRACK_COLORS.length]);

  THEME_SECTIONS.forEach((sec, secIdx) => {
    const lo = sec.start, hi = sec.start + sec.bars*4;
    const tr = (transpose2 != null && secIdx >= splitIndex) ? transpose2 : transpose;
    const secObj = { id:sec.id, label:sec.id, lengthBars:sec.bars, tracks:{} };
    THEME_DATA.tracks.forEach((td, ti) => {
      const inSec = td.notes.filter(([b]) => b >= lo-0.001 && b < hi-0.001);
      if (!inSec.length) return;
      const fxDef  = THEME_FX[td.name];
      const isDrone = td.name === 'Strings (drone)';

      // Riffs re-voice the melodic tracks via the orch palette; otherwise use
      // the baked instrument (falling back to the raw embed mapping).
      let inst = (!td.drum && orchSet && ti < orchSet.length)
        ? orchSet[ti]
        : (fxDef?.instrument ?? td.inst);
      // Recompose per the orchestration's reading (pre-transpose, so the
      // collection-based pitch math holds in every element's key).
      let rel = inSec.map(([b,n,d,v]) => [+(b-lo).toFixed(3), n, d, v]);
      if (orch && !td.drum && !isDrone) rel = applyCompReading(orch, td.name, rel);
      let notes = rel.map(([b,n,d,v]) => ({
        id: uid(), beatStart:b, duration:d,
        midiNote: td.drum ? n : n+tr, velocity:v,
      }));
      let effects    = fxDef ? { ...DEFAULT_FX(), ...fxDef.effects } : DEFAULT_FX();
      let volume     = fxDef?.volume ?? THEME_VOL[ti] ?? 0.7;
      let reverbSend = fxDef?.reverbSend ?? (td.drum ? 0.06 : 0.28);

      if (isDrone) {
        // Bass Drone voice + a moving pulse instead of one static held chord.
        // (The baked bandpass FX would gut the low end, so give it a lowpass.)
        inst    = 'bass';
        notes   = buildDronePattern(inSec, lo, tr,
                    (orch && THEME_COMP[orch]?.drone) || 'classic');
        effects = { ...DEFAULT_FX(), filterType:'lowpass', filterCutoff:700, filterRes:0.9,
                    reverbMix:0.25, reverbDecay:2.4,
                    revrevSend: DRONE_REVREV_DEFAULT };
        volume  = 0.5;
        reverbSend = 0.18;
      }
      // Any other drone voice picks up the reverse-reverb default by label
      if (!effects.revrevSend) effects.revrevSend = droneRevRevDefault(td.name);

      const tid = uid();
      secObj.tracks[tid] = {
        id:tid, label:td.name, instrument:inst, color:colors[ti],
        volume, muted:false, soloed:false, reverbSend, notes, effects,
      };
    });
    proj.sections[sec.id] = secObj;
    proj.sectionOrder.push(sec.id);
  });
  return proj;
}

function refreshAfterThemeLoad(statusMsg) {
  document.getElementById('bpm-input').value = project.tempo;
  if (audioCtx) rebuildEngines();
  renderTrackHeaders(); renderSectionUI(); syncMasterStrip();
  PR.scrollBeat=0; PR.gridDirty=true; PR.dirty=true; schedRedraw();
  saveProject();
  const buildTag = document.getElementById('build-tag');
  setStatus(`${statusMsg} · [${buildTag?buildTag.textContent:'?'}]`);
}

let _themeRiffCount = 0;
let _growMode = false;            // ON: Riff Theme appends to the end instead of replacing
let _growUseAllTracksFx = false;  // ON: appended riffs adopt the pinned 🧷 All-Tracks FX

// Append a riff's sections to the end of the current sequence. Section ids are
// suffixed so they stay unique; track objects keep their own uids. Returns the
// id of the first appended section (so we can jump the view to it).
function appendRiffSections(riff, tag) {
  let first = null;
  for (const secId of riff.sectionOrder) {
    const sec = riff.sections[secId];
    const newId = `${secId} ${tag}`;
    sec.id = newId; sec.label = newId;
    project.sections[newId] = sec;
    project.sectionOrder.push(newId);
    if (!first) first = newId;
  }
  return first;
}

const NOTE_NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];

// Apply ONE specific theme variation ("generation"): transpose to the element's
// key, re-orchestrate (orch=null keeps the baked instruments), then grow-or-
// replace per the current Grow mode + FX toggle. Both the random Riff button and
// the generation menu route through here.
async function applyThemeVariation(el, orch) {
  const btn = document.getElementById('btn-tile');
  const growing = _growMode && _themeRiffCount > 0 && project?.sectionOrder?.length;

  // Growing extends the sequence live, so it must NOT interrupt playback.
  if (!growing) stopPlayback();

  const delta = ((el.rootPc - THEME_DATA.rootPc + 18) % 12) - 6; // nearest, within ±6
  // Catacomb dual: modulate to the second element's key halfway through.
  const isDual = (el.rootPc2 != null);
  const delta2 = isDual ? ((el.rootPc2 - THEME_DATA.rootPc + 18) % 12) - 6 : null;
  const keyStr = isDual ? `${NOTE_NAMES[el.rootPc]}→${NOTE_NAMES[el.rootPc2]}` : NOTE_NAMES[el.rootPc];
  const riff  = makeThemeProject(
    isDual ? { transpose:delta, transpose2:delta2, splitIndex:3, orch }
           : { transpose:delta, orch });

  // 🥁 Drummer mode: swap the baked drums for random library loops (one per
  // section) BEFORE any FX pinning, so pinned styles cover them too.
  let drumNote = '';
  if (_drummerMode) {
    const used = await applyDrummerToRiff(riff);
    if (used.length) drumNote = ` · 🥁${used.length} loop${used.length !== 1 ? 's' : ''}`;
  }

  // FX source: the pinned 🧷 All-Tracks style, or the baked theme default.
  const style = _growUseAllTracksFx ? activeFxStyle() : null;
  if (style)
    for (const sec of Object.values(riff.sections))
      applyFxStyleToTracks(Object.values(sec.tracks));
  const fxNote   = _growUseAllTracksFx ? (style ? ' · 🧷FX' : ' · 🧷FX(none pinned→default)') : '';
  const orchName = orch ? `${orch}·${COMP_TAGS[orch] || ''}` : 'default';

  const riffN = _themeRiffCount;
  _themeRiffCount++;

  if (growing) {
    const wasPlaying = isPlaying;
    appendRiffSections(riff, `r${riffN}`);
    growRefresh(
      `${el.emoji} Grew +${riff.sectionOrder.length}: ${el.name} · key ${keyStr} · ${orchName}${fxNote}${drumNote}${wasPlaying?' · still playing →':''}`);
  } else {
    project = riff;
    activeSectionId = project.sectionOrder[0];
    refreshAfterThemeLoad(
      `${el.emoji} ${el.name} · key ${keyStr} · ${project.tempo} BPM · ${orchName}${fxNote}${drumNote}`);
  }
  btn.textContent = `${el.emoji} Riff Theme`;
  btn.style.background = el.color; btn.style.color = '#fff'; btn.style.borderColor = el.color;
}

// Button: first press loads the real theme; each press after riffs on it at RANDOM.
// (The generation menu beside it picks a specific variation deterministically.)
function themeButton() {
  if (_themeRiffCount === 0) {
    stopPlayback();
    project = makeThemeProject();
    _themeRiffCount = 1;
    activeSectionId = project.sectionOrder[0];
    refreshAfterThemeLoad('☯ Theme loaded — the real thing · 94 BPM · D miyako-bushi');
    const btn = document.getElementById('btn-tile');
    btn.textContent = '☯ Riff Theme';
    btn.style.background = '#311b92'; btn.style.color = '#fff'; btn.style.borderColor = '#311b92';
    btn.title = 'Riff on the theme — transpose, re-orchestrate, recompose (random). Use the menu to pick a specific one.';
    return;
  }
  const el   = pickRandomElement();
  // A Catacomb/dual carries its own 'blend' palette; singles get a random one.
  const orch = el.orch || ['eastern','soft','synth'][(Math.random()*3)|0];
  applyThemeVariation(el, orch);
}

// Every potential generation: the original, plus each godai element × each

function buildGenerationList() {

// Refresh after a grow without touching the transport: preload the appended
