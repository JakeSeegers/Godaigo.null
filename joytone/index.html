  el.style.color = isErr ? '#f88' : '#888';
  if (!isErr) setTimeout(() => { if (el.textContent===msg) el.style.color=''; }, 4000);
}

// ── DATA MODEL ─────────────────────────────────────────────────────
function makeTrack(overrides={}) {
  const idx = Object.keys(
    project ? (project.sections[activeSectionId]?.tracks||{}) : {}
  ).length;
  const defaultInstruments = INSTRUMENTS.filter(i => !['kick','snare','hat'].includes(i.id));
  return {
    id: uid(),
    label: `Track ${idx+1}`,
    instrument: defaultInstruments[idx % defaultInstruments.length].id,
    color: TRACK_COLORS[idx % TRACK_COLORS.length],
    volume: 0.8,
    muted: false,
    soloed: false,
    reverbSend: 0.2,
    notes: [],
    effects: { ...DEFAULT_FX(), ...(INST_FILTER[overrides.instrument] || {}) },
    ...overrides
  };
}

function makeNote(beatStart, midiNote, duration=0.5, velocity=100) {
  return { id: uid(), beatStart, duration, midiNote, velocity };
}

function makeSection(id) {
  return {
    id, label: id, lengthBars: 2,
    tracks: {},
  };
}

function makeProject(overrides={}) {
  const secA = makeSection('A');
  return {
    version: 2,
    title: 'Untitled',
    tempo: 120,
    sectionOrder: ['A'],
    sections: { A: secA },
    masterFx: DEFAULT_MASTER_FX(),
    ...overrides,
  };
}

// Deep-clone serializable data (no audio nodes)
function cloneData(x) { return JSON.parse(JSON.stringify(x)); }

// Get all tracks shared across sections (by id) — returns tracks from active section
function activeTracks() {
  return project.sections[activeSectionId]?.tracks || {};
}

// The selected track is the edit target for drawing new notes.
function ensureSelectedTrack() {
  const tracks = activeTracks();
  if (selectedTrackId && tracks[selectedTrackId]) return tracks[selectedTrackId];
  const first = Object.values(tracks)[0] || null;
  selectedTrackId = first ? first.id : null;
  return first;
}

function updateSelectedTrackHighlight() {
  document.querySelectorAll('.track-card').forEach(card => {
    card.classList.toggle('selected', card.dataset.trackId === selectedTrackId);
  });
}

function selectTrack(id, { render=false, save=true } = {}) {
  const tracks = activeTracks();
  if (!tracks[id]) return null;
  selectedTrackId = id;
  if (render) renderTrackHeaders();
  else updateSelectedTrackHighlight();
  if (save) saveProject();
  return tracks[id];
}

// ── UNDO ───────────────────────────────────────────────────────────
function pushUndo() {
  undoStack.push(cloneData({ project, activeSectionId, selectedTrackId }));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  document.getElementById('btn-undo').disabled = false;
}

function performUndo() {
  if (!undoStack.length) return;
  const snap = undoStack.pop();
  project = snap.project;
  activeSectionId = snap.activeSectionId;
  selectedTrackId = snap.selectedTrackId || null;
  ensureSelectedTrack();
  if (!undoStack.length) document.getElementById('btn-undo').disabled = true;
  rebuildEngines();
  renderTrackHeaders();
  renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw();
  setStatus('Undo');
}

// ── PERSISTENCE ────────────────────────────────────────────────────
// Set by the Godaigo embed adapter for the duration of a game session (see
// boot()/stopAll() below). A play-through must never overwrite the
// designer's own saved project/FX bank in this browser's localStorage —
// otherwise opening the standalone tool later would show leftover in-game
// riffs instead of what the designer actually left there, and "what loads
// by default" would silently drift out from under them.
let _gameSessionActive = false;

function saveProject() {
  if (_gameSessionActive) return;
  try { localStorage.setItem('daw-v2', JSON.stringify({ project, activeSectionId, selectedTrackId, fxSnapshots, fxStateSticky, activeFxStateId, metaState, brownOn, brownLevel })); }
  catch(e) {}
}

function normalizeProjectData() {
  if (!project) return;
  project.masterFx = { ...DEFAULT_MASTER_FX(), ...(project.masterFx || {}) };
  for (const sec of Object.values(project.sections || {})) {
    for (const track of Object.values(sec.tracks || {})) {
      track.notes = track.notes || [];
      // Retired MP3 sample voices in old saves → closest synthesized voice.
      track.instrument = normalizeInstrument(track.instrument);
      delete track.sample;
      // Old saves predate revrevSend — give drone tracks their default before
      // the DEFAULT_FX merge would pin them to 0.
      if ((track.effects || {}).revrevSend == null) {
        (track.effects = track.effects || {}).revrevSend = droneRevRevDefault(track.label);
      }
      track.effects = {
        ...DEFAULT_FX(),
        ...(INST_FILTER[track.instrument] || {}),
        ...(track.effects || {})
      };
    }
  }
}

function loadSaved() {
  try {
    const raw = localStorage.getItem('daw-v2');
    if (!raw) return false;
    const data = JSON.parse(raw);
    project = data.project;
    normalizeProjectData();
    activeSectionId = data.activeSectionId || project.sectionOrder[0];
    selectedTrackId = data.selectedTrackId || null;
    fxSnapshots = Array.isArray(data.fxSnapshots) ? data.fxSnapshots : [];
    fxStateSticky = !!data.fxStateSticky;
    activeFxStateId = data.activeFxStateId || null;
    metaState = (data.metaState && typeof data.metaState === 'object')
      ? { version: 1, updatedAt: data.metaState.updatedAt || null, roles: data.metaState.roles || {} }
      : { version: 1, updatedAt: null, roles: {} };
    for (const r of Object.values(metaState.roles)) r.effects = { ...DEFAULT_FX(), ...(r.effects || {}) };
    brownOn = !!data.brownOn;
    brownLevel = (typeof data.brownLevel === 'number') ? data.brownLevel : 0.3;
    ensureSelectedTrack();
    return true;
  } catch(e) { return false; }
}

// ── AUDIO INIT ─────────────────────────────────────────────────────
async function ensureAudio() {
  if (!powerOn) return;   // master power off: never create or resume the audio engine
  if (audioCtx) {
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();

  noiseBuffer = createNoiseBuffer(audioCtx);

  // Master bus chain: trackGains → sharedReverb/Delay → compressor → limiter → dest
  sharedReverb = audioCtx.createConvolver();
  sharedReverb.buffer = buildReverbIR(audioCtx, 2.0);

  // Reverse-reverb bus: parallel to the normal verb, fed per-track by rrSend
  sharedRevRev = audioCtx.createConvolver();
  sharedRevRev.buffer = buildReverseReverbIR(audioCtx, 2.6);

  sharedDelay = audioCtx.createDelay(2.0);
  sharedDelay.delayTime.value = 0.375;
  const delayFB = audioCtx.createGain(); delayFB.gain.value = 0.35;
  sharedDelay.connect(delayFB); delayFB.connect(sharedDelay);

  reverbReturn = audioCtx.createGain(); reverbReturn.gain.value = 0.5;
  revRevReturn = audioCtx.createGain(); revRevReturn.gain.value = 0.6;
  delayReturn  = audioCtx.createGain(); delayReturn.gain.value  = 0.4;
  sharedReverb.connect(reverbReturn);
  sharedRevRev.connect(revRevReturn);
  sharedDelay.connect(delayReturn);

  // Reverb HP filter (prevents mud) + LP (keeps the tail dark, not ringy)
  const rvHp = audioCtx.createBiquadFilter();
  rvHp.type = 'highpass'; rvHp.frequency.value = 180;
  const rvLp = audioCtx.createBiquadFilter();
  rvLp.type = 'lowpass'; rvLp.frequency.value = 4500; rvLp.Q.value = 0.4;
  reverbReturn.connect(rvHp); rvHp.connect(rvLp);

  // The reverse-reverb return gets its own, DARKER filtering (LP 2800 vs the
  // forward verb's 4500): a swell is anticipation, not information — capping
  // its highs guarantees no seed pitch can ever turn the creep-in shrill.
  const rrHp = audioCtx.createBiquadFilter();
  rrHp.type = 'highpass'; rrHp.frequency.value = 180;
  const rrLp = audioCtx.createBiquadFilter();
  rrLp.type = 'lowpass'; rrLp.frequency.value = 2800; rrLp.Q.value = 0.4;
  revRevReturn.connect(rrHp); rrHp.connect(rrLp);

  compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -18; compressor.ratio.value = 6;
  compressor.knee.value = 8; compressor.attack.value = 0.012; compressor.release.value = 0.28;

  outputLimiter = audioCtx.createDynamicsCompressor();
  outputLimiter.threshold.value = project.masterFx.limiterCeiling ?? -1; outputLimiter.ratio.value = 20;
  outputLimiter.knee.value = 0; outputLimiter.attack.value = 0.001; outputLimiter.release.value = 0.05;

  masterBus = audioCtx.createGain();
  masterBus.gain.value = 1.0; // unity sum — the compressor/limiter act on the full mix
  // (consistent loudness regardless of VOL); VOL is the post-chain trim (masterOut).

  // Bass boost (low-shelf EQ) sits between masterBus and compressor
  bassBoost = audioCtx.createBiquadFilter();
  bassBoost.type = 'lowshelf';
  bassBoost.frequency.value = project.masterFx.bassFreq;
  bassBoost.gain.value      = project.masterFx.bassGain;

  rvLp.connect(bassBoost);
  rrLp.connect(bassBoost);
  delayReturn.connect(bassBoost);
  masterBus.connect(bassBoost);
  bassBoost.connect(compressor);
  compressor.connect(outputLimiter);

  // ── DeRez — synchronous dry/wet split after limiter ────────────
  // Dry path: outputLimiter → derezDryGain → destination
  // Wet path: outputLimiter → derezCrusher → derezFilter → derezWetGain → destination
  // WaveShaper handles both L and R channels automatically — no stereo bug possible.
  {
    const dfx = project.masterFx;
    const mix  = dfx.derezMix  ?? 0;
    const bits = dfx.derezBits ?? 16;
    const rate = dfx.derezRate ?? 1;

    derezDryGain = audioCtx.createGain();
    derezWetGain = audioCtx.createGain();
    derezDryGain.gain.value = 1 - mix;
    derezWetGain.gain.value = mix;

    derezCrusher = audioCtx.createWaveShaper();
    derezCrusher.curve = buildBitCrushCurve(bits);
    derezCrusher.oversample = 'none'; // keep hard quantisation steps — that IS the chiptune crunch

    derezFilter = audioCtx.createBiquadFilter();
    derezFilter.type = 'lowpass';
    derezFilter.frequency.value = Math.round(2000 + 20050 * rate); // 2kHz–22kHz
    derezFilter.Q.value = 0.5;

    outputLimiter.connect(derezDryGain);
    outputLimiter.connect(derezCrusher);
    derezCrusher.connect(derezFilter);
    derezFilter.connect(derezWetGain);

    // Final output trim — VOL lives here, after every dynamics/colour stage, so
    // it's a true linear output level the compressor can't fight.
    masterOut = audioCtx.createGain();
    masterOut.gain.value = project.masterFx.masterVolume;
    derezDryGain.connect(masterOut);
    derezWetGain.connect(masterOut);
    softClip = audioCtx.createWaveShaper();
    softClip.curve = buildSoftClipCurve();
    softClip.oversample = '2x';
    masterOut.connect(softClip);
    softClip.connect(audioCtx.destination);
  }

  // Tape hiss routes AFTER compressor so loud notes don't pump it
  startTapeHiss(audioCtx, outputLimiter);
  // Procedural crackles go to the same post-comp point.
  // Skipped inside the Godaigo iframe: deliberate vinyl-dust pops read as a
  // defect during a game (players already reported "crackling").
  if (window.self === window.top) startCrackleEngine(audioCtx, outputLimiter);
}

// Procedural vinyl crackles — random micro-impulses, mid-focused bandpass
// 20% chance every ~900ms with jitter, simulates dust on vinyl
function startCrackleEngine(ctx, dest) {
  function schedNext() {
    const wait = 600 + Math.random() * 700; // 600–1300 ms
    setTimeout(() => {
      if (Math.random() < 0.22) {
        const t = ctx.currentTime + Math.random() * 0.05; // up to 50ms future offset
        const dur = 0.005 + Math.random() * 0.008;        // 5–13ms impulse
        const fq  = 1200 + Math.random() * 2400;          // 1200–3600 Hz bandpass
        noiseBurst(ctx, dest, t, dur, 'bandpass', fq, 1.5, 0.03 + Math.random()*0.04);
      }
      schedNext();
    }, wait);
  }
  schedNext();
}

// Tape hiss — white noise bandpassed into the 1.2–8 kHz "air" range.
// Starts silent; fades in when playback starts, fades out when stopped.
function startTapeHiss(ctx, dest) {
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer;
  src.loop = true;

  // High-pass to cut the rumble below ~1.2 kHz
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 1200;
  hp.Q.value = 0.5;

  // Low-pass to soften anything above ~8 kHz
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 8000;
  lp.Q.value = 0.5;

  hissGainNode = ctx.createGain();
  hissGainNode.gain.value = 0; // starts silent; fades in on play

  src.connect(hp);
  hp.connect(lp);
  lp.connect(hissGainNode);
  hissGainNode.connect(dest);
  src.start();
}

// Brown noise ambient bed: load mp3/brownnoise.mp3 once, loop it forever through
// brownGain → masterOut (so it follows master VOL and is killed by Power off).
// Runs independently of the transport. Call this whenever the toggle, the level,
// or power state changes.
async function applyBrownNoise() {
  if (!powerOn) return;
  await ensureAudio();
  if (!audioCtx) return;
  if (brownOn && brownLevel > 0) {
    if (!brownBuffer) {
      try { brownBuffer = await audioCtx.decodeAudioData(await (await fetch('mp3/brownnoise.mp3')).arrayBuffer()); }
      catch (e) { setStatus('Could not load brownnoise.mp3', true); return; }
    }
    if (!brownGain) {
      brownGain = audioCtx.createGain();
      brownGain.gain.value = 0;
      brownGain.connect(masterOut || audioCtx.destination);
    }
    if (!brownSource) {
      brownSource = audioCtx.createBufferSource();
      brownSource.buffer = brownBuffer;
      brownSource.loop = true;
      brownSource.connect(brownGain);
      brownSource.start();
    }
    brownGain.gain.setTargetAtTime(brownLevel, audioCtx.currentTime, 0.15);
  } else if (brownGain) {
    brownGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.15);
  }
}

// ── TRACK ENGINE ───────────────────────────────────────────────────
class TrackEngine {
  constructor(track) {
    const ctx = audioCtx;
    this.trackId = track.id;

    this.trackGain = ctx.createGain();
    this.trackGain.gain.value = track.muted ? 0 : track.volume;

    this.panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (this.panner) this.panner.pan.value = clamp(track.effects.pan ?? 0, -1, 1);

    this.eqHPF = ctx.createBiquadFilter();
    this.eqHPF.type = 'highpass';
    this.eqHPF.frequency.value = clamp(track.effects.eqHPF ?? 20, 20, 800);
    this.eqHPF.Q.value = 0.707;

    this.eqLow = ctx.createBiquadFilter();
    this.eqLow.type = 'lowshelf';
    this.eqLow.frequency.value = 160;
    this.eqLow.gain.value = track.effects.eqLowGain ?? 0;

    this.eqMid = ctx.createBiquadFilter();
    this.eqMid.type = 'peaking';
    this.eqMid.frequency.value = clamp(track.effects.eqMidFreq ?? 1000, 150, 5000);
    this.eqMid.Q.value = clamp(track.effects.eqMidQ ?? 1, 0.2, 8);
    this.eqMid.gain.value = track.effects.eqMidGain ?? 0;

    this.eqHigh = ctx.createBiquadFilter();
    this.eqHigh.type = 'highshelf';
    this.eqHigh.frequency.value = 6000;
    this.eqHigh.gain.value = track.effects.eqHighGain ?? 0;

    this.filter = ctx.createBiquadFilter();
    this.filter.type = track.effects.filterType || 'bandpass';
    this.filter.frequency.value = track.effects.filterCutoff;
    this.filter.Q.value = track.effects.filterRes;

    this.lfo = ctx.createOscillator();
    this.lfoGain = ctx.createGain();
    this.lfo.type = 'sine';
    this.lfo.frequency.value = Math.max(0.01, track.effects.lfoRate);
    this.lfoGain.gain.value = track.effects.lfoDepth * track.effects.filterCutoff * 0.5;
    this.lfo.connect(this.lfoGain);
    this.lfoGain.connect(this.filter.frequency);
    this.lfo.start();

    // Tanh soft-clipper (tape saturation) — always active at low drive
    this.saturator     = ctx.createWaveShaper();
    this.saturator.curve = buildDistCurve(track.effects.distDrive || 0.08);
    this.saturator.oversample = '2x';
    this.saturatorDry  = ctx.createGain(); this.saturatorDry.gain.value  = 1 - (track.effects.distMix||0.07);
    this.saturatorWet  = ctx.createGain(); this.saturatorWet.gain.value  = track.effects.distMix||0.07;

    this.dryGain   = ctx.createGain(); this.dryGain.gain.value = 1;
    this.rvSend    = ctx.createGain(); this.rvSend.gain.value = track.reverbSend * track.effects.reverbMix;
    this.rrSend    = ctx.createGain(); this.rrSend.gain.value = track.effects.revrevSend || 0;
    // Pre-roll ghost input: seeds played here reach ONLY the reverse convolver
    // (no dry path), so the lead-in swell is heard without an early dry note.
    // Level is the Rev-verse amount; the per-PITCH boost/cut happens per seed
    // in scheduleRevRevGhost (low dark notes boosted, high notes tamed).
    this.rrGhostIn = ctx.createGain(); this.rrGhostIn.gain.value = track.effects.revrevSend || 0;
    this.rrGhostIn.connect(sharedRevRev);
    this.dlySend   = ctx.createGain(); this.dlySend.gain.value = track.effects.delayMix;

    // Per-track delay line. The old shared delay made one track's delay-time/feedback
    // sliders affect every delayed track; each TrackEngine now owns its own delay loop.
    this.delay = ctx.createDelay(2.0);
    this.delay.delayTime.value = trackDelayTime(track);
    this.delayFeedback = ctx.createGain();
    this.delayFeedback.gain.value = clamp(track.effects.delayFeedback ?? 0.35, 0, 0.95);

    // satBus merges dry+wet saturator paths before going to out splits
    this.satBus = ctx.createGain(); this.satBus.gain.value = 1;

    // Per-track DeRez — bit crusher applied BEFORE saturation so quantisation
    // steps get amplified by the distortion rather than washed out by it.
    this.derezCrusher = ctx.createWaveShaper();
    this.derezCrusher.curve = buildBitCrushCurve(project.masterFx?.derezBits ?? 16);
    this.derezCrusher.oversample = 'none';

    // Wire: trackGain → pan → corrective EQ → derez → creative filter → saturation → [dry, rv, per-track delay sends]
    if (this.panner) {
      this.trackGain.connect(this.panner);
      this.panner.connect(this.eqHPF);
    } else {
      this.trackGain.connect(this.eqHPF);
    }
    this.eqHPF.connect(this.eqLow);
    this.eqLow.connect(this.eqMid);
    this.eqMid.connect(this.eqHigh);
    this.eqHigh.connect(this.derezCrusher);
    this.derezCrusher.connect(this.filter);
    this.filter.connect(this.saturatorDry);
    this.filter.connect(this.saturator);
    this.saturator.connect(this.saturatorWet);
    this.saturatorDry.connect(this.satBus);
    this.saturatorWet.connect(this.satBus);
    this.satBus.connect(this.dryGain);
    this.satBus.connect(this.rvSend);
    this.satBus.connect(this.rrSend);
    this.satBus.connect(this.dlySend);
    this.dryGain.connect(masterBus);
    this.rvSend.connect(sharedReverb);
    this.rrSend.connect(sharedRevRev);
    this.dlySend.connect(this.delay);
    this.delay.connect(this.delayFeedback);
    this.delayFeedback.connect(this.delay);
    this.delay.connect(delayReturn);
  }

  dest() { return this.trackGain; }
  ghostDest() { return this.rrGhostIn; }

  apply(track) {
    const anySolo = Object.values(activeTracks()).some(t => t.soloed);
    const vol = track.muted ? 0 : (anySolo && !track.soloed ? 0 : track.volume);
    this.trackGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.01);
    if (this.panner) this.panner.pan.setTargetAtTime(clamp(track.effects.pan ?? 0, -1, 1), audioCtx.currentTime, 0.02);
    this.eqHPF.frequency.setTargetAtTime(clamp(track.effects.eqHPF ?? 20, 20, 800), audioCtx.currentTime, 0.02);
    this.eqLow.gain.setTargetAtTime(track.effects.eqLowGain ?? 0, audioCtx.currentTime, 0.02);
    this.eqMid.frequency.setTargetAtTime(clamp(track.effects.eqMidFreq ?? 1000, 150, 5000), audioCtx.currentTime, 0.02);
    this.eqMid.Q.setTargetAtTime(clamp(track.effects.eqMidQ ?? 1, 0.2, 8), audioCtx.currentTime, 0.02);
    this.eqMid.gain.setTargetAtTime(track.effects.eqMidGain ?? 0, audioCtx.currentTime, 0.02);
    this.eqHigh.gain.setTargetAtTime(track.effects.eqHighGain ?? 0, audioCtx.currentTime, 0.02);
    this.filter.type = track.effects.filterType || 'bandpass';
    this.filter.frequency.setTargetAtTime(track.effects.filterCutoff, audioCtx.currentTime, 0.02);
    this.filter.Q.value = track.effects.filterRes;
    this.lfo.frequency.value = Math.max(0.01, track.effects.lfoRate);
    this.lfoGain.gain.setTargetAtTime(
      track.effects.lfoDepth * track.effects.filterCutoff * 0.5,
      audioCtx.currentTime, 0.02
    );
    this.rvSend.gain.setTargetAtTime(track.reverbSend * track.effects.reverbMix, audioCtx.currentTime, 0.02);
    this.rrSend.gain.setTargetAtTime(track.effects.revrevSend || 0, audioCtx.currentTime, 0.02);
    this.rrGhostIn.gain.setTargetAtTime(track.effects.revrevSend || 0, audioCtx.currentTime, 0.02);
    this.dlySend.gain.setTargetAtTime(track.effects.delayMix, audioCtx.currentTime, 0.02);
    this.delay.delayTime.setTargetAtTime(
      trackDelayTime(track),
      audioCtx.currentTime, 0.02
    );
    this.delayFeedback.gain.setTargetAtTime(
      clamp(track.effects.delayFeedback ?? 0.35, 0, 0.95),
      audioCtx.currentTime, 0.02
    );
    // Update saturator
    const drive = track.effects.distDrive ?? 0.08;
    const mix   = track.effects.distMix   ?? 0.07;
    this.saturator.curve = buildDistCurve(drive);
    this.saturatorDry.gain.setTargetAtTime(1-mix, audioCtx.currentTime, 0.02);
    this.saturatorWet.gain.setTargetAtTime(mix,   audioCtx.currentTime, 0.02);
  }

  // Update the per-track bit crusher from master derez settings
  applyDerez(bits) {
    if (this.derezCrusher) this.derezCrusher.curve = buildBitCrushCurve(bits ?? 16);
  }

  destroy() {
    try { this.lfo.stop(); } catch(e) {}
    for (const node of [
      this.trackGain, this.panner, this.eqHPF, this.eqLow, this.eqMid, this.eqHigh,
      this.derezCrusher, this.filter,
      this.saturator, this.saturatorDry, this.saturatorWet, this.satBus,
      this.dryGain, this.rvSend, this.rrSend, this.rrGhostIn, this.dlySend, this.delay,
      this.delayFeedback, this.lfoGain
    ]) { try { node.disconnect(); } catch(e) {} }
  }
}

function rebuildEngines() {
  if (!audioCtx) return;
  // Destroy stale engines
  for (const id of Object.keys(trackEngines)) {
    trackEngines[id].destroy();
    delete trackEngines[id];
  }
  // Create engines for current section tracks
  for (const track of Object.values(activeTracks())) {
    trackEngines[track.id] = new TrackEngine(track);
  }
}

function getOrCreateEngine(track) {
  if (!trackEngines[track.id]) {
    trackEngines[track.id] = new TrackEngine(track);
  }
  return trackEngines[track.id];
}

// Grow mode keeps appending sections for the length of a game and never
// removes old ones, so trackEngines would otherwise accumulate one
// permanently-connected node chain (+ a running LFO) per track forever.
// Called whenever the playback cursor moves to a new section: keeps only
// the previous/current/next section's engines alive (previous stays alive
// so its reverb/rev-reverb tail can finish decaying; next stays alive
// because the rev-reverb pre-roll schedules into it slightly ahead of
// time) and tears down everything else. Torn-down tracks recreate their
// engine lazily via getOrCreateEngine() the next time they're reached.
function pruneDistantEngines() {
  if (!project?.sectionOrder?.length) return;
  const n = project.sectionOrder.length;
  const idx = ((currentSectionPlayIdx % n) + n) % n;
  const keepSections = new Set([
    project.sectionOrder[(idx - 1 + n) % n],
    project.sectionOrder[idx],
    project.sectionOrder[(idx + 1) % n],
  ]);
  const keepTrackIds = new Set();
  for (const secId of keepSections) {
    const sec = project.sections[secId];
    if (sec) for (const id of Object.keys(sec.tracks)) keepTrackIds.add(id);
  }
  for (const id of Object.keys(trackEngines)) {
    if (!keepTrackIds.has(id)) {
      trackEngines[id].destroy();
      delete trackEngines[id];
    }
  }
}

// ── SYNTHESIS ──────────────────────────────────────────────────────
function createNoiseBuffer(ctx) {
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return buf;
}

function buildReverbIR(ctx, decay) {
  const len = Math.floor(ctx.sampleRate * Math.max(decay, 0.3));
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch=0;ch<2;ch++) {
    const d = buf.getChannelData(ch);
    // One-pole lowpass over the noise, closing as the tail decays — highs die
    // faster than lows like a real room, so the verb is soft instead of metallic.
    let lp = 0;
    for (let i=0;i<len;i++) {
      const a = 0.45 - 0.33*(i/len);
      lp += a * ((Math.random()*2-1) - lp);
      d[i] = lp * Math.pow(1-i/len, decay*1.2) * 2.2;
    }
  }
  return buf;
}

// Reverse-reverb IR: the same room, time-flipped. Convolving with it makes
// each note's reverb CRESCENDO into the sound instead of trailing off — the
// live equivalent of the studio bounce → reverse → reverb → reverse trick.
function buildReverseReverbIR(ctx, decay) {
  const buf = buildReverbIR(ctx, decay);
  for (let ch = 0; ch < buf.numberOfChannels; ch++) buf.getChannelData(ch).reverse();
  return buf;
}

// Tanh soft-clipper — warm even-order harmonics, no harsh digital edge
function buildDistCurve(drive) {
  const n=512, c=new Float32Array(n), amount=Math.max(drive*12, 0.001);
  const norm = Math.tanh(amount);
  for(let i=0;i<n;i++){
    const x=i*2/(n-1)-1;
    c[i] = Math.tanh(amount*x) / norm;
  }
  return c;
}

function noiseBurst(ctx, dest, t, dur, fType, fFreq, fQ, gain) {
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer;
  const f = ctx.createBiquadFilter(); f.type=fType; f.frequency.value=fFreq; f.Q.value=fQ||1;
  const g = ctx.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(dest);
  src.start(t); src.stop(t+dur+0.01);
}

// ── SOUNDFONT (SF2) INSTRUMENTS ─────────────────────────────────────
// Minimal SoundFont2 backend: real multi-sampled instrument voices from
// sf2/florestan-subset.sf2, playable per MIDI note like the synths. Unlike the
// retired MP3 one-shots, SF2 samples carry authored root keys, fine tuning and
// loop points — no pitch-detection guesswork. Pragmatic subset of the spec:
// key-ranged zones, tuning, loop modes, attenuation and release; no modulators
// or velocity layers (this bank doesn't rely on them).
const SF2_URL = 'sf2/florestan-subset.sf2';
const SF2_INSTRUMENTS = [
  { id:'sf_piano',      label:'Piano (SF)',         preset:2   },
  { id:'sf_musicbox',   label:'Music Box (SF)',     preset:10  },
  { id:'sf_marimba',    label:'Marimba (SF)',       preset:12  },
  { id:'sf_churchorg',  label:'Church Organ (SF)',  preset:19  },
  { id:'sf_accordion',  label:'Accordion (SF)',     preset:21  },
  { id:'sf_nylongt',    label:'Nylon Guitar (SF)',  preset:24  },
  { id:'sf_synthbass',  label:'Synth Bass (SF)',    preset:38  },
  { id:'sf_violin',     label:'Violin (SF)',        preset:40  },
  { id:'sf_pizzicato',  label:'Pizzicato (SF)',     preset:45  },
  { id:'sf_orchhit',    label:'Orchestra Hit (SF)', preset:55  },
  { id:'sf_brass',      label:'Brass (SF)',         preset:61  },
  { id:'sf_panflute',   label:'Pan Flute (SF)',     preset:75  },
  { id:'sf_basslead',   label:'Bass & Lead (SF)',   preset:87  },
  { id:'sf_polysynth',  label:'Polysynth (SF)',     preset:90  },
  { id:'sf_soundtrack', label:'Soundtrack (SF)',    preset:97  },
  { id:'sf_bagpipe',    label:'Bagpipe (SF)',       preset:109 },
  { id:'sf_taiko',      label:'Taiko (SF)',         preset:116 },
];
const SF2_BY_ID = Object.fromEntries(SF2_INSTRUMENTS.map(s => [s.id, s]));
function isSf2Instrument(id) { return !!SF2_BY_ID[id]; }

let _sf2Bank = null;     // { bank: Map(preset# → {name, zones}), pcm: Int16Array }
let _sf2Promise = null;  // in-flight / completed load

function parseSf2(buf) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  const tag = o => String.fromCharCode(u8[o], u8[o+1], u8[o+2], u8[o+3]);
  const str = (o,n) => { let s=''; for (let i=0;i<n;i++){ const c=u8[o+i]; if (!c) break; s+=String.fromCharCode(c); } return s; };
  if (tag(0) !== 'RIFF' || tag(8) !== 'sfbk') throw new Error('not an SF2 file');

  // Walk the RIFF LISTs, collecting the sdta/pdta sub-chunks we need.
  const chunks = {};
  let pos = 12;
  while (pos + 8 <= buf.byteLength) {
    const id = tag(pos), size = dv.getUint32(pos+4, true);
    if (id === 'LIST') {
      const listType = tag(pos+8);
      let p = pos + 12;
      const end = pos + 8 + size;
      while (p + 8 <= end) {
        const cid = tag(p), csz = dv.getUint32(p+4, true);
        if (listType === 'sdta' || listType === 'pdta') chunks[cid] = { off:p+8, size:csz };
        p += 8 + csz + (csz & 1);
      }
    }
    pos += 8 + size + (size & 1);
  }
  for (const need of ['smpl','phdr','pbag','pgen','inst','ibag','igen','shdr'])
    if (!chunks[need]) throw new Error('SF2 missing ' + need + ' chunk');

  const recs = (c, sz) => { const out=[]; for (let o=c.off; o+sz<=c.off+c.size; o+=sz) out.push(o); return out; };

  // Sample headers (46-byte records; last is the EOS terminator)
  const samples = recs(chunks.shdr, 46).map(o => ({
    name: str(o,20),
    start: dv.getUint32(o+20,true),     end: dv.getUint32(o+24,true),
    loopStart: dv.getUint32(o+28,true), loopEnd: dv.getUint32(o+32,true),
    rate: dv.getUint32(o+36,true) || 44100,
    rootKey: u8[o+40], pitchCorr: dv.getInt8(o+41),
    buffer: null,   // AudioBuffer, built lazily on first use
  }));

  const phdrO = recs(chunks.phdr, 38);
  const pbag  = recs(chunks.pbag, 4).map(o => dv.getUint16(o,true));                  // first pgen index
  const pgen  = recs(chunks.pgen, 4).map(o => ({ op:dv.getUint16(o,true), lo:u8[o+2], hi:u8[o+3],
                                                 amt:dv.getInt16(o+2,true), uamt:dv.getUint16(o+2,true) }));
  const insts = recs(chunks.inst, 22).map(o => dv.getUint16(o+20,true));              // first ibag index
  const ibag  = recs(chunks.ibag, 4).map(o => dv.getUint16(o,true));                  // first igen index
  const igen  = recs(chunks.igen, 4).map(o => ({ op:dv.getUint16(o,true), lo:u8[o+2], hi:u8[o+3],
                                                 amt:dv.getInt16(o+2,true), uamt:dv.getUint16(o+2,true) }));

  // Expand one instrument into key-ranged playback zones. A first zone without
  // a sample link is the instrument's global zone — its generators become the
  // defaults every following zone inherits.
  function instZones(instIdx) {
    const zones = [];
    const first = insts[instIdx];
    const last  = instIdx+1 < insts.length ? insts[instIdx+1] : ibag.length - 1;
    let global = {};
    for (let z = first; z < last; z++) {
      const gFirst = ibag[z], gLast = z+1 < ibag.length ? ibag[z+1] : igen.length;
      const zone = { ...global };
      let hasSample = false;
      for (let g = gFirst; g < gLast; g++) {
        const gen = igen[g];
        switch (gen.op) {
          case 43: zone.keyLo = gen.lo; zone.keyHi = gen.hi; break;        // keyRange
          case 48: zone.atten = gen.amt; break;                            // initialAttenuation (cB)
          case 51: zone.coarse = gen.amt; break;                           // coarseTune (semitones)
          case 52: zone.fine = gen.amt; break;                             // fineTune (cents)
          case 54: zone.loopMode = gen.amt; break;                         // 1|3 = looped
          case 58: zone.rootKey = gen.amt; break;                          // overridingRootKey
          case 38: zone.release = Math.pow(2, gen.amt/1200); break;        // releaseVolEnv (timecents → s)
          case 53: zone.sample = samples[gen.uamt]; hasSample = true; break; // sampleID (zone terminator)
        }
      }
      if (hasSample && zone.sample) zones.push(zone);
      else if (z === first) global = zone;
    }
    return zones;
  }

  // Presets (bank 0): resolve each preset's zones to its linked instrument's zones.
  const bank = new Map();
  for (let i = 0; i < phdrO.length - 1; i++) {           // last phdr record is EOP
    const o = phdrO[i];
    if (dv.getUint16(o+22,true) !== 0) continue;         // melodic bank 0 only
    const presetNum = dv.getUint16(o+20,true);
    const first = dv.getUint16(o+24,true);
    const last  = dv.getUint16(phdrO[i+1]+24,true);
    let zones = [];
    for (let z = first; z < last; z++) {
      const gFirst = pbag[z], gLast = z+1 < pbag.length ? pbag[z+1] : pgen.length;
      for (let g = gFirst; g < gLast; g++)
        if (pgen[g].op === 41) zones = zones.concat(instZones(pgen[g].uamt)); // instrument link
    }
    if (zones.length) bank.set(presetNum, { name: str(o,20), zones });
  }

  // 16-bit PCM sample pool (sliced copy so alignment never matters)
  const pcm = new Int16Array(buf.slice(chunks.smpl.off, chunks.smpl.off + chunks.smpl.size));
  return { bank, pcm };
}

// Fetch + parse the bank once; safe to call redundantly from any trigger.
function ensureSf2Loaded() {
  if (_sf2Promise) return _sf2Promise;
  _sf2Promise = (async () => {
    const r = await fetch(SF2_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    _sf2Bank = parseSf2(await r.arrayBuffer());
    setStatus(`SoundFont loaded — ${_sf2Bank.bank.size} presets ready`);
  })().catch(e => { _sf2Promise = null; setStatus('SoundFont load failed: ' + e.message, true); });
  return _sf2Promise;
}

// Lazily slice one sample's PCM into a mono AudioBuffer (context-independent,
// so the offline bounce can reuse the same buffers).
function sf2SampleBuffer(s, pcm) {
  if (s.buffer) return s.buffer;
  const n = Math.max(1, Math.min(s.end, pcm.length) - s.start);
  const ab = new AudioBuffer({ length:n, numberOfChannels:1,
                               sampleRate: clamp(s.rate, 8000, 96000) });
  const ch = ab.getChannelData(0);
  for (let i=0; i<n; i++) ch[i] = pcm[s.start+i] / 32768;
  s.buffer = ab;
  return ab;
}

function playSf2Note(instId, midiNote, dur, t, dest, velocity=100) {
  const ctx = audioCtx;
  const def = SF2_BY_ID[instId];
  if (!ctx || !def) return;
  if (!_sf2Bank) { ensureSf2Loaded(); return; }   // notes before first decode are skipped
  const preset = _sf2Bank.bank.get(def.preset);
  if (!preset) return;
  const zone = preset.zones.find(z => (z.keyLo ?? 0) <= midiNote && midiNote <= (z.keyHi ?? 127))
            || preset.zones[0];
  const s = zone.sample;
  const buffer = sf2SampleBuffer(s, _sf2Bank.pcm);

  const root  = (zone.rootKey ?? -1) >= 0 ? zone.rootKey : (s.rootKey <= 127 ? s.rootKey : 60);
  const semis = (midiNote - root) + (zone.coarse || 0) + ((zone.fine || 0) + s.pitchCorr) / 100;
  const rate  = Math.pow(2, semis / 12);

  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.playbackRate.value = rate;

  const looped = (zone.loopMode === 1 || zone.loopMode === 3) && s.loopEnd > s.loopStart + 8;
  if (looped) {
    src.loop = true;
    src.loopStart = (s.loopStart - s.start) / buffer.sampleRate;
    src.loopEnd   = (s.loopEnd   - s.start) / buffer.sampleRate;
  }

  const amp = clamp((velocity || 100) / 127, 0, 1) * 0.9
            * Math.pow(10, -Math.min(zone.atten || 0, 200) / 200);  // attenuation, ≤20 dB
  const natural = buffer.duration / rate;
  const hold = looped ? dur : Math.min(dur, natural);
  const atk  = Math.min(0.004, dur * 0.5);
  const rel  = clamp(zone.release ?? 0.1, 0.03, 0.6);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(amp, t + atk);
  g.gain.setValueAtTime(amp, t + Math.max(atk, hold));
  g.gain.linearRampToValueAtTime(0.0001, t + hold + rel);

  src.connect(g); g.connect(dest);
  src.start(t);
  src.stop(t + hold + rel + 0.02);
}

function playTrackMidiNote(track, midiNote, durSec, t, dest, velocity=100) {
  if (isSf2Instrument(track.instrument)) {
    playSf2Note(track.instrument, midiNote, durSec, t, dest, velocity);
    return;
  }
  playNote(track.instrument, midiToHz(midiNote), durSec, t, dest);
}

function playScheduledTrackNote(track, note, t, dest) {
  playTrackMidiNote(track, note.midiNote, beatToSec(note.duration), t, dest, note.velocity);
}

function playNote(instrument, freq, dur, t, dest) {
  switch(instrument) {
    case 'bell':    playBell(freq,dur,t,dest); break;
    case 'marimba': playMarimba(freq,dur,t,dest); break;
    case 'pluck':   playPluck(freq,dur,t,dest); break;
    case 'bass':    playBass(freq,dur,t,dest); break;
    case 'organ':    playOrgan(freq,dur,t,dest); break;
    case 'chip':     playChipSquare(freq,dur,t,dest); break;
    case 'chitri':   playChipTriangle(freq,dur,t,dest); break;
    case 'chisaw':   playChipSaw(freq,dur,t,dest); break;
    case 'piano':    playPiano(freq,dur,t,dest); break;
    case 'guitar':  playGuitar(freq,dur,t,dest); break;
    case 'flute':   playFlute(freq,dur,t,dest); break;
    case 'kick':    playKick(t,dest); break;
    case 'snare':   playSnare(t,dest); break;
    case 'hat':     playHat(t,dest); break;
    default:        playSynth(freq,dur,t,dest);
  }
}

// Wow & flutter helper — slow LFO that modulates oscillator pitch by ~0.2%
// Mimics tape deck speed fluctuations. depth = Hz deviation, rate = 2–4 Hz.
function addWow(ctx, freqParam, freq, t, dur) {
  const depth = freq * 0.002;        // 0.2% pitch wobble
  const rate  = 2.2 + Math.random(); // 2.2–3.2 Hz, slightly random per note
  const wow = ctx.createOscillator();
  const wowG = ctx.createGain();
  wow.type = 'sine';
  wow.frequency.value = rate;
  wowG.gain.value = depth;
  wow.connect(wowG);
  wowG.connect(freqParam);
  wow.start(t);
  wow.stop(t + dur + 0.1);
}

function playBell(freq,dur,t,dest) {
  const ctx=audioCtx;
  [{r:1,lv:0.11,d:Math.min(Math.max(dur*1.9,0.55),2.8)},
   {r:2.72,lv:0.05,d:0},{r:4.11,lv:0.028,d:0}].forEach((p,i)=>{
    const tail=i===0?p.d:p.d||p.d||Math.min(Math.max(dur*1.9,0.55),2.8)*(i===1?0.78:0.6);
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type='sine'; osc.frequency.value=freq*p.r;
    if(i===0) addWow(ctx, osc.frequency, freq*p.r, t, tail); // wow on fundamental
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(p.lv,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+tail);
    osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t+tail+0.04);
  });
}

function playMarimba(freq,dur,t,dest) {
  const ctx=audioCtx, tail=Math.min(Math.max(dur*0.72,0.16),0.95);
  const b=ctx.createOscillator(), ov=ctx.createOscillator(), ovG=ctx.createGain(), g=ctx.createGain();
  b.type='sine'; ov.type='sine';
  b.frequency.setValueAtTime(freq*1.02,t); b.frequency.exponentialRampToValueAtTime(freq,t+0.035);
  ov.frequency.value=freq*4.05;
  addWow(ctx, b.frequency, freq, t, tail);
  ovG.gain.setValueAtTime(0.035,t); ovG.gain.exponentialRampToValueAtTime(0.0001,t+tail*0.55);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.17,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+tail);
  b.connect(g); ov.connect(ovG); ovG.connect(g); g.connect(dest);
  noiseBurst(ctx,dest,t,0.015,'bandpass',1800,3,0.012);
  b.start(t); ov.start(t); b.stop(t+tail+0.03); ov.stop(t+tail+0.03);
}

function playPluck(freq,dur,t,dest) {
  const ctx=audioCtx;
  const minDly = 256/ctx.sampleRate;
  if(1/freq < minDly) { playGuitar(freq,dur,t,dest); return; }
  const period=1/freq;
  const bufSz=Math.max(Math.round(ctx.sampleRate*period),2);
  const nb=ctx.createBuffer(1,bufSz,ctx.sampleRate);
  const d=nb.getChannelData(0); for(let i=0;i<bufSz;i++) d[i]=Math.random()*2-1;
  const src=ctx.createBufferSource(); src.buffer=nb;
  const del=ctx.createDelay(0.5); del.delayTime.value=period;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=Math.min(freq*6, ctx.sampleRate/2-100);
  const fb=ctx.createGain();
  const out=ctx.createGain();

  // Schedule feedback gain to decay to 0 via Web Audio param automation —
  // this kills the KS feedback loop sample-accurately without any setTimeout.
  // setTargetAtTime exponentially approaches 0 with the given time constant.
  const decayTau = Math.max(0.1, dur * 0.4);
  fb.gain.setValueAtTime(0.975, t);
  fb.gain.setTargetAtTime(0, t + dur * 0.3, decayTau);

  // Output envelope
  out.gain.setValueAtTime(0.12, t);
  out.gain.setValueAtTime(0.12, t + dur);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur + Math.min(1.0, decayTau * 3));

  src.connect(del); del.connect(lp); lp.connect(fb); fb.connect(del);
  lp.connect(out); out.connect(dest);
  src.start(t); src.stop(t + period*2 + 0.01);
}

function playBass(freq,dur,t,dest) {
  const ctx=audioCtx;
  const osc=ctx.createOscillator(), vib=ctx.createOscillator(), vibG=ctx.createGain();
  const f=ctx.createBiquadFilter(), g=ctx.createGain();
  osc.type='sine'; osc.frequency.value=freq;
  vib.type='sine'; vib.frequency.value=3.2; vibG.gain.value=freq*0.008;
  f.type='lowpass'; f.frequency.value=freq*4; f.Q.value=0.7;
  const atk=0.06, rel=Math.min(0.4,dur*0.25);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.22,t+atk);
  g.gain.setValueAtTime(0.22,t+dur-rel); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.15);
  vib.connect(vibG); vibG.connect(osc.frequency);
  osc.connect(f); f.connect(g); g.connect(dest);
  vib.start(t); vib.stop(t+dur+0.2); osc.start(t); osc.stop(t+dur+0.2);
}

function playOrgan(freq,dur,t,dest) {
  const ctx=audioCtx;
  const master=ctx.createGain();
  const atk=0.015, rel=0.03;
  master.gain.setValueAtTime(0.0001,t); master.gain.linearRampToValueAtTime(0.12,t+atk);
  master.gain.setValueAtTime(0.12,t+dur-rel); master.gain.linearRampToValueAtTime(0.0001,t+dur+rel);
  master.connect(dest);
  [[1,0.4],[2,0.2],[3,0.1],[4,0.08],[6,0.04]].forEach(([h,lv],i)=>{
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type='sine'; osc.frequency.value=freq*h; g.gain.value=lv;
    if(i===0) addWow(ctx, osc.frequency, freq, t, dur+0.1);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t+dur+0.1);
  });
}

// ── CHIP SYNTH INSTRUMENTS ─────────────────────────────────────────
// Faithful to 8-bit hardware: square wave (NES pulse ch.), triangle (NES ch.3),
// sawtooth (SID/Mega Drive). All use instant/near-instant envelopes like the hardware.

function playChipSquare(freq, dur, t, dest) {
  // NES Pulse channel: 50% duty square wave, very fast attack, hard clip-style dynamics
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq, t);

  // Optional duty-cycle flavour: slight PWM via detune LFO
  const pwmLfo = ctx.createOscillator();
  pwmLfo.frequency.value = 7; // 7 Hz — fast shimmer
  const pwmGain = ctx.createGain(); pwmGain.gain.value = 3; // ±3 cent width
  pwmLfo.connect(pwmGain); pwmGain.connect(osc.detune);
  pwmLfo.start(t); pwmLfo.stop(t + dur + 0.05);

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.38, t + 0.003); // 3ms attack — instant feel
  g.gain.setValueAtTime(0.38, t + Math.max(0.003, dur - 0.008));
  g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.01);

  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + dur + 0.05);
}

function playChipTriangle(freq, dur, t, dest) {
  // NES Triangle channel: ultra-clean, no envelope ramp (hardware quirk = instant on/off)
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, t);

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.55, t);                 // NES triangle has no volume register
  g.gain.setValueAtTime(0.55, t + Math.max(0, dur - 0.003));
  g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.003);

  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + dur + 0.01);
}

function playChipSaw(freq, dur, t, dest) {
  // SID / Mega Drive: sawtooth with fast 8-bit-style ADSR
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, t);

  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = freq * 6; filt.Q.value = 1.2;

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.30, t + 0.005);
  g.gain.setValueAtTime(0.30, t + Math.max(0.005, dur - 0.02));
  g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.02);

  osc.connect(filt); filt.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + dur + 0.05);
}

function playPiano(freq,dur,t,dest) {
  const ctx=audioCtx, tail=Math.min(Math.max(dur*1.45,0.34),2.2);
  const b=ctx.createOscillator(), body=ctx.createOscillator();
  const f=ctx.createBiquadFilter(), g=ctx.createGain();
  b.type='triangle'; body.type='sine';
  b.frequency.value=freq; body.frequency.value=freq*2; body.detune.value=4;
  addWow(ctx, b.frequency, freq, t, tail);
  f.type='lowpass'; f.frequency.setValueAtTime(3400,t); f.frequency.exponentialRampToValueAtTime(920,t+tail); f.Q.value=0.9;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+tail);
  b.connect(f); body.connect(f); f.connect(g); g.connect(dest);
  noiseBurst(ctx,dest,t,0.03,'bandpass',2600,1.1,0.025);
  b.start(t); body.start(t); b.stop(t+tail+0.05); body.stop(t+tail+0.05);
}

function playGuitar(freq,dur,t,dest) {
  const ctx=audioCtx, tail=Math.min(Math.max(dur*1.1,0.24),1.4);
  const b=ctx.createOscillator(), shim=ctx.createOscillator();
  const f=ctx.createBiquadFilter(), g=ctx.createGain();
  b.type='triangle'; shim.type='sawtooth';
  b.frequency.setValueAtTime(freq*1.004,t); b.frequency.exponentialRampToValueAtTime(freq,t+0.05);
  addWow(ctx, b.frequency, freq, t, tail);
  shim.frequency.value=freq*2.01; shim.detune.value=-6;
  f.type='lowpass'; f.frequency.setValueAtTime(2100,t); f.frequency.exponentialRampToValueAtTime(820,t+tail); f.Q.value=1.4;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.16,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+tail);
  b.connect(f); shim.connect(f); f.connect(g); g.connect(dest);
  b.start(t); shim.start(t); b.stop(t+tail+0.03); shim.stop(t+tail+0.03);
}

function playFlute(freq,dur,t,dest) {
  const ctx=audioCtx, tail=Math.min(Math.max(dur+0.18,0.35),2.2);
  const b=ctx.createOscillator(), layer=ctx.createOscillator();
  const lfoO=ctx.createOscillator(), lfoG=ctx.createGain();
  const f=ctx.createBiquadFilter(), g=ctx.createGain();
  b.type='sine'; layer.type='triangle'; lfoO.type='sine';
  b.frequency.value=freq; layer.frequency.value=freq*1.002; layer.detune.value=3;
  addWow(ctx, b.frequency, freq, t, tail);
  lfoO.frequency.value=5.3; lfoG.gain.value=3.2;
  f.type='lowpass'; f.frequency.value=2500; f.Q.value=0.7;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.12,t+0.05);
  g.gain.setValueAtTime(0.1,t+Math.max(dur-0.04,0.08)); g.gain.exponentialRampToValueAtTime(0.0001,t+tail);
  lfoO.connect(lfoG); lfoG.connect(b.frequency); lfoG.connect(layer.frequency);
  b.connect(f); layer.connect(f); f.connect(g); g.connect(dest);
  b.start(t); layer.start(t); lfoO.start(t);
  b.stop(t+tail+0.04); layer.stop(t+tail+0.04); lfoO.stop(t+tail+0.04);
}

function playSynth(freq,dur,t,dest) {
  const ctx=audioCtx;
  const osc=ctx.createOscillator(), shim=ctx.createOscillator();
  const f=ctx.createBiquadFilter(), g=ctx.createGain();
  osc.type='triangle'; shim.type='sine';
  osc.frequency.value=freq; shim.frequency.value=freq*2; shim.detune.value=6;
  addWow(ctx, osc.frequency, freq, t, dur);
  f.type='lowpass'; f.frequency.value=2200; f.Q.value=1.6;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.16,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(f); shim.connect(f); f.connect(g); g.connect(dest);
  osc.start(t); shim.start(t); osc.stop(t+dur+0.04); shim.stop(t+dur+0.04);
}

function playKick(t,dest) {
  const ctx=audioCtx;
  const osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(140,t); osc.frequency.exponentialRampToValueAtTime(42,t+0.18);
  g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t+0.2);
}

function playSnare(t,dest) {
  const ctx=audioCtx;
  noiseBurst(ctx,dest,t,0.16,'highpass',1600,0.8,0.18);
  const osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type='triangle'; osc.frequency.value=220;
  g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
  osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t+0.12);
}

function playHat(t,dest) {
  noiseBurst(audioCtx,dest,t,0.05,'highpass',4200,0.5,0.08);
}

// ── SCHEDULER ──────────────────────────────────────────────────────
function startPlayback(fromBeat) {
  if (!powerOn) { setStatus('⏻ Powered off — click the power button to turn the engine on'); return; }
  if (!audioCtx) return;
  if (!project.sectionOrder.length) { setStatus('Nothing to play yet — generate a song or click the grid to start'); return; }
  isPlaying = true;
  playStartBeat = fromBeat ?? 0;
  playStartCtxTime = audioCtx.currentTime + 0.05;
  // Fade hiss in slowly to the user-configured level
  if (hissGainNode) hissGainNode.gain.setTargetAtTime(project.masterFx.hissLevel, audioCtx.currentTime, 1.2);
  scheduleCursor = playStartBeat;
  salsaCursor = playStartBeat;
  currentSectionPlayIdx = Math.max(0, project.sectionOrder.indexOf(activeSectionId));
  sectionBeatOffset = 0;
  ghostCursor = playStartBeat;
  ghostSectionIdx = currentSectionPlayIdx;
  ghostBeatOffset = 0;
  pruneDistantEngines();
  schedInterval = setInterval(scheduleAhead, SCHED_MS);
  document.getElementById('btn-play').textContent = '⏸ Pause';
  document.getElementById('btn-play').classList.add('playing');
  updatePlayingSectionHighlight();
  requestAnimationFrame(animLoop);
}

function stopPlayback() {
  isPlaying = false;
  clearInterval(schedInterval); schedInterval = null;
  // Fade hiss out slowly
  if (hissGainNode && audioCtx) hissGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 1.5);
  document.getElementById('btn-play').textContent = '▶ Play';
  document.getElementById('btn-play').classList.remove('playing');
  updatePlayingSectionHighlight();
  PR.dirty = true; schedRedraw();
}

function currentBeat() {
  if (!isPlaying || !audioCtx) return playStartBeat;
  return playStartBeat + secToBeat(audioCtx.currentTime - playStartCtxTime);
}

// A note is phrase-leading when no other note on the track ends within
// REVREV_GAP beats before it starts inside the same loop repetition (i.e. it
// opens the phrase — "the first word of the line"). Repetition/section starts
// deliberately count as leaders even when the previous rep ran right up to
// them: a continuous drone then gets one creeping lead-in per section instead
// of none. Chord notes sharing a start all qualify.
function isRevRevPhraseLeader(track, note) {
  const start = note.beatStart;
  for (const n of track.notes) {
    if (n === note) continue;
    if (n.beatStart < start && n.beatStart + n.duration > start - REVREV_GAP) return false;
  }
  return true;
}

// Feed one silent seed of the note into the reverse convolver REVREV_PREROLL
// early; the flipped IR turns it into a crescendo that peaks at the real onset.
// PITCH-AWARE: ears get dramatically more sensitive with pitch, so a flat
// seed level reads as a whisper on a low bass drone but a sudden blast on a
// high horn/chip line. Low, dark notes get lifted an octave (so their swell
// escapes the sub-bass mud) and boosted; from there the seed gain tapers off
// as pitch rises — a swell must announce its note, never overpower it.
function scheduleRevRevGhost(track, note, noteTime, now, engine) {
  const seedTime = noteTime - REVREV_PREROLL;
  if (seedTime < now + 0.02) return; // not enough runway (e.g. right after Play)
  const seedDur = Math.min(beatToSec(note.duration), 1.2);
  const lift = note.midiNote < 52 ? 12 : 0;          // register lift for dark low notes only
  const midi = Math.min(note.midiNote + lift, 108);
  // 1.6× at/below MIDI 50, sliding down to 0.5× at/above MIDI 90 (post-lift)
  const k = Math.min(1, Math.max(0, (midi - 50) / 40));
  const seedGain = audioCtx.createGain();
  seedGain.gain.value = 1.6 - k * 1.1;
  seedGain.connect(engine.ghostDest());
  playTrackMidiNote(track, midi, seedDur, seedTime, seedGain, note.velocity);
  // Free the per-seed node once the seed has fully sounded (live ctx only —
  // offline render contexts are discarded wholesale after the bounce).
  if (typeof OfflineAudioContext === 'undefined' || !(audioCtx instanceof OfflineAudioContext)) {
    setTimeout(() => { try { seedGain.disconnect(); } catch (e) {} },
               Math.max(0, seedTime - now + seedDur + 0.5) * 1000);
  }
}

// Pre-roll pass: identical section walk to scheduleAhead's main loop, but
// REVREV_PREROLL further ahead, and it only emits ghost seeds.
function scheduleRevRevGhosts(now) {
  const ghostUntil = secToBeat(now + LOOKAHEAD + REVREV_PREROLL - playStartCtxTime) + playStartBeat;

  while (ghostCursor < ghostUntil) {
    const secId = project.sectionOrder[ghostSectionIdx % project.sectionOrder.length];
    const section = project.sections[secId];
    if (!section) { ghostCursor += 1; continue; }

    const secLenBeats = Math.max(1, section.lengthBars * 4);
    const beatInSec   = ghostCursor - ghostBeatOffset;

    if (beatInSec >= secLenBeats) {
      ghostBeatOffset += secLenBeats;
      ghostSectionIdx++;
      continue;
    }

    const sliceEnd = Math.min(beatInSec + SCHED_MS/1000 * project.tempo/60 + 0.01, secLenBeats);
    const anySolo = Object.values(section.tracks).some(t=>t.soloed);

    for (const track of Object.values(section.tracks)) {
      if ((track.effects?.revrevSend || 0) <= 0.01) continue;
      if (track.muted || (anySolo && !track.soloed)) continue;
      if (!track.notes.length) continue;
      const engine = getOrCreateEngine(track);

      let rawLen = 0;
      for (const n of track.notes) rawLen = Math.max(rawLen, n.beatStart + n.duration);
      const trackLenBeats = Math.max(4, Math.ceil(rawLen / 4) * 4);

      const startLoop = Math.floor(beatInSec / trackLenBeats);
      const endLoop   = Math.floor((sliceEnd - 0.0001) / trackLenBeats);

      for (let loop = startLoop; loop <= endLoop; loop++) {
        for (const note of track.notes) {
          const noteBeat = loop * trackLenBeats + note.beatStart;
          if (noteBeat >= beatInSec && noteBeat < sliceEnd && noteBeat < secLenBeats &&
              isRevRevPhraseLeader(track, note)) {
            const t = playStartCtxTime + beatToSec(ghostBeatOffset + noteBeat - playStartBeat);
            scheduleRevRevGhost(track, note, t, now, engine);
          }
        }
      }
    }

    ghostCursor = ghostBeatOffset + sliceEnd;
    if (sliceEnd >= secLenBeats) {
      ghostBeatOffset += secLenBeats;
      ghostSectionIdx++;
    } else {
      break;
    }
  }
}

// ── Salsa mode (Godaigo in Spanish) ────────────────────────────────
// Turned on by JoytoneAPI.setSalsa(true) when the player picks Spanish.
// The tempo goes up a little (setTension) and a light salsa percussion
// layer plays over the song on the same beat clock: son clave 3-2, a
// cowbell on every beat (accents on 1 and 3) and a conga tumbao
// (slap on 2, open tones on 4 and "4-and"). It is synthesized here, so
// it needs no samples and never changes the song's own tracks.
let salsaMode = false;
let salsaCursor = 0;               // next 8th-note step (in beats) to schedule
const SALSA_TEMPO = 1.12;          // tempo factor in salsa mode
// Steps in 8ths over a 2-bar (8-beat) cycle: [step, kind, level]
const SALSA_PATTERN = [
  [0, 'clave', 1], [3, 'clave', 1], [6, 'clave', 1], [10, 'clave', 1], [12, 'clave', 1],
  [0, 'bell', 1], [2, 'bell', 0.6], [4, 'bell', 0.9], [6, 'bell', 0.6],
  [8, 'bell', 1], [10, 'bell', 0.6], [12, 'bell', 0.9], [14, 'bell', 0.6],
  [2, 'slap', 1], [6, 'conga', 0.9], [7, 'conga', 1],
  [10, 'slap', 1], [14, 'conga', 0.9], [15, 'conga', 1],
];

function salsaHit(kind, t, level) {
  const out = masterBus || audioCtx.destination;
  const g = audioCtx.createGain();
  g.connect(out);
  const stopAt = t + 0.4;
  if (kind === 'clave') {
    const o = audioCtx.createOscillator();
    o.type = 'sine'; o.frequency.setValueAtTime(2500, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22 * level, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g); o.start(t); o.stop(stopAt);
  } else if (kind === 'bell') {
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 1.2;
    bp.connect(g);
    for (const f of [562, 845]) {
      const o = audioCtx.createOscillator();
      o.type = 'square'; o.frequency.setValueAtTime(f, t);
      o.connect(bp); o.start(t); o.stop(stopAt);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07 * level, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  } else if (kind === 'conga') {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(240, t);
    o.frequency.exponentialRampToValueAtTime(190, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3 * level, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); o.start(t); o.stop(stopAt);
  } else if (kind === 'slap' && noiseBuffer) {
    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuffer;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1800;
    n.connect(hp); hp.connect(g);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16 * level, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    n.start(t, Math.random() * 0.5); n.stop(t + 0.1);
  }
  setTimeout(() => { try { g.disconnect(); } catch (e) {} },
             Math.max(0, stopAt - audioCtx.currentTime + 0.2) * 1000);
}

function scheduleSalsa(now, lookUntilBeat) {
  // Never schedule into the past (after a pause, or when salsa just turned on).
  const beatNow = currentBeat();
  if (salsaCursor < beatNow) salsaCursor = Math.ceil(beatNow * 2) / 2;
  while (salsaCursor < lookUntilBeat) {
    const step = ((Math.round(salsaCursor * 2) % 16) + 16) % 16;
    const t = playStartCtxTime + beatToSec(salsaCursor - playStartBeat);
    if (t >= now - 0.01) {
      for (const [st, kind, level] of SALSA_PATTERN) if (st === step) salsaHit(kind, t, level);
    }
    salsaCursor += 0.5;
  }
}

function scheduleAhead() {
  const now = audioCtx.currentTime;
  const lookUntilBeat = secToBeat(now + LOOKAHEAD - playStartCtxTime) + playStartBeat;

  scheduleRevRevGhosts(now);
  if (salsaMode) scheduleSalsa(now, lookUntilBeat);

  while (scheduleCursor < lookUntilBeat) {
    // which section are we in?
    const secId = project.sectionOrder[currentSectionPlayIdx % project.sectionOrder.length];
    const section = project.sections[secId];
    if (!section) { scheduleCursor += 1; continue; }

    const secLenBeats = Math.max(1, section.lengthBars * 4);  // guard against 0-length sections (would infinite-loop)
    const beatInSec   = scheduleCursor - sectionBeatOffset;

    if (beatInSec >= secLenBeats) {
      // advance to next section
      sectionBeatOffset += secLenBeats;
      currentSectionPlayIdx++;
      pruneDistantEngines();
      continue;
    }

    // schedule notes in this tick slice
    const sliceEnd = Math.min(beatInSec + SCHED_MS/1000 * project.tempo/60 + 0.01, secLenBeats);

    const anySolo = Object.values(section.tracks).some(t=>t.soloed);
    for (const track of Object.values(section.tracks)) {
      const engine = getOrCreateEngine(track);
      if (track.muted || (anySolo && !track.soloed)) continue;
      if (!track.notes.length) continue;

      // Compute this track's natural loop length (rounded up to nearest bar)
      // so short drum loops repeat to fill longer chord sections
      let rawLen = 0;
      for (const n of track.notes) rawLen = Math.max(rawLen, n.beatStart + n.duration);
      const trackLenBeats = Math.max(4, Math.ceil(rawLen / 4) * 4);

      // Find which loop repetitions overlap the current slice
      const startLoop = Math.floor(beatInSec / trackLenBeats);
      const endLoop   = Math.floor((sliceEnd - 0.0001) / trackLenBeats);

      for (let loop = startLoop; loop <= endLoop; loop++) {
        for (const note of track.notes) {
          const noteBeat = loop * trackLenBeats + note.beatStart;
          if (noteBeat >= beatInSec && noteBeat < sliceEnd && noteBeat < secLenBeats) {
            const t = playStartCtxTime + beatToSec(sectionBeatOffset + noteBeat - playStartBeat);
            if (t >= now - 0.01) {
              playScheduledTrackNote(track, note, t, engine.dest());
            }
          }
        }
      }
    }

    scheduleCursor = sectionBeatOffset + sliceEnd;
    if (sliceEnd >= secLenBeats) {
      if (pendingMidiSwap && pendingMidiSwap.sectionId === secId) {
        pendingMidiSwap.applyFn();
        pendingMidiSwap = null;
      }
      sectionBeatOffset += secLenBeats;
      currentSectionPlayIdx++;
      pruneDistantEngines();
    } else {
      break;
    }
  }
}

let animFrameId = null;
// Whether this app's UI is actually being looked at. True standalone (the
// designer's own tab). When embedded in Godaigo's hidden popup iframe, the
// bridge (onShown/onHidden below) drives this — it starts every game with
// the popup closed, so this gets set false before the first frame. Measured
// on this box: a display:none ancestor does NOT throttle requestAnimationFrame
// in a same-origin child iframe — rAF still fired at the monitor's full
// refresh rate whether the popup was shown or hidden. Left unguarded, that's
// a canvas redraw + DOM write every frame, for the whole game, for a view
// nobody can see.
let popupVisible = true;
function animLoop() {
  if (!isPlaying) return;
  if (!popupVisible) { animFrameId = null; return; }
  PR.dirty = true;
  schedRedraw();
  // Update playhead time display
  const beat = currentBeat();
  const secs = beatToSec(beat);
  const m = Math.floor(secs/60), s = Math.floor(secs%60);
  document.getElementById('playhead-time').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  updatePlayingSectionHighlight();
  followPlayingSection();
  animFrameId = requestAnimationFrame(animLoop);
}

// ── PIANO ROLL — CANVAS SETUP ──────────────────────────────────────
const gridCanvas = document.getElementById('grid-canvas');
const noteCanvas = document.getElementById('note-canvas');
const gCtx = gridCanvas.getContext('2d');
const nCtx = noteCanvas.getContext('2d');

function resizeCanvases() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (w === PR.width && h === PR.height) return;
  PR.width = w; PR.height = h;
  gridCanvas.width = noteCanvas.width = w;
  gridCanvas.height = noteCanvas.height = h;
  PR.gridDirty = true; PR.dirty = true;
}

// ── PIANO ROLL — DRAWING ───────────────────────────────────────────
function drawGrid() {
  if (!PR.gridDirty) return;
  PR.gridDirty = false;
  const ctx = gCtx;
  const { width: W, height: H, rowHeight: RH, pixelsPerBeat: PPB, scrollBeat: SB, scrollPitchPx: SP } = PR;

  ctx.clearRect(0, 0, W, H);

  // ── Time ruler ────────────────────────────────────────────────
  ctx.fillStyle = '#141418';
  ctx.fillRect(0, 0, W, RULER_H);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, KEYS_WIDTH, RULER_H);

  ctx.save();
  ctx.beginPath(); ctx.rect(KEYS_WIDTH, 0, W - KEYS_WIDTH, RULER_H); ctx.clip();
  const startBeat = Math.floor(SB);
  const endBeat   = Math.ceil(SB + (W - KEYS_WIDTH) / PPB) + 2;
  ctx.font = '10px monospace';
  for (let b = startBeat; b <= endBeat; b++) {
    const x = KEYS_WIDTH + (b - SB) * PPB;
    if (b % 4 === 0) {
      ctx.fillStyle = '#aaa'; ctx.textAlign = 'left';
      ctx.fillText(`${b/4+1}`, x+2, RULER_H-4);
      ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
    } else if (PPB >= 40) {
      ctx.strokeStyle = '#333'; ctx.lineWidth = 0.5;
    } else { continue; }
    ctx.beginPath(); ctx.moveTo(x, RULER_H-8); ctx.lineTo(x, RULER_H); ctx.stroke();
  }
  ctx.restore();
  // Ruler bottom border
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,RULER_H); ctx.lineTo(W,RULER_H); ctx.stroke();

  // ── Note area grid ────────────────────────────────────────────
  ctx.save();
  ctx.beginPath(); ctx.rect(KEYS_WIDTH, RULER_H, W - KEYS_WIDTH, H - RULER_H); ctx.clip();

  for (let m = MIDI_MAX; m >= MIDI_MIN; m--) {
    const y = RULER_H + (MIDI_MAX - m) * RH - SP;
    if (y + RH < RULER_H || y > H) continue;
    ctx.fillStyle = isBlack(m) ? '#1b1b24' : '#22222d';
    ctx.fillRect(KEYS_WIDTH, y, W - KEYS_WIDTH, RH);
    // C line
    if (m % 12 === 0) {
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(KEYS_WIDTH, y+RH); ctx.lineTo(W, y+RH); ctx.stroke();
    }
  }

  // Vertical beat lines
  for (let b = startBeat; b <= endBeat; b++) {
    const x = KEYS_WIDTH + (b - SB) * PPB;
    ctx.strokeStyle = b%4===0 ? '#3a3a48' : '#28282f';
    ctx.lineWidth   = b%4===0 ? 1 : 0.5;
    ctx.beginPath(); ctx.moveTo(x, RULER_H); ctx.lineTo(x, H); ctx.stroke();
    if (PPB >= 60) {
      const hx = x + PPB*0.5;
      ctx.strokeStyle = '#222228'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(hx, RULER_H); ctx.lineTo(hx, H); ctx.stroke();
    }
  }
  ctx.restore();

  // ── Piano keyboard ────────────────────────────────────────────
  ctx.save();
  ctx.beginPath(); ctx.rect(0, RULER_H, KEYS_WIDTH, H - RULER_H); ctx.clip();
  for (let m = MIDI_MAX; m >= MIDI_MIN; m--) {
    const y = RULER_H + (MIDI_MAX - m) * RH - SP;
    if (y + RH < RULER_H || y > H) continue;
    const blk = isBlack(m);
    ctx.fillStyle = blk ? '#1a1a1a' : '#2e2e2e';
    ctx.fillRect(0, y, KEYS_WIDTH - 1, RH);
    if (blk) { ctx.fillStyle='#111'; ctx.fillRect(KEYS_WIDTH-18, y, 18, RH); }
    if (m % 12 === 0) {
      ctx.fillStyle = '#777'; ctx.font = `${Math.min(RH-2,10)}px monospace`; ctx.textAlign='right';
      ctx.fillText(`C${Math.floor(m/12)-1}`, KEYS_WIDTH-22, y+RH-2);
    }
    ctx.strokeStyle = '#222'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(0, y+RH); ctx.lineTo(KEYS_WIDTH-1, y+RH); ctx.stroke();
  }
  // Key border
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(KEYS_WIDTH-0.5, RULER_H); ctx.lineTo(KEYS_WIDTH-0.5, H); ctx.stroke();
  ctx.restore();
}

let redrawQueued = false;
function schedRedraw() {
  if (!redrawQueued) { redrawQueued = true; requestAnimationFrame(doRedraw); }
}
function doRedraw() {
  redrawQueued = false;
  resizeCanvases();
  drawGrid();
  if (!PR.dirty) return;
  PR.dirty = false;
  drawNotes();
}

function drawNotes() {
  const ctx = nCtx;
  const { width: W, height: H, rowHeight: RH, pixelsPerBeat: PPB, scrollBeat: SB, scrollPitchPx: SP } = PR;
  ctx.clearRect(0, 0, W, H);

  const section = project?.sections[activeSectionId];
  if (!section) return;

  ctx.save();
  ctx.beginPath(); ctx.rect(KEYS_WIDTH, RULER_H, W-KEYS_WIDTH, H-RULER_H); ctx.clip();

  for (const track of Object.values(section.tracks)) {
    const color = track.color || '#7c6aff';
    for (const note of track.notes) {
      const x = KEYS_WIDTH + (note.beatStart - SB) * PPB;
      const w = note.duration * PPB;
      const y = RULER_H + (MIDI_MAX - note.midiNote) * RH - SP;
      const h = RH - 1;
      if (x+w < KEYS_WIDTH || x > W || y+h < RULER_H || y > H) continue;

      // Highlight if being dragged
      const isDrag = dragState && dragState.noteId === note.id;
      ctx.globalAlpha = isDrag ? 0.5 : 1;

      roundRect(ctx, Math.max(x, KEYS_WIDTH), y, Math.min(w-1, W-Math.max(x,KEYS_WIDTH)), h, 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = lighten(color, 30); ctx.lineWidth = 1; ctx.stroke();

      // Resize handle
      if (w > 8 && x+w <= W) {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(x+w-4, y+1, 3, h-2);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Drag ghost
  if (dragState?.type === 'move' && dragState.ghostNote) {
    const note = dragState.ghostNote;
    const color = dragState.trackColor || '#aaa';
    const x = KEYS_WIDTH + (note.beatStart - SB) * PPB;
    const y = RULER_H + (MIDI_MAX - note.midiNote) * RH - SP;
    const w = note.duration * PPB;
    const h = RH - 1;
    ctx.globalAlpha = 0.7;
    roundRect(ctx, x, y, w-1, h, 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // Playhead
  if (isPlaying) {
    const beat = currentBeat();
    // find beat within active section
    const secLenBeats = (project.sections[activeSectionId]?.lengthBars||2)*4;
    const beatInSec = ((beat - playStartBeat) % secLenBeats + secLenBeats) % secLenBeats;
    const px = KEYS_WIDTH + (beatInSec - SB) * PPB;
    if (px >= KEYS_WIDTH && px <= W) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,80,80,0.9)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(px, RULER_H); ctx.lineTo(px, H); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
}

// ── PIANO ROLL — INTERACTION ───────────────────────────────────────
function canvasCoords(e) {
  const rect = noteCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function xToBeat(x)     { return (x - KEYS_WIDTH) / PR.pixelsPerBeat + PR.scrollBeat; }
function yToMidi(y)     { return Math.round(MIDI_MAX - (y - RULER_H + PR.scrollPitchPx) / PR.rowHeight); }

function hitTest(x, y) {
  const section = project?.sections[activeSectionId];
  if (!section) return null;
  const beat = xToBeat(x), midi = yToMidi(y);
  // iterate tracks in reverse so topmost (last-added) gets hit first
  const tracks = Object.values(section.tracks).reverse();
  for (const track of tracks) {
    for (const note of [...track.notes].reverse()) {
      const nx = KEYS_WIDTH + (note.beatStart - PR.scrollBeat) * PR.pixelsPerBeat;
      const ny = RULER_H + (MIDI_MAX - note.midiNote) * PR.rowHeight - PR.scrollPitchPx;
      const nw = note.duration * PR.pixelsPerBeat;
      const nh = PR.rowHeight - 1;
      if (x >= nx && x <= nx+nw && y >= ny && y <= ny+nh) {
        const isResize = x >= nx+nw-6;
        return { track, note, isResize };
      }
    }
  }
  return null;
}

noteCanvas.addEventListener('mousedown', async e => {
  await ensureAudio();
  const { x, y } = canvasCoords(e);
  if (x < KEYS_WIDTH) {
    // keyboard preview
    const midi = yToMidi(y);
    if (midi >= MIDI_MIN && midi <= MIDI_MAX) {
      const track = ensureSelectedTrack();
      const eng = track ? getOrCreateEngine(track) : Object.values(trackEngines)[0];
      const dest = eng ? eng.dest() : masterBus;
      if (track) playTrackMidiNote(track, midi, 0.5, audioCtx.currentTime, dest, 100);
    }
    return;
  }
  if (y < RULER_H) {
    // seek
    const beat = xToBeat(x);
    playStartBeat = Math.max(0, beat);
    PR.dirty = true; schedRedraw(); return;
  }

  // Clicking the empty grid on a fresh start creates the first section.
  ensureStartingSection();

  const hit = hitTest(x, y);
  if (hit) selectTrack(hit.track.id, { render:false });
  if (activeTool === 'eraser' || e.button === 2) {
    if (hit) {
      pushUndo();
      hit.track.notes = hit.track.notes.filter(n => n.id !== hit.note.id);
      PR.dirty = true; schedRedraw(); saveProject();
    }
    return;
  }
  if (hit) {
    pushUndo();
    dragState = {
      type: hit.isResize ? 'resize' : 'move',
      noteId: hit.note.id,
      trackId: hit.track.id,
      trackColor: hit.track.color,
      startX: x, startY: y,
      origBeat: hit.note.beatStart,
      origMidi: hit.note.midiNote,
      origDur:  hit.note.duration,
      ghostNote: { ...hit.note },
    };
  }
});

noteCanvas.addEventListener('mousemove', e => {
  if (!dragState) return;
  const { x, y } = canvasCoords(e);
  const section = project.sections[activeSectionId];
  const track = section.tracks[dragState.trackId];
  if (!track) return;
  const note = track.notes.find(n => n.id === dragState.noteId);
  if (!note) return;

  if (dragState.type === 'resize') {
    const curBeat = xToBeat(x);
    const newDur  = Math.max(quantSnap||0.0625, snapBeat(curBeat - dragState.origBeat, quantSnap||0.0625));
    note.duration = newDur;
  } else if (dragState.type === 'move') {
    const db = xToBeat(x) - xToBeat(dragState.startX);
    const dm = yToMidi(y) - yToMidi(dragState.startY);
    const newBeat = snapBeat(Math.max(0, dragState.origBeat + db), quantSnap||0.0625);
    const newMidi = clamp(dragState.origMidi + dm, MIDI_MIN, MIDI_MAX);
    dragState.ghostNote = { ...note, beatStart: newBeat, midiNote: newMidi };
    note.beatStart = newBeat; note.midiNote = newMidi;
  }
  PR.dirty = true; schedRedraw();
});

noteCanvas.addEventListener('mouseup', () => {
  if (dragState) { dragState = null; saveProject(); }
});
noteCanvas.addEventListener('mouseleave', () => {
  if (dragState) { dragState = null; saveProject(); }
});
noteCanvas.addEventListener('contextmenu', e => e.preventDefault());

// Scroll
noteCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    // Zoom
    const factor = e.deltaY < 0 ? 1.15 : 0.87;
    PR.pixelsPerBeat = clamp(PR.pixelsPerBeat * factor, 10, 400);
    document.getElementById('zoom-label').textContent = Math.round(PR.pixelsPerBeat) + ' px/beat';
    PR.gridDirty = true;
  } else if (e.shiftKey) {
    PR.scrollPitchPx = clamp(PR.scrollPitchPx + e.deltaY * 0.5, 0, (MIDI_MAX - MIDI_MIN) * PR.rowHeight - (PR.height - RULER_H));
    PR.gridDirty = true;
  } else {
    PR.scrollBeat = Math.max(0, PR.scrollBeat + e.deltaY * 0.003 * (1000 / PR.pixelsPerBeat));
    PR.gridDirty = true;
  }
  PR.dirty = true; schedRedraw();
}, { passive: false });

function zoomIn()  { PR.pixelsPerBeat = clamp(PR.pixelsPerBeat*1.2,10,400); document.getElementById('zoom-label').textContent=Math.round(PR.pixelsPerBeat)+' px/beat'; PR.gridDirty=true; PR.dirty=true; schedRedraw(); }
function zoomOut() { PR.pixelsPerBeat = clamp(PR.pixelsPerBeat/1.2,10,400); document.getElementById('zoom-label').textContent=Math.round(PR.pixelsPerBeat)+' px/beat'; PR.gridDirty=true; PR.dirty=true; schedRedraw(); }
